services:
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis-data:/data"]
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 20}

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: amosclaud_logs
      POSTGRES_USER: amosclaud
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-amosclaud}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U amosclaud -d amosclaud_logs"], interval: 5s, timeout: 3s, retries: 20}

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-amosclaud}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-this-password}
    volumes: ["minio-data:/data"]
    ports: ["9001:9001"]

  logging-api:
    build: ../../services/logging-api
    environment:
      AMOSCLAUD_LOGGING_REDIS_URL: redis://redis:6379/0
      AMOSCLAUD_LOGGING_API_KEYS: ${AMOSCLAUD_LOGGING_API_KEYS:-local-dev-key:local}
      AMOSCLAUD_LOGGING_ADMIN_API_KEY: ${AMOSCLAUD_LOGGING_ADMIN_API_KEY:-}
    depends_on:
      redis: {condition: service_healthy}
    ports: ["8080:8080"]

  logging-worker:
    build: ../../services/logging-worker
    environment:
      AMOSCLAUD_LOGGING_REDIS_URL: redis://redis:6379/0
      AMOSCLAUD_LOGGING_DATABASE_URL: postgresql://amosclaud:${POSTGRES_PASSWORD:-amosclaud}@postgres:5432/amosclaud_logs
    depends_on:
      redis: {condition: service_healthy}
      postgres: {condition: service_healthy}

  logging-query:
    build: ../../services/logging-query
    environment:
      AMOSCLAUD_LOGGING_DATABASE_URL: postgresql://amosclaud:${POSTGRES_PASSWORD:-amosclaud}@postgres:5432/amosclaud_logs
      AMOSCLAUD_LOGGING_API_KEYS: ${AMOSCLAUD_LOGGING_API_KEYS:-local-dev-key:local}
      AMOSCLAUD_LOGGING_ADMIN_API_KEY: ${AMOSCLAUD_LOGGING_ADMIN_API_KEY:-}
    depends_on:
      postgres: {condition: service_healthy}
    ports: ["8081:8081"]

  logging-alerts:
    build: ../../services/logging-alerts
    environment:
      AMOSCLAUD_LOGGING_DATABASE_URL: postgresql://amosclaud:${POSTGRES_PASSWORD:-amosclaud}@postgres:5432/amosclaud_logs
      AMOSCLAUD_FIXEE_URL: ${AMOSCLAUD_FIXEE_URL:-}
      AMOSCLAUD_FIXEE_TOKEN: ${AMOSCLAUD_FIXEE_TOKEN:-}
    depends_on:
      postgres: {condition: service_healthy}

  logging-dashboard:
    build: ../../apps/logging-dashboard
    depends_on:
      logging-api: {condition: service_started}
      logging-query: {condition: service_started}
    ports: ["8082:80"]

  prometheus:
    image: prom/prometheus:v3.5.0
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]

volumes:
  redis-data:
  postgres-data:
  minio-data:
