services:
  workspace-worker:
    build:
      context: ../..
      dockerfile: workspace_worker/Dockerfile
    restart: unless-stopped
    user: "${AMOSCLAUD_WORKER_UID:-1000}:${AMOSCLAUD_WORKER_GID:-1000}"
    environment:
      AMOSCLAUD_ENV: production
      AMOSCLAUD_DOCKER_BINARY: docker
      DOCKER_HOST: unix:///run/amosclaud/docker.sock
      AMOSCLAUD_WORKSPACE_WORKER_TOKEN_FILE: /run/secrets/workspace_worker_token
      AMOSCLAUD_WORKSPACE_IMAGE: ${AMOSCLAUD_WORKSPACE_IMAGE:-ghcr.io/coder/code-server:4.96.4}
      AMOSCLAUD_WORKSPACE_USER: ${AMOSCLAUD_WORKSPACE_USER:-1000:1000}
      AMOSCLAUD_WORKSPACE_STORAGE_ROOT: /var/lib/amosclaud/workspaces
      AMOSCLAUD_REPOSITORY_STORAGE_ROOT: /var/lib/amosclaud/repositories
      AMOSCLAUD_WORKSPACE_NETWORK: amosclaud-workspace-internal
      AMOSCLAUD_WORKSPACE_MAX_CPU: "2"
      AMOSCLAUD_WORKSPACE_MAX_MEMORY_MB: "4096"
      AMOSCLAUD_WORKSPACE_MAX_PIDS: "512"
      AMOSCLAUD_WORKSPACE_EDITOR_URL_TEMPLATE: https://${AMOSCLAUD_DOMAIN:-www.amosclaud.com}/workspaces/{workspace_id}/editor
      AMOSCLAUD_WORKSPACE_TERMINAL_URL_TEMPLATE: wss://${AMOSCLAUD_DOMAIN:-www.amosclaud.com}/workspaces/{workspace_id}/terminal
    secrets:
      - workspace_worker_token
    volumes:
      - ${AMOSCLAUD_ROOTLESS_DOCKER_SOCKET:?Set a rootless Docker socket path}:/run/amosclaud/docker.sock
      - ${AMOSCLAUD_REPOSITORY_STORAGE_PATH:?Set persistent repository storage}:/var/lib/amosclaud/repositories
      - ${AMOSCLAUD_WORKSPACE_STORAGE_PATH:?Set persistent workspace storage}:/var/lib/amosclaud/workspaces
    expose:
      - "8092"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=128m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    cpus: 1.0
    mem_limit: 512m
    networks:
      - workspace-control

networks:
  workspace-control:
    internal: true

secrets:
  workspace_worker_token:
    file: ${AMOSCLAUD_WORKSPACE_WORKER_TOKEN_FILE:?Set the workspace worker token file}
