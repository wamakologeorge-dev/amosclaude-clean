name: Temporary Patch Ollama Repair Routing

on:
  push:
    branches:
      - fix/automatic-ollama-repair-routing
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out patch branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/automatic-ollama-repair-routing
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Install temporary test dependency
        run: python -m pip install --disable-pip-version-check pytest

      - name: Apply bounded routing patch
        run: python .github/scripts/patch_ollama_repair_routing.py

      - name: Verify routing contract
        run: python -m pytest -q tests/test_automatic_ollama_repair_routing.py

      - name: Commit real repair routing changes
        run: |
          set -euo pipefail
          git config user.name "amosclaud-maintenance[bot]"
          git config user.email "amosclaud-maintenance[bot]@users.noreply.github.com"
          git add .github/workflows/amosclaud-repair-control-plane.yml \
            .github/scripts/amosclaud_repair_candidate.py \
            tests/test_automatic_ollama_repair_routing.py
          git diff --cached --quiet && { echo "No routing changes required."; exit 0; }
          git commit -m "fix: route failed checks through Ollama repair agent"
          git push origin HEAD:fix/automatic-ollama-repair-routing
