name: Format Ecosystem Once

on:
  push:
    branches:
      - agent/full-repository-scan-fixer
    paths:
      - .github/workflows/format-ecosystem-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the exact repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/full-repository-scan-fixer
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Apply repository Black formatting
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check black
          black \
            scripts/ci/verify_amosclaud_ecosystem.py \
            tests/test_amosclaud_ecosystem_contract.py
          git rm .github/workflows/format-ecosystem-once.yml

      - name: Commit the exact formatter output
        run: |
          set -euo pipefail
          git config user.name 'amosclaud-actions[bot]'
          git config user.email 'amosclaud-actions[bot]@users.noreply.github.com'
          git add \
            scripts/ci/verify_amosclaud_ecosystem.py \
            tests/test_amosclaud_ecosystem_contract.py
          git diff --cached --check
          git commit -m 'style: format ecosystem verifier regression'
          git push origin HEAD:agent/full-repository-scan-fixer
