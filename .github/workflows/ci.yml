name: Apply provider status wording correction

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  apply-correction:
    if: github.head_ref == 'agent/fix-model-runtime-dashboard'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 1
          show-progress: false

      - name: Correct operational wording
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("amoscloud_ai/api/routes/platform_services.py")
          text = path.read_text(encoding="utf-8")
          old = "and station network are not required."
          new = (
              "and station network are not required, so the provider path "
              "is operational."
          )
          if new in text:
              raise SystemExit(0)
          if text.count(old) != 1:
              raise SystemExit(f"Expected one wording target, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

          if git diff --quiet -- amoscloud_ai/api/routes/platform_services.py; then
            echo "Wording is already corrected."
            exit 0
          fi
          git config user.name "Amosclaud Repair Bot"
          git config user.email "actions@users.noreply.github.com"
          git add amoscloud_ai/api/routes/platform_services.py
          git commit -m "Fix operational provider explanation"
          git push origin HEAD:${{ github.head_ref }}
