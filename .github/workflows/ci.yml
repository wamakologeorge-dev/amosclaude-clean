name: Apply provider status wording correction

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  apply-correction:
    if: github.head_ref == 'agent/fix-model-runtime-dashboard'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 1
          show-progress: false

      - name: Correct wording and restore normal CI
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("amoscloud_ai/api/routes/platform_services.py")
          text = path.read_text(encoding="utf-8")
          old = '            "and station network are not required.",\n'
          new = (
              '            "and station network are not required, so the provider path "\n'
              '            "is operational.",\n'
          )
          if text.count(old) != 1:
              raise SystemExit(f"Expected one wording target, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")

          original_ci = '''name: Amosclaud CI

          on:
            push:
              branches: [main]
            pull_request:
              branches: [main]

          permissions:
            contents: read

          jobs:
            test:
              runs-on: ubuntu-latest

              steps:
                - name: Check out repository
                  uses: actions/checkout@v7

                - name: Set up Python
                  uses: actions/setup-python@v7
                  with:
                    python-version: "3.11"
                    cache: pip

                - name: Install dependencies
                  run: |
                    python -m pip install --upgrade pip
                    python -m pip install -r requirements.txt

                - name: Lint critical errors
                  run: |
                    flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

                - name: Run tests
                  run: pytest
          '''
          original_ci = "\n".join(
              line[10:] if line.startswith("          ") else line
              for line in original_ci.splitlines()
          ) + "\n"
          Path(".github/workflows/ci.yml").write_text(original_ci, encoding="utf-8")
          PY

          git config user.name "Amosclaud Repair Bot"
          git config user.email "actions@users.noreply.github.com"
          git add amoscloud_ai/api/routes/platform_services.py .github/workflows/ci.yml
          git commit -m "Fix operational provider explanation"
          git push origin HEAD:${{ github.head_ref }}
