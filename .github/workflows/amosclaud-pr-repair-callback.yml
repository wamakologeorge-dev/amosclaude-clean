name: Amosclaud PR Repair Callback

on:
  workflow_run:
    workflows:
      - "Amosclaud CI"
      - "CI/CD — Test & Deploy"
      - "Python package"
      - "Build and Verify"
      - "Amosclaud Workspace CI"
      - "Docker Image CI"
      - "CodeQL"
      - "Fortify AST Scan"
      - "Real Operations Audit"
      - "Amosclaud AI Feedback Loop"
      - "Amosclaud CI/CD Pipeline"
      - "Amosclaud Bot"
      - "🏗️ Platform Build Check"
      - "🚀 Amosclaud AI — Live Server Check"
      - "🚀 Amosclaud AI - CI Pipeline"
    types: [completed]

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: amosclaud-pr-repair-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  repair-callback:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out trusted callback code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Install focused test dependency
        run: python -m pip install --disable-pip-version-check pytest

      - name: Verify callback policy before privileged use
        run: python -m pytest -q tests/test_ci_repair_callback.py

      - name: Require the Amosclaud GitHub credential
        env:
          AMOSCLAUD_GITHUB_TOKEN: ${{ secrets.AMOSCLAUD_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$AMOSCLAUD_GITHUB_TOKEN" || {
            echo "AMOSCLAUD_GITHUB_TOKEN is required for same-PR repair callbacks."
            exit 1
          }

      - name: Prepare bounded repair callback from trusted metadata
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          PR_NUMBER=$(gh api "repos/${REPOSITORY}/actions/runs/${RUN_ID}" --jq '.pull_requests[0].number // empty')
          if [ -z "$PR_NUMBER" ]; then
            echo "status=skip" >> "$GITHUB_OUTPUT"
            echo "No pull request is associated with this workflow run."
            exit 0
          fi

          gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}" > /tmp/amosclaud-pull-request.json
          gh api "repos/${REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100" > /tmp/amosclaud-pr-comments.json
          if ! gh run view "$RUN_ID" --repo "$REPOSITORY" --log-failed > /tmp/amosclaud-failed.log 2>&1; then
            {
              printf 'Failed workflow logs were unavailable for run %s.\n' "$RUN_ID"
              gh api "repos/${REPOSITORY}/actions/runs/${RUN_ID}/jobs" \
                --jq '.jobs[] | select(.conclusion == "failure") | "JOB: \(.name)\n" + ([.steps[] | select(.conclusion == "failure") | "  STEP: \(.name)"] | join("\n"))' \
                || true
            } > /tmp/amosclaud-failed.log
          fi

          python -m amosclaud_bot.ci_repair_callback \
            --event "$GITHUB_EVENT_PATH" \
            --pull-request /tmp/amosclaud-pull-request.json \
            --comments /tmp/amosclaud-pr-comments.json \
            --logs /tmp/amosclaud-failed.log \
            --comment-output /tmp/amosclaud-callback.md \
            --decision-output /tmp/amosclaud-decision.json \
            --max-attempts 5

          STATUS=$(python -c 'import json; print(json.load(open("/tmp/amosclaud-decision.json"))["status"])')
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          cat /tmp/amosclaud-decision.json >> "$GITHUB_STEP_SUMMARY"

      - name: Publish repair command to the same pull request
        if: steps.prepare.outputs.status == 'dispatch'
        env:
          GH_TOKEN: ${{ secrets.AMOSCLAUD_GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.prepare.outputs.pr_number }}
        run: |
          set -euo pipefail
          gh pr comment "$PR_NUMBER" --body-file /tmp/amosclaud-callback.md

      - name: Publish bounded-attempt blocker
        if: steps.prepare.outputs.status == 'exhausted'
        env:
          GH_TOKEN: ${{ secrets.AMOSCLAUD_GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.prepare.outputs.pr_number }}
        run: |
          set -euo pipefail
          gh pr comment "$PR_NUMBER" --body-file /tmp/amosclaud-callback.md

      - name: Record skipped callback
        if: >-
          steps.prepare.outputs.status == 'skip' ||
          steps.prepare.outputs.status == 'duplicate'
        run: echo "No additional repair command was required."
