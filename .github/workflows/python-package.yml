# This workflow installs Python dependencies, runs tests, and captures failures.

name: Python package

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  agent-status:
    runs-on: ${{ vars.AMOSCLAUD_CI_RUNNER || 'ubuntu-latest' }}
    name: Amosclaud-ai Status
    timeout-minutes: 2
    steps:
      - name: Report Agent Activity
        run: |
          echo "=================================================="
          echo "Amosclaud-ai is currently analyzing and working."
          echo "=================================================="
          echo "Live and active"

  build:
    runs-on: ${{ vars.AMOSCLAUD_CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.16"
          enable-cache: true
          cache-dependency-glob: requirements.txt
          cache-suffix: py-${{ matrix.python-version }}

      - name: Lint with flake8
        id: flake8
        shell: bash
        run: |
          set +e
          strict_log="flake8-strict-${{ matrix.python-version }}.log"
          report_log="flake8-report-${{ matrix.python-version }}.log"
          uv run --no-project --with-requirements requirements.txt \
            flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics \
            >"$strict_log" 2>&1
          status=$?
          cat "$strict_log"
          uv run --no-project --with-requirements requirements.txt \
            flake8 . --count --exit-zero --max-complexity=10 \
            --max-line-length=127 --statistics >"$report_log" 2>&1
          cat "$report_log"
          exit "$status"

      - name: Test with pytest
        id: pytest
        shell: bash
        run: |
          set +e
          uv run --no-project --with-requirements requirements.txt \
            pytest tests/ -q > pytest-${{ matrix.python-version }}.log 2>&1
          status=$?
          cat pytest-${{ matrix.python-version }}.log
          exit "$status"

      - name: Upload Python diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: python-${{ matrix.python-version }}-diagnostics
          path: |
            flake8-strict-${{ matrix.python-version }}.log
            flake8-report-${{ matrix.python-version }}.log
            pytest-${{ matrix.python-version }}.log
          if-no-files-found: warn

      - name: Report Python failure
        if: failure() && github.event_name == 'pull_request' && matrix.python-version == '3.12'
        env:
          GH_TOKEN: ${{ secrets.AMOSCLAUD_GITHUB_TOKEN || github.token }}
        shell: bash
        run: |
          {
            echo '### Python verification failed'
            echo
            if [ -s flake8-strict-${{ matrix.python-version }}.log ]; then
              echo '#### Strict flake8'
              echo '```text'
              tail -n 120 flake8-strict-${{ matrix.python-version }}.log
              echo '```'
            fi
            if [ -s pytest-${{ matrix.python-version }}.log ]; then
              echo '#### Pytest'
              echo '```text'
              tail -n 120 pytest-${{ matrix.python-version }}.log
              echo '```'
            fi
          } > python-comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file python-comment.md
