name: Publish Docker image

on:
  push:
    branches: ["main"]
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish:
    name: Build and publish control-plane image
    if: >-
      github.event_name != 'workflow_dispatch' ||
      github.ref_name == github.event.repository.default_branch
    runs-on: ${{ vars.AMOSCLAUD_CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c

      - name: Log in to GitHub Container Registry
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login "$REGISTRY" --username "$GHCR_USERNAME" --password-stdin

      - name: Prepare image tags
        id: metadata
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          image="${REGISTRY}/${IMAGE_NAME,,}"
          short_sha="${GITHUB_SHA::12}"
          tags=("${image}:sha-${short_sha}")

          if [[ "$GITHUB_REF_TYPE" == "branch" && "$GITHUB_REF_NAME" == "$DEFAULT_BRANCH" ]]; then
            tags+=("${image}:latest")
          fi

          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
            tags+=("${image}:${version}" "${image}:${GITHUB_REF_NAME}")
          fi

          {
            echo "image=${image}"
            echo "tags<<EOF"
            printf '%s\n' "${tags[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          pull: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          cache-from: type=gha,scope=amosclaud-control-plane-publish
          cache-to: type=gha,mode=max,scope=amosclaud-control-plane-publish
          provenance: false
          sbom: false

      - name: Publish summary
        run: |
          {
            echo "## Docker image published"
            echo
            echo "Registry: \`${{ steps.metadata.outputs.image }}\`"
            echo
            echo "Tags:"
            while IFS= read -r tag; do
              [[ -n "$tag" ]] && echo "- \`$tag\`"
            done <<< "${{ steps.metadata.outputs.tags }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Log out from GitHub Container Registry
        if: always()
        run: docker logout "$REGISTRY" || true
