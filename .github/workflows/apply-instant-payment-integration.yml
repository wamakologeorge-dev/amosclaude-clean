name: Apply instant payment integration

on:
  push:
    branches:
      - feat/cash-app-bitcoin-timed-access
    paths:
      - .github/workflows/apply-instant-payment-integration.yml

permissions:
  contents: write

concurrency:
  group: apply-instant-payment-integration
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init repository
          cd repository
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_REF_NAME}"
          git checkout -B "${GITHUB_REF_NAME}" FETCH_HEAD

      - name: Wire providers into billing, runtime, and security
        run: |
          set -euo pipefail
          cd repository
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f"Expected integration marker missing in {path}: {old[:80]!r}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "amoscloud_ai/api/routes/billing.py",
              "from amoscloud_ai.api.routes.auth import _connect, get_user_from_session\n",
              "from amoscloud_ai.api.routes.auth import _connect, get_user_from_session\n"
              "from amoscloud_ai.payment_entitlements import (\n"
              "    active_time_entitlement,\n"
              "    ensure_payment_schema,\n"
              ")\n",
          )
          replace_once(
              "amoscloud_ai/api/routes/billing.py",
              "        \"\"\"\n    )\n    db.commit()\n\n\ndef _stripe_ready",
              "        \"\"\"\n    )\n    ensure_payment_schema(db)\n    db.commit()\n\n\ndef _stripe_ready",
          )
          replace_once(
              "amoscloud_ai/api/routes/billing.py",
              "    return {\n        \"plan\": \"community\",",
              "    timed = active_time_entitlement(db, user_id)\n"
              "    if timed:\n"
              "        return {\n"
              "            \"plan\": \"full\",\n"
              "            \"active\": True,\n"
              "            \"source\": timed[\"provider\"],\n"
              "            \"status\": timed[\"status\"],\n"
              "            \"billing_interval\": \"one_time\",\n"
              "            \"renews_at\": timed[\"expires_at\"],\n"
              "            \"remaining_seconds\": timed[\"remaining_seconds\"],\n"
              "            \"features\": PLAN_FEATURES[\"full\"],\n"
              "        }\n\n"
              "    return {\n        \"plan\": \"community\",",
          )

          replace_once(
              "amoscloud_ai/main.py",
              "    health,\n",
              "    health,\n    instant_payments,\n",
          )
          replace_once(
              "amoscloud_ai/main.py",
              "    app.include_router(billing.router, prefix=\"/api/v1\")\n",
              "    app.include_router(billing.router, prefix=\"/api/v1\")\n"
              "    app.include_router(instant_payments.router, prefix=\"/api/v1\")\n",
          )

          replace_once(
              "amoscloud_ai/security.py",
              '            "camera=(), microphone=(), geolocation=(), payment=()",\n',
              '            "camera=(), microphone=(), geolocation=(), "\n'
              '            \'payment=(self "https://web.squarecdn.com" \'\n'
              '            \'"https://sandbox.web.squarecdn.com")\',\n',
          )
          replace_once(
              "amoscloud_ai/security.py",
              '            "style-src \'self\' \'unsafe-inline\' https://cdn.jsdelivr.net; "\n'
              '            "script-src \'self\' https://cdn.jsdelivr.net; "\n'
              '            "connect-src \'self\' https: wss:; "\n'
              '            "object-src \'none\'; base-uri \'self\'; frame-ancestors \'none\'; "\n',
              '            "style-src \'self\' \'unsafe-inline\' https://cdn.jsdelivr.net "\n'
              '            "https://web.squarecdn.com https://sandbox.web.squarecdn.com; "\n'
              '            "script-src \'self\' https://cdn.jsdelivr.net "\n'
              '            "https://web.squarecdn.com https://sandbox.web.squarecdn.com; "\n'
              '            "frame-src \'self\' https://web.squarecdn.com "\n'
              '            "https://sandbox.web.squarecdn.com; "\n'
              '            "font-src \'self\' data: "\n'
              '            "https://square-fonts-production-f.squarecdn.com "\n'
              '            "https://d1g145x70srn7h.cloudfront.net; "\n'
              '            "connect-src \'self\' https: wss: "\n'
              '            "https://pci-connect.squareup.com "\n'
              '            "https://pci-connect.squareupsandbox.com; "\n'
              '            "object-src \'none\'; base-uri \'self\'; frame-ancestors \'none\'; "\n',
          )

          env_path = Path(".env.production.example")
          env_text = env_path.read_text(encoding="utf-8")
          marker = "# Verified one-time payment access."
          if marker not in env_text:
              env_text += """

# Verified one-time payment access. A successful $15 payment grants the Full
# Package for 30 days by default. Change these values before deployment if your
# published offer is different.
AMOSCLAUD_INSTANT_PRICE_CENTS=1500
AMOSCLAUD_INSTANT_ACCESS_DAYS=30
AMOSCLAUD_PAYMENT_ORDER_MINUTES=20

# Cash App Pay through Square. Keep tokens and signature keys only in Railway.
SQUARE_ENVIRONMENT=production
SQUARE_APPLICATION_ID=
SQUARE_LOCATION_ID=
SQUARE_MERCHANT_ID=
SQUARE_API_VERSION=2026-05-20
# SQUARE_ACCESS_TOKEN=<set in Railway>
# SQUARE_WEBHOOK_SIGNATURE_KEY=<set in Railway>
SQUARE_WEBHOOK_NOTIFICATION_URL=https://www.amosclaud.com/api/v1/billing/webhooks/square

# Bitcoin through a merchant-controlled BTCPay Server store. Use an API key
# restricted to viewing and creating invoices for this store.
BTCPAY_SERVER_URL=
BTCPAY_STORE_ID=
# BTCPAY_API_KEY=<set in Railway>
# BTCPAY_WEBHOOK_SECRET=<set in Railway>
"""
              env_path.write_text(env_text, encoding="utf-8")

          instant = Path("amoscloud_ai/api/routes/instant_payments.py")
          instant_text = instant.read_text(encoding="utf-8")
          instant_text = instant_text.replace(
              'SQUARE_API_VERSION_DEFAULT = "2026-07-15"',
              'SQUARE_API_VERSION_DEFAULT = "2026-05-20"',
          )
          instant_text = instant_text.replace(
              '        "customer_details": {\n'
              '            "customer_initiated": True,\n'
              '            "seller_keyed_in": False,\n'
              '        },\n',
              "",
          )
          instant.write_text(instant_text, encoding="utf-8")

          plans = Path("web/plans.js")
          plans_text = plans.read_text(encoding="utf-8")
          plans_text = plans_text.replace(
              "    const check = async () => {\n",
              "    let finished = false;\n    const check = async () => {\n",
              1,
          )
          plans_text = plans_text.replace(
              "          openWorkspace(result);\n          return;\n",
              "          finished = true;\n          openWorkspace(result);\n          return;\n",
              1,
          )
          plans_text = plans_text.replace(
              "          say('The payment was not completed. Start a new checkout.', true);\n",
              "          finished = true;\n          say('The payment was not completed. Start a new checkout.', true);\n",
              1,
          )
          plans_text = plans_text.replace(
              "    if (!paymentPoll) paymentPoll = window.setInterval(check, 3000);\n",
              "    if (!finished && !paymentPoll) paymentPoll = window.setInterval(check, 3000);\n",
              1,
          )
          plans.write_text(plans_text, encoding="utf-8")
          PY

      - name: Add payment security and entitlement tests
        run: |
          set -euo pipefail
          cd repository
          cat > tests/test_instant_payment_entitlements.py <<'PY'
          import base64
          import hashlib
          import hmac
          import sqlite3
          from datetime import datetime, timedelta, timezone

          from amoscloud_ai.api.routes import instant_payments
          from amoscloud_ai.payment_entitlements import (
              active_time_entitlement,
              create_payment_order,
              grant_payment_entitlement,
          )


          def database() -> sqlite3.Connection:
              db = sqlite3.connect(":memory:")
              db.row_factory = sqlite3.Row
              db.execute("CREATE TABLE users(id INTEGER PRIMARY KEY)")
              db.execute("INSERT INTO users(id) VALUES (1)")
              return db


          def test_payment_grant_is_idempotent_and_a_new_payment_extends_time(monkeypatch) -> None:
              monkeypatch.setenv("AMOSCLAUD_INSTANT_ACCESS_DAYS", "30")
              db = database()
              first = create_payment_order(db, user_id=1, provider="cash_app")
              granted = grant_payment_entitlement(
                  db,
                  public_id=first["public_id"],
                  provider_payment_id="square-payment-1",
              )
              first_expiry = datetime.fromisoformat(granted["expires_at"])

              replay = grant_payment_entitlement(
                  db,
                  public_id=first["public_id"],
                  provider_payment_id="square-payment-1",
              )
              assert replay["expires_at"] == granted["expires_at"]

              second = create_payment_order(db, user_id=1, provider="bitcoin")
              extended = grant_payment_entitlement(
                  db,
                  public_id=second["public_id"],
                  provider_payment_id="btcpay-invoice-2",
              )
              second_expiry = datetime.fromisoformat(extended["expires_at"])
              assert second_expiry >= first_expiry + timedelta(days=30)


          def test_expired_payment_access_auto_locks(monkeypatch) -> None:
              monkeypatch.setenv("AMOSCLAUD_INSTANT_ACCESS_DAYS", "1")
              db = database()
              order = create_payment_order(db, user_id=1, provider="bitcoin")
              grant_payment_entitlement(
                  db,
                  public_id=order["public_id"],
                  provider_payment_id="btcpay-expired",
              )
              past = (datetime.now(timezone.utc) - timedelta(seconds=1)).isoformat()
              db.execute(
                  "UPDATE billing_time_entitlements SET expires_at=? WHERE user_id=1",
                  (past,),
              )
              db.commit()
              assert active_time_entitlement(db, 1) is None
              row = db.execute(
                  "SELECT status FROM billing_time_entitlements WHERE user_id=1"
              ).fetchone()
              assert row["status"] == "expired"


          def test_square_and_btcpay_webhook_signatures(monkeypatch) -> None:
              body = b'{"event_id":"event-1"}'
              notification_url = "https://www.amosclaud.com/api/v1/billing/webhooks/square"
              monkeypatch.setenv("SQUARE_WEBHOOK_SIGNATURE_KEY", "square-secret")
              monkeypatch.setenv("SQUARE_WEBHOOK_NOTIFICATION_URL", notification_url)
              square_digest = hmac.new(
                  b"square-secret",
                  notification_url.encode() + body,
                  hashlib.sha256,
              ).digest()
              square_signature = base64.b64encode(square_digest).decode()
              assert instant_payments._verify_square_signature(body, square_signature)
              assert not instant_payments._verify_square_signature(body, "wrong")

              monkeypatch.setenv("BTCPAY_WEBHOOK_SECRET", "bitcoin-secret")
              btcpay_signature = "sha256=" + hmac.new(
                  b"bitcoin-secret", body, hashlib.sha256
              ).hexdigest()
              assert instant_payments._verify_btcpay_signature(body, btcpay_signature)
              assert not instant_payments._verify_btcpay_signature(body, "sha256=wrong")
          PY

          cat > tests/test_instant_payment_contract.py <<'PY'
          from pathlib import Path

          ROOT = Path(__file__).resolve().parents[1]


          def read(path: str) -> str:
              return (ROOT / path).read_text(encoding="utf-8")


          def test_runtime_mounts_verified_instant_payment_router() -> None:
              main = read("amoscloud_ai/main.py")
              assert "instant_payments," in main
              assert 'app.include_router(instant_payments.router, prefix="/api/v1")' in main


          def test_plan_page_offers_provider_verified_cash_app_and_bitcoin() -> None:
              page = read("web/plans.html")
              script = read("web/plans.js")
              assert "Cash App Pay" in page
              assert "Bitcoin" in page
              assert "/static/plans.js" in page
              assert "/api/v1/billing/instant/cash-app/complete" in script
              assert "/api/v1/billing/instant/bitcoin/start" in script
              assert "/api/v1/billing/instant/orders/" in script
              assert "$cashtag" not in page.lower()


          def test_square_csp_and_production_configuration_are_documented() -> None:
              security = read("amoscloud_ai/security.py")
              example = read(".env.production.example")
              assert "https://web.squarecdn.com" in security
              assert "https://sandbox.web.squarecdn.com" in security
              assert "https://pci-connect.squareup.com" in security
              for variable in (
                  "AMOSCLAUD_INSTANT_PRICE_CENTS=1500",
                  "AMOSCLAUD_INSTANT_ACCESS_DAYS=30",
                  "SQUARE_APPLICATION_ID=",
                  "SQUARE_WEBHOOK_NOTIFICATION_URL=",
                  "BTCPAY_SERVER_URL=",
                  "BTCPAY_STORE_ID=",
              ):
                  assert variable in example
          PY

      - name: Verify syntax and focused tests
        run: |
          set -euo pipefail
          cd repository
          python -m pip install --disable-pip-version-check --quiet \
            "fastapi>=0.110,<1" "pydantic>=2.7,<3" "httpx>=0.27,<1" \
            "redis>=5,<9" "python-jose[cryptography]>=3.3,<4" \
            "passlib>=1.7,<2" "bcrypt>=4.1,<5" "pytest>=8,<10"
          python -m py_compile \
            amoscloud_ai/payment_entitlements.py \
            amoscloud_ai/api/routes/instant_payments.py \
            amoscloud_ai/api/routes/billing.py \
            amoscloud_ai/main.py \
            amoscloud_ai/security.py
          node --check web/plans.js
          python -m pytest -q \
            tests/test_instant_payment_entitlements.py \
            tests/test_instant_payment_contract.py

      - name: Commit integrated feature
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd repository
          rm -f .github/workflows/apply-instant-payment-integration.yml
          git config user.name "Amosclaud Payment Builder"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat(billing): integrate verified timed payment access"
          git push origin "HEAD:${GITHUB_REF_NAME}"
