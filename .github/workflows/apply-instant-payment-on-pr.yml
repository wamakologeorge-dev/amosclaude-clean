name: Apply instant payment feature

on:
  pull_request:
    branches: [main]
    paths:
      - "amoscloud_ai/payment_entitlements.py"
      - "amoscloud_ai/api/routes/instant_payments.py"
      - "scripts/apply_instant_payment_integration.py"
      - "web/plans.html"
      - "web/plans.js"
      - ".github/workflows/apply-instant-payment-on-pr.yml"

permissions:
  contents: write

concurrency:
  group: apply-instant-payment-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply-and-verify:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out the pull request branch
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git init repository
          cd repository
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${HEAD_BRANCH}"
          git checkout -B "${HEAD_BRANCH}" FETCH_HEAD

      - name: Apply production integration
        run: |
          set -euo pipefail
          cd repository
          python scripts/apply_instant_payment_integration.py

      - name: Verify feature
        run: |
          set -euo pipefail
          cd repository
          python -m pip install --disable-pip-version-check --quiet -r requirements.txt
          python -m py_compile \
            amoscloud_ai/payment_entitlements.py \
            amoscloud_ai/api/routes/instant_payments.py \
            amoscloud_ai/api/routes/billing.py \
            amoscloud_ai/main.py \
            amoscloud_ai/security.py
          node --check web/plans.js
          python -m pytest -q \
            tests/test_instant_payment_entitlements.py \
            tests/test_instant_payment_contract.py

      - name: Commit verified integration
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          cd repository
          rm -f scripts/apply_instant_payment_integration.py
          rm -f .github/workflows/apply-instant-payment-integration.yml
          rm -f .github/workflows/apply-instant-payment-on-pr.yml
          git config user.name "Amosclaud Payment Builder"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "feat(billing): integrate verified timed payment access"
          git push origin "HEAD:${HEAD_BRANCH}"
