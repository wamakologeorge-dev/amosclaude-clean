name: Amosclaud Repair Control Plane

on:
  workflow_run:
    workflows:
      - Fast PR Gate
      - Repository Behavior Automation
      - Amosclaud Bot
      - Amosclaud CI
      - 🚀 Amosclaud AI - CI Pipeline
      - Build and Verify
      - Python package
      - CI/CD — Test & Deploy
      - Amosclaud Workspace CI
      - 🚀 Amosclaud AI — Live Server Check
      - Docker Image CI
      - Platform Build Check
      - 🏗️ Platform Build Check
      - CodeQL
      - CircleCI Pipeline
      - Amosclaud Autonomous Fixer
      - Amosclaud Pull Request CI Repair
      - Amosclaud Repair Control Plane
    types: [completed]
  status:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:
    inputs:
      scope:
        description: default, pull_request, or maintenance
        required: false
        default: default
        type: choice
        options: [default, pull_request, maintenance]
      pull_request_number:
        description: Pull request number for pull_request scope
        required: false
        type: string
      target_sha:
        description: Optional exact revision
        required: false
        type: string
      source_run_id:
        description: Optional GitHub Actions run ID
        required: false
        type: string
      source_name:
        description: Failure source name
        required: false
        type: string
      provider:
        description: github_actions, circleci, or manual
        required: false
        default: manual
        type: string
      status_url:
        description: Optional provider status URL
        required: false
        type: string
      failure_summary:
        description: Optional manual failure summary
        required: false
        type: string

permissions:
  actions: read
  checks: read
  contents: write
  issues: write
  pull-requests: write
  statuses: read

concurrency:
  group: amosclaud-repair-control-${{ github.event.workflow_run.head_sha || github.event.sha || inputs.target_sha || github.sha }}
  cancel-in-progress: false

jobs:
  repair:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'status' &&
       (github.event.state == 'failure' || github.event.state == 'error') &&
       contains(github.event.context, 'circleci')) ||
      (github.event_name == 'workflow_run' &&
       (github.event.workflow_run.conclusion == 'failure' ||
        github.event.workflow_run.conclusion == 'timed_out' ||
        github.event.workflow_run.conclusion == 'action_required' ||
        github.event.workflow_run.conclusion == 'startup_failure' ||
        github.event.workflow_run.conclusion == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      PYTHONDONTWRITEBYTECODE: '1'

    steps:
      - name: Check out trusted repair control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: trusted
          fetch-depth: 1
          persist-credentials: false

      - name: Set up trusted Python runtime
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: trusted/pyproject.toml

      - name: Install trusted verification tools
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --upgrade pip setuptools wheel
          python -m pip install --disable-pip-version-check flake8 pytest pytest-asyncio

      - name: Route and deduplicate repair incident
        id: route
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python trusted/.github/scripts/amosclaud_repair_control.py route \
            --event-path "$GITHUB_EVENT_PATH" \
            --event-name "$GITHUB_EVENT_NAME" \
            --repository "$GITHUB_REPOSITORY" \
            --default-branch "${{ github.event.repository.default_branch }}" \
            --token "$GITHUB_TOKEN" \
            --max-attempts 3

      - name: Stop reconciled, duplicate, or ineligible events
        if: steps.route.outputs.should_repair != 'true'
        run: |
          echo "No repair will run: ${{ steps.route.outputs.reason }}"

      - name: Check out exact target revision
        if: steps.route.outputs.should_repair == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.route.outputs.target_sha }}
          path: target
          fetch-depth: 0
          persist-credentials: false

      - name: Collect exact failed-check evidence
        if: steps.route.outputs.should_repair == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CIRCLECI_TOKEN: ${{ secrets.CIRCLECI_TOKEN }}
          FAILURE_LOG: ${{ runner.temp }}/amosclaud-repair-failure.log
        run: |
          set -euo pipefail
          python trusted/.github/scripts/amosclaud_repair_evidence.py collect \
            --provider "${{ steps.route.outputs.provider }}" \
            --repository "$GITHUB_REPOSITORY" \
            --source-run-id "${{ steps.route.outputs.source_run_id }}" \
            --status-url "${{ steps.route.outputs.status_url }}" \
            --source "${{ steps.route.outputs.source }}" \
            --github-token "$GITHUB_TOKEN" \
            --circleci-token "$CIRCLECI_TOKEN" \
            --output "$FAILURE_LOG"
          if [ -n "${{ inputs.failure_summary }}" ]; then
            printf '\n\n=== MANUAL FAILURE SUMMARY ===\n%s\n' "${{ inputs.failure_summary }}" >> "$FAILURE_LOG"
          fi

      - name: Reproduce failure without repair credentials
        if: steps.route.outputs.should_repair == 'true'
        id: reproduce
        env:
          VERIFY_REPORT: ${{ runner.temp }}/amosclaud-reproduction-report.json
        run: |
          set +e
          python trusted/.github/scripts/amosclaud_repair_verify.py \
            --target target \
            --failure-source "${{ steps.route.outputs.source }}" \
            --changed-files-json '[]' \
            --report "$VERIFY_REPORT" \
            2>&1 | tee "${RUNNER_TEMP}/amosclaud-reproduction.log"
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -eq 0 ]; then
            echo "reproduced=false" >> "$GITHUB_OUTPUT"
          else
            echo "reproduced=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open scheduled incident only after a reproduced failure
        if: >-
          steps.route.outputs.should_repair == 'true' &&
          steps.route.outputs.provider == 'scheduled_health' &&
          steps.reproduce.outputs.reproduced == 'true'
        id: scheduled_incident
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AMOSCLAUD_FORCE_INCIDENT: '1'
        run: |
          set -euo pipefail
          python trusted/.github/scripts/amosclaud_repair_control.py route \
            --event-path "$GITHUB_EVENT_PATH" \
            --event-name "$GITHUB_EVENT_NAME" \
            --repository "$GITHUB_REPOSITORY" \
            --default-branch "${{ github.event.repository.default_branch }}" \
            --token "$GITHUB_TOKEN" \
            --max-attempts 3

      - name: Close healthy scheduled scan without model use
        if: >-
          steps.route.outputs.should_repair == 'true' &&
          steps.route.outputs.provider == 'scheduled_health' &&
          steps.reproduce.outputs.reproduced != 'true'
        run: echo "Scheduled health scan passed; no incident or model request was created."

      - name: Retry a healthy but externally failed CircleCI workflow
        if: >-
          steps.route.outputs.should_repair == 'true' &&
          steps.route.outputs.provider == 'circleci' &&
          steps.reproduce.outputs.reproduced != 'true'
        id: circleci_retry
        env:
          CIRCLECI_TOKEN: ${{ secrets.CIRCLECI_TOKEN }}
        run: |
          set +e
          python trusted/.github/scripts/amosclaud_repair_evidence.py rerun-circleci \
            --status-url "${{ steps.route.outputs.status_url }}" \
            --circleci-token "$CIRCLECI_TOKEN" \
            --output "${RUNNER_TEMP}/circleci-rerun.json"
          status=$?
          set -e
          echo "requested=$([ "$status" -eq 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Generate bounded repair candidate
        if: >-
          steps.route.outputs.should_repair == 'true' &&
          steps.reproduce.outputs.reproduced == 'true'
        id: candidate
        env:
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          OLLAMA_URL: ${{ secrets.OLLAMA_URL }}
          OLLAMA_MODEL: ${{ vars.OLLAMA_MODEL }}
          AMOSCLAUD_MODEL: ${{ vars.AMOSCLAUD_MODEL }}
          AMOSCLAUD_GATEWAY_API_KEY: ${{ secrets.AMOSCLAUD_API_KEY }}
          AMOSCLAUD_GATEWAY_API_URL: ${{ vars.AMOSCLAUD_API_URL }}
          AMOSCLAUD_GATEWAY_FIXER_MODEL: ${{ vars.AMOSCLAUD_FIXER_MODEL }}
          FAILURE_LOG: ${{ runner.temp }}/amosclaud-repair-failure.log
          PATCH_PATH: ${{ runner.temp }}/amosclaud-repair.patch
          CANDIDATE_REPORT: ${{ runner.temp }}/amosclaud-candidate-report.json
        run: |
          set +e
          if [ -n "$OLLAMA_API_KEY" ]; then
            export AMOSCLAUD_API_KEY="$OLLAMA_API_KEY"
            export AMOSCLAUD_API_URL="${OLLAMA_URL:-https://ollama.com}"
            export AMOSCLAUD_FIXER_MODEL="${OLLAMA_MODEL:-${AMOSCLAUD_MODEL:-gpt-oss:120b}}"
            export AMOSCLAUD_REPAIR_PROVIDER="ollama-cloud"
          else
            export AMOSCLAUD_API_KEY="$AMOSCLAUD_GATEWAY_API_KEY"
            export AMOSCLAUD_API_URL="${AMOSCLAUD_GATEWAY_API_URL:-https://www.amosclaud.com}"
            export AMOSCLAUD_FIXER_MODEL="${AMOSCLAUD_GATEWAY_FIXER_MODEL:-amosclaud-agent}"
            export AMOSCLAUD_REPAIR_PROVIDER="amosclaud-gateway"
          fi
          python - <<'PY'
          import os
          from urllib.parse import urlsplit

          endpoint = os.environ.get("AMOSCLAUD_API_URL", "")
          host = urlsplit(endpoint).netloc or "invalid"
          print(f"Repair provider: {os.environ.get('AMOSCLAUD_REPAIR_PROVIDER', 'unknown')}")
          print(f"Repair endpoint host: {host}")
          print(f"Repair model: {os.environ.get('AMOSCLAUD_FIXER_MODEL', 'unknown')}")
          PY
          mode=regular
          if [ "${{ steps.route.outputs.route }}" = "maintenance" ]; then
            mode=maintenance
          fi
          python trusted/.github/scripts/amosclaud_repair_candidate.py \
            --target target \
            --instructions-root trusted \
            --policy trusted/.amosclaud/repair-control-plane.json \
            --evidence "$FAILURE_LOG" \
            --mode "$mode" \
            --source "${{ steps.route.outputs.source }}" \
            --patch-output "$PATCH_PATH" \
            --report "$CANDIDATE_REPORT" \
            2>&1 | tee "${RUNNER_TEMP}/amosclaud-candidate.log"
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -eq 0 ]; then
            echo "applied=true" >> "$GITHUB_OUTPUT"
          else
            echo "applied=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify candidate in a credential-free adaptive pre-run
        if: steps.candidate.outputs.applied == 'true'
        id: verify
        env:
          CANDIDATE_REPORT: ${{ runner.temp }}/amosclaud-candidate-report.json
          VERIFY_REPORT: ${{ runner.temp }}/amosclaud-verification-report.json
        run: |
          set +e
          python trusted/.github/scripts/amosclaud_repair_verify.py \
            --target target \
            --failure-source "${{ steps.route.outputs.source }}" \
            --candidate-report "$CANDIDATE_REPORT" \
            --report "$VERIFY_REPORT" \
            2>&1 | tee "${RUNNER_TEMP}/amosclaud-verification.log"
          status=${PIPESTATUS[0]}
          set -e
          echo "verified=$([ "$status" -eq 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Upload repair evidence
        if: always() && steps.route.outputs.should_repair == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: amosclaud-repair-control-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/amosclaud-repair-failure.log
            ${{ runner.temp }}/amosclaud-reproduction-report.json
            ${{ runner.temp }}/amosclaud-reproduction.log
            ${{ runner.temp }}/amosclaud-repair.patch
            ${{ runner.temp }}/amosclaud-candidate-report.json
            ${{ runner.temp }}/amosclaud-candidate.log
            ${{ runner.temp }}/amosclaud-verification-report.json
            ${{ runner.temp }}/amosclaud-verification.log
            ${{ runner.temp }}/circleci-rerun.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish verified repair safely
        if: steps.verify.outputs.verified == 'true'
        id: publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AMOSCLAUD_AUTONOMOUS_TOKEN: ${{ secrets.AMOSCLAUD_AUTONOMOUS_TOKEN }}
          CANDIDATE_REPORT: ${{ runner.temp }}/amosclaud-candidate-report.json
          INCIDENT_NUMBER: ${{ steps.route.outputs.incident_number || steps.scheduled_incident.outputs.incident_number }}
          FINGERPRINT: ${{ steps.route.outputs.fingerprint || steps.scheduled_incident.outputs.fingerprint }}
          ATTEMPT: ${{ steps.route.outputs.attempt || steps.scheduled_incident.outputs.attempt }}
          TARGET_SHA: ${{ steps.route.outputs.target_sha }}
          HEAD_REF: ${{ steps.route.outputs.target_branch }}
          BASE_REF: ${{ steps.route.outputs.base_branch }}
          PR_NUMBER: ${{ steps.route.outputs.pull_request_number }}
          ROUTE: ${{ steps.route.outputs.route }}
        run: |
          set -euo pipefail
          mapfile -t changed_files < <(python - <<'PY'
          import json, os
          from pathlib import Path
          report = json.loads(Path(os.environ['CANDIDATE_REPORT']).read_text(encoding='utf-8'))
          for item in report.get('changed_files', []):
              if isinstance(item, str) and item:
                  print(item)
          PY
          )
          if [ "${#changed_files[@]}" -eq 0 ]; then
            echo "No verified changed files were reported."
            exit 1
          fi
          if [ "$(git -C target rev-parse HEAD)" != "$TARGET_SHA" ]; then
            echo "Target revision changed unexpectedly."
            exit 1
          fi
          git -C target config user.name "Amosclaud Autonomous Repair"
          git -C target config user.email "repair@amosclaud.internal"
          git -C target add -A -- "${changed_files[@]}"
          git -C target diff --cached --quiet && { echo "No verified changes were staged."; exit 1; }
          git -C target commit -m "fix: Amosclaud repair [incident:${FINGERPRINT}]"
          repair_sha="$(git -C target rev-parse HEAD)"

          if [ "$ROUTE" = "pull_request" ]; then
            remote_sha="$(git -C target ls-remote origin "refs/heads/${HEAD_REF}" | cut -f1)"
            if [ "$remote_sha" != "$TARGET_SHA" ]; then
              echo "Remote pull request branch moved; refusing a stale push."
              exit 1
            fi
            export GH_TOKEN="$AMOSCLAUD_AUTONOMOUS_TOKEN"
            gh auth setup-git
            git -C target push origin "HEAD:refs/heads/${HEAD_REF}"
            echo "publication=original pull request #${PR_NUMBER}" >> "$GITHUB_OUTPUT"
          else
            export GH_TOKEN="$GITHUB_TOKEN"
            gh auth setup-git
            prefix=amosclaud-fixer
            title="fix: Amosclaud verified repair"
            if [ "$ROUTE" = "maintenance" ]; then
              prefix=amosclaud-maintenance
              title="fix: Amosclaud repair-engine maintenance proposal"
            fi
            branch="${prefix}/${FINGERPRINT}-a${ATTEMPT}"
            git -C target push origin "HEAD:refs/heads/${branch}"
            body_file="$(mktemp)"
            cat > "$body_file" <<EOF
          ## Amosclaud Repair Control Plane

          - Incident: #${INCIDENT_NUMBER}
          - Source revision: \`${TARGET_SHA}\`
          - Repair revision: \`${repair_sha}\`
          - Route: \`${ROUTE}\`
          - Verification: credential-free adaptive pre-run passed
          - Force push: not used

          Normal required checks and review still apply. Maintenance proposals require explicit owner approval.
          EOF
            pr_url="$(gh pr create --repo "$GITHUB_REPOSITORY" --base "$BASE_REF" --head "$branch" --title "$title" --body-file "$body_file")"
            echo "publication=$pr_url" >> "$GITHUB_OUTPUT"
          fi
          echo "repair_sha=$repair_sha" >> "$GITHUB_OUTPUT"

      - name: Mark incident as published
        if: steps.publish.outputs.repair_sha != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INCIDENT_NUMBER: ${{ steps.route.outputs.incident_number || steps.scheduled_incident.outputs.incident_number }}
        run: |
          set -euo pipefail
          python trusted/.github/scripts/amosclaud_repair_control.py finalize \
            --repository "$GITHUB_REPOSITORY" \
            --incident-number "$INCIDENT_NUMBER" \
            --state published \
            --repair-sha "${{ steps.publish.outputs.repair_sha }}" \
            --message "Verified repair published to ${{ steps.publish.outputs.publication }}. New checks are running for commit \`${{ steps.publish.outputs.repair_sha }}\`." \
            --token "$GITHUB_TOKEN"

      - name: Report blocked or discarded repair
        if: >-
          always() &&
          steps.route.outputs.should_repair == 'true' &&
          steps.publish.outputs.repair_sha == '' &&
          (steps.reproduce.outputs.reproduced == 'true' ||
           steps.route.outputs.provider != 'scheduled_health')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INCIDENT_NUMBER: ${{ steps.route.outputs.incident_number || steps.scheduled_incident.outputs.incident_number }}
        run: |
          set -euo pipefail
          if [ -z "$INCIDENT_NUMBER" ]; then
            echo "No incident was opened."
            exit 0
          fi
          state=blocked
          message="No repair was published."
          if [ "${{ steps.reproduce.outputs.reproduced }}" != "true" ]; then
            message="The reported failure could not be reproduced. Evidence was preserved; an external or intermittent provider failure is likely."
          elif [ "${{ steps.candidate.outputs.applied }}" != "true" ]; then
            message="Amosclaud did not produce a safe, applicable candidate. Evidence and rejected attempts were preserved."
          elif [ "${{ steps.verify.outputs.verified }}" != "true" ]; then
            message="The repair candidate failed the credential-free adaptive pre-run and was discarded."
          elif [ "${{ steps.publish.outcome }}" != "success" ]; then
            message="The verified candidate was not published because the target branch moved or publication failed. No force push was attempted."
          fi
          python trusted/.github/scripts/amosclaud_repair_control.py finalize \
            --repository "$GITHUB_REPOSITORY" \
            --incident-number "$INCIDENT_NUMBER" \
            --state "$state" \
            --message "$message Evidence: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --token "$GITHUB_TOKEN"
