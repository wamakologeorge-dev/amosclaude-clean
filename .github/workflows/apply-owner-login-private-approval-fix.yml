name: Apply Owner Login and Approval Policy Fix

on:
  push:
    branches:
      - fix/owner-login-private-data-approval

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/owner-login-private-data-approval
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Apply focused repair
        run: python .github/scripts/apply_owner_login_private_approval_fix.py

      - name: Format and run focused tests
        run: |
          python -m pip install --disable-pip-version-check -e . pytest black
          python -m black \
            amoscloud_ai/api/routes/owner_bootstrap.py \
            amoscloud_ai/api/routes/auth.py \
            amosclaud_bot/approval_gate.py \
            tests/test_owner_oauth_and_private_data_approval.py
          python -m pytest -q \
            tests/test_github_admin_owner_access.py \
            tests/test_owner_oauth_and_private_data_approval.py

      - name: Remove temporary automation
        run: |
          rm .github/scripts/apply_owner_login_private_approval_fix.py
          rm .github/workflows/apply-owner-login-private-approval-fix.yml

      - name: Commit verified repair
        run: |
          git config user.name "Amosclaud Urgent Repair"
          git config user.email "repair@amosclaud.internal"
          git add -A
          git commit -m "fix: unblock GitHub owner login and narrow approval to private data"
          git push origin HEAD:fix/owner-login-private-data-approval
