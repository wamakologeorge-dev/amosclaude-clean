name: Platform Build Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  docker-build:
    runs-on: ${{ vars.AMOSCLAUD_CI_RUNNER || 'ubuntu-latest' }}
    name: Build and verify Docker image
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c

      - name: Build Docker image with reusable layers
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: Dockerfile
          load: true
          tags: amoscloud-ai:test
          cache-from: type=gha,scope=amosclaud-control-plane
          cache-to: type=gha,mode=max,scope=amosclaud-control-plane
          provenance: false
          sbom: false

      - name: Start container
        run: |
          docker run -d --name amoscloud_test \
            -e DATABASE_URL=sqlite:///./amoscloud.db \
            -e SECRET_KEY=test-secret-for-platform-check-only \
            -e AUTH_COOKIE_SECURE=false \
            -e AMOSCLAUD_ACCESS_MODE=local \
            -e AMOSCLAUD_TRUST_CONTAINER_GATEWAY=true \
            -p 8000:8000 \
            amoscloud-ai:test

      - name: Wait for container health
        id: health
        run: |
          ready=false
          for i in $(seq 1 45); do
            if curl -sf --max-time 2 http://localhost:8000/health; then
              echo "Container is healthy."
              ready=true
              break
            fi
            echo "Waiting for container, attempt $i"
            sleep 1
          done
          if [ "$ready" != "true" ]; then
            docker logs amoscloud_test > platform-container.log 2>&1 || true
            exit 1
          fi

      - name: Upload platform diagnostics
        if: failure() && steps.health.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: platform-container-diagnostics
          path: platform-container.log
          if-no-files-found: warn

      - name: Verify secured dashboard flow
        run: |
          ROOT_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/)
          ROOT_LOCATION=$(curl -s -D - -o /dev/null http://localhost:8000/ | tr -d '\r' | awk 'tolower($1)=="location:" {print $2}')
          LOGIN_STATUS=$(curl -s -o /tmp/login.html -w "%{http_code}" http://localhost:8000/login)
          echo "Root HTTP status: $ROOT_STATUS"
          echo "Root redirect: $ROOT_LOCATION"
          echo "Login HTTP status: $LOGIN_STATUS"
          [ "$ROOT_STATUS" = "302" ]
          [ "$ROOT_LOCATION" = "/login" ]
          [ "$LOGIN_STATUS" = "200" ]
          grep -q "Amosclaud" /tmp/login.html
          echo "Secured dashboard and login page are live."

      - name: Show health
        run: curl -s http://localhost:8000/health | python3 -m json.tool

      - name: Cleanup
        if: always()
        run: docker rm -f amoscloud_test || true
