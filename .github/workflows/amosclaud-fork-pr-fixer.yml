name: Amosclaud Fork PR Fixer

on:
  workflow_run:
    workflows:
      - Fast PR Gate
      - Repository Behavior Automation
      - Amosclaud Bot
      - Amosclaud CI
      - 🚀 Amosclaud AI - CI Pipeline
      - Build and Verify
      - Python package
      - CI/CD — Test & Deploy
      - Amosclaud Workspace CI
      - 🚀 Amosclaud AI — Live Server Check
      - Docker Image CI
      - Platform Build Check
      - 🏗️ Platform Build Check
      - CodeQL
    types: [completed]
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: Open fork pull request number
        required: true
        type: string
      source_name:
        description: Optional failure description
        required: false
        default: Manual fork PR repair
        type: string

permissions:
  actions: read
  checks: read
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: amosclaud-fork-pr-fixer-${{ github.event.workflow_run.head_sha || inputs.pull_request_number || github.run_id }}
  cancel-in-progress: false

jobs:
  repair-fork-pr:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       (github.event.workflow_run.conclusion == 'failure' ||
        github.event.workflow_run.conclusion == 'timed_out' ||
        github.event.workflow_run.conclusion == 'action_required' ||
        github.event.workflow_run.conclusion == 'startup_failure'))
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Check out trusted Amosclaud repair engine
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: trusted
          fetch-depth: 1
          persist-credentials: false

      - name: Set up trusted Python runtime
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Resolve open fork pull request and approval state
        id: route
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python trusted/.github/scripts/amosclaud_fork_pr_route.py \
            --event-path "$GITHUB_EVENT_PATH" \
            --repository "$GITHUB_REPOSITORY" \
            --token "$GITHUB_TOKEN" \
            --pull-request-number "${{ inputs.pull_request_number }}" \
            --source-name "${{ inputs.source_name }}"

      - name: Report ineligible or approval-gated event
        if: steps.route.outputs.should_repair != 'true'
        run: |
          echo "No fork repair will run: ${{ steps.route.outputs.reason }}"
          if [ "${{ steps.route.outputs.requires_approval }}" = "true" ]; then
            echo "Human approval is required before Amosclaud-Fixer may continue."
            echo "Sensitive files: ${{ steps.route.outputs.sensitive_files }}"
          fi

      - name: Check out exact fork revision without credentials
        if: steps.route.outputs.should_repair == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ steps.route.outputs.head_repository }}
          ref: ${{ steps.route.outputs.head_sha }}
          path: target
          fetch-depth: 0
          persist-credentials: false

      - name: Install trusted verification tools
        if: steps.route.outputs.should_repair == 'true'
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --upgrade pip setuptools wheel
          python -m pip install --disable-pip-version-check flake8 pytest pytest-asyncio

      - name: Collect failed-check evidence
        if: steps.route.outputs.should_repair == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FAILURE_LOG: ${{ runner.temp }}/amosclaud-fork-failure.log
        run: |
          set -euo pipefail
          if [ -n "${{ steps.route.outputs.source_run_id }}" ]; then
            python trusted/.github/scripts/amosclaud_repair_evidence.py collect \
              --provider github_actions \
              --repository "$GITHUB_REPOSITORY" \
              --source-run-id "${{ steps.route.outputs.source_run_id }}" \
              --status-url "${{ steps.route.outputs.status_url }}" \
              --source "${{ steps.route.outputs.source_name }}" \
              --github-token "$GITHUB_TOKEN" \
              --output "$FAILURE_LOG"
          else
            printf 'Manual repair requested for fork PR #%s.\nSource: %s\n' \
              "${{ steps.route.outputs.pull_request_number }}" \
              "${{ steps.route.outputs.source_name }}" > "$FAILURE_LOG"
          fi

      - name: Reproduce failure without repair credentials
        if: steps.route.outputs.should_repair == 'true'
        id: reproduce
        env:
          VERIFY_REPORT: ${{ runner.temp }}/amosclaud-fork-reproduction.json
        run: |
          set +e
          python trusted/.github/scripts/amosclaud_repair_verify.py \
            --target target \
            --failure-source "${{ steps.route.outputs.source_name }}" \
            --changed-files-json '[]' \
            --report "$VERIFY_REPORT" \
            2>&1 | tee "${RUNNER_TEMP}/amosclaud-fork-reproduction.log"
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -eq 0 ]; then
            echo "reproduced=false" >> "$GITHUB_OUTPUT"
          else
            echo "reproduced=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate bounded repair candidate
        if: >-
          steps.route.outputs.should_repair == 'true' &&
          steps.reproduce.outputs.reproduced == 'true'
        id: candidate
        env:
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          OLLAMA_URL: ${{ secrets.OLLAMA_URL }}
          OLLAMA_MODEL: ${{ vars.OLLAMA_MODEL }}
          AMOSCLAUD_MODEL: ${{ vars.AMOSCLAUD_MODEL }}
          AMOSCLAUD_GATEWAY_API_KEY: ${{ secrets.AMOSCLAUD_API_KEY }}
          AMOSCLAUD_GATEWAY_API_URL: ${{ vars.AMOSCLAUD_API_URL }}
          AMOSCLAUD_GATEWAY_FIXER_MODEL: ${{ vars.AMOSCLAUD_FIXER_MODEL }}
          AMOSCLAUD_SENSITIVE_APPROVED: ${{ steps.route.outputs.sensitive_approved }}
          FAILURE_LOG: ${{ runner.temp }}/amosclaud-fork-failure.log
          PATCH_PATH: ${{ runner.temp }}/amosclaud-fork-repair.patch
          CANDIDATE_REPORT: ${{ runner.temp }}/amosclaud-fork-candidate.json
        run: |
          set +e
          if [ -n "$OLLAMA_API_KEY" ]; then
            export AMOSCLAUD_API_KEY="$OLLAMA_API_KEY"
            export AMOSCLAUD_API_URL="${OLLAMA_URL:-https://ollama.com}"
            export AMOSCLAUD_FIXER_MODEL="${OLLAMA_MODEL:-${AMOSCLAUD_MODEL:-gpt-oss:120b}}"
            export AMOSCLAUD_REPAIR_PROVIDER="ollama-cloud"
          else
            export AMOSCLAUD_API_KEY="$AMOSCLAUD_GATEWAY_API_KEY"
            export AMOSCLAUD_API_URL="${AMOSCLAUD_GATEWAY_API_URL:-https://www.amosclaud.com}"
            export AMOSCLAUD_FIXER_MODEL="${AMOSCLAUD_GATEWAY_FIXER_MODEL:-amosclaud-agent}"
            export AMOSCLAUD_REPAIR_PROVIDER="amosclaud-gateway"
          fi
          python trusted/.github/scripts/amosclaud_repair_candidate_v2.py \
            --target target \
            --instructions-root trusted \
            --policy trusted/.amosclaud/repair-control-plane.json \
            --evidence "$FAILURE_LOG" \
            --mode regular \
            --source "${{ steps.route.outputs.source_name }}" \
            --patch-output "$PATCH_PATH" \
            --report "$CANDIDATE_REPORT" \
            2>&1 | tee "${RUNNER_TEMP}/amosclaud-fork-candidate.log"
          status=${PIPESTATUS[0]}
          set -e
          echo "applied=$([ "$status" -eq 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Verify candidate without repair credentials
        if: steps.candidate.outputs.applied == 'true'
        id: verify
        env:
          CANDIDATE_REPORT: ${{ runner.temp }}/amosclaud-fork-candidate.json
          VERIFY_REPORT: ${{ runner.temp }}/amosclaud-fork-verification.json
        run: |
          set +e
          unset OLLAMA_API_KEY OLLAMA_URL AMOSCLAUD_API_KEY AMOSCLAUD_AUTONOMOUS_TOKEN
          python trusted/.github/scripts/amosclaud_repair_verify.py \
            --target target \
            --failure-source "${{ steps.route.outputs.source_name }}" \
            --candidate-report "$CANDIDATE_REPORT" \
            --report "$VERIFY_REPORT" \
            2>&1 | tee "${RUNNER_TEMP}/amosclaud-fork-verification.log"
          status=${PIPESTATUS[0]}
          set -e
          echo "verified=$([ "$status" -eq 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Publish verified repair in the base repository
        if: steps.verify.outputs.verified == 'true'
        id: publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AMOSCLAUD_AUTONOMOUS_TOKEN: ${{ secrets.AMOSCLAUD_AUTONOMOUS_TOKEN }}
          CANDIDATE_REPORT: ${{ runner.temp }}/amosclaud-fork-candidate.json
          PR_NUMBER: ${{ steps.route.outputs.pull_request_number }}
          HEAD_REPOSITORY: ${{ steps.route.outputs.head_repository }}
          HEAD_SHA: ${{ steps.route.outputs.head_sha }}
          HEAD_REF: ${{ steps.route.outputs.head_ref }}
          BASE_REF: ${{ steps.route.outputs.base_ref }}
          FINGERPRINT: ${{ steps.route.outputs.fingerprint }}
          APPROVAL_ISSUE: ${{ steps.route.outputs.approval_issue_number }}
          SENSITIVE_APPROVED: ${{ steps.route.outputs.sensitive_approved }}
        run: |
          set -euo pipefail
          mapfile -t changed_files < <(python - <<'PY'
          import json, os
          from pathlib import Path
          report = json.loads(Path(os.environ['CANDIDATE_REPORT']).read_text(encoding='utf-8'))
          for item in report.get('changed_files', []):
              if isinstance(item, str) and item:
                  print(item)
          PY
          )
          if [ "${#changed_files[@]}" -eq 0 ]; then
            echo "No verified changed files were reported."
            exit 1
          fi
          if [ "$(git -C target rev-parse HEAD)" != "$HEAD_SHA" ]; then
            echo "Fork target revision changed unexpectedly."
            exit 1
          fi

          git -C target config user.name "Amosclaud Autonomous Repair"
          git -C target config user.email "repair@amosclaud.internal"
          git -C target add -A -- "${changed_files[@]}"
          git -C target diff --cached --quiet && { echo "No verified changes were staged."; exit 1; }
          git -C target commit -m "fix: Amosclaud verified repair for fork PR #${PR_NUMBER}"
          repair_sha="$(git -C target rev-parse HEAD)"

          export GH_TOKEN="${AMOSCLAUD_AUTONOMOUS_TOKEN:-$GITHUB_TOKEN}"
          gh auth setup-git
          branch="amosclaud-fixer/fork-pr-${PR_NUMBER}-${FINGERPRINT}-${GITHUB_RUN_ID}"
          git -C target remote add repair-base "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C target push repair-base "HEAD:refs/heads/${branch}"

          body_file="$(mktemp)"
          cat > "$body_file" <<EOF
          <!-- amosclaud-fork-repair:${PR_NUMBER}:${HEAD_SHA} -->
          ## Amosclaud Verified Fork PR Repair

          - Original pull request: #${PR_NUMBER}
          - Original fork: \`${HEAD_REPOSITORY}\`
          - Original branch: \`${HEAD_REF}\`
          - Source revision: \`${HEAD_SHA}\`
          - Repair revision: \`${repair_sha}\`
          - Verification: credential-free adaptive pre-run passed
          - Force push: not used

          Amosclaud-Fixer could not safely push repository credentials into the contributor fork, so it published the verified correction on this base-repository branch. Normal required checks and review still apply.
          EOF
          pr_url="$(gh pr create --repo "$GITHUB_REPOSITORY" --base "$BASE_REF" --head "$branch" --title "fix: Amosclaud repair for fork PR #${PR_NUMBER}" --body-file "$body_file")"
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "Amosclaud-Fixer reproduced the failure and published a verified repair without writing to the fork: ${pr_url}"

          if [ "$SENSITIVE_APPROVED" = "true" ] && [ -n "$APPROVAL_ISSUE" ]; then
            gh issue comment "$APPROVAL_ISSUE" --repo "$GITHUB_REPOSITORY" --body "<!-- amosclaud-approval-consumed -->\nApproval consumed by verified fork PR repair ${pr_url}."
          fi

          echo "repair_sha=$repair_sha" >> "$GITHUB_OUTPUT"
          echo "publication=$pr_url" >> "$GITHUB_OUTPUT"

      - name: Upload fork repair evidence
        if: always() && steps.route.outputs.should_repair == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: amosclaud-fork-repair-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/amosclaud-fork-failure.log
            ${{ runner.temp }}/amosclaud-fork-reproduction.json
            ${{ runner.temp }}/amosclaud-fork-reproduction.log
            ${{ runner.temp }}/amosclaud-fork-repair.patch
            ${{ runner.temp }}/amosclaud-fork-candidate.json
            ${{ runner.temp }}/amosclaud-fork-candidate.log
            ${{ runner.temp }}/amosclaud-fork-verification.json
            ${{ runner.temp }}/amosclaud-fork-verification.log
          if-no-files-found: ignore
          retention-days: 14
