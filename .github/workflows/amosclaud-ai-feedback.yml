name: Amosclaud AI Feedback Loop

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  ai-feedback:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code without persisted credentials
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install reviewer dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install PyGithub pytest

      - name: Require the Amosclaud GitHub credential
        env:
          AMOSCLAUD_GITHUB_TOKEN: ${{ secrets.AMOSCLAUD_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$AMOSCLAUD_GITHUB_TOKEN" || {
            echo "AMOSCLAUD_GITHUB_TOKEN is required for repository-owned pull requests."
            exit 1
          }

      - name: Get pull request code diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git diff "$BASE_SHA...$HEAD_SHA" > pr_diff.txt
          test -s pr_diff.txt || echo "No textual diff was produced." > pr_diff.txt

      - name: Verify deterministic reviewer rules
        run: python -m pytest -q tests/test_ai_reviewer.py

      - name: Run Amosclaud reviewer engine
        env:
          AMOSCLAUD_GITHUB_TOKEN: ${{ secrets.AMOSCLAUD_GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.AMOSCLAUD_GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.AMOSCLAUD_GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO_NAME: ${{ github.repository }}
          DIFF_PATH: pr_diff.txt
        run: python .github/scripts/ai_reviewer.py
