name: Apply Amosclaud Markdown Service

on:
  push:
    branches:
      - agent/amosclaud-markdown-service

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out Markdown service branch
        uses: actions/checkout@v7
        with:
          ref: agent/amosclaud-markdown-service
          fetch-depth: 0

      - name: Apply integration patch
        run: python tools/apply_markdown_service.py

      - name: Validate generated source syntax
        run: |
          python -m py_compile amoscloud_ai/api/routes/repositories.py amoscloud_ai/markdown_service.py
          node --check web/markdown-service.js

      - name: Remove one-time integration files
        run: rm -f tools/apply_markdown_service.py .github/workflows/apply-markdown-service.yml

      - name: Commit integrated Markdown service
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No integration changes were produced."
            exit 1
          fi
          git commit -m "Integrate secure repository Markdown service"
          git push origin HEAD:agent/amosclaud-markdown-service
