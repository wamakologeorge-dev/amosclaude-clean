name: Amosclaud Autonomous Fixer

on:
  workflow_dispatch:
    inputs:
      failure_summary:
        description: Optional failure details
        required: false
        type: string
      source_run_id:
        description: Optional GitHub Actions run ID
        required: false
        type: string
      source_name:
        description: Failure source name
        required: false
        type: string
      status_url:
        description: Optional provider status URL
        required: false
        type: string

permissions:
  actions: write
  contents: read

jobs:
  delegate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delegate to the unified repair control plane
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh workflow run amosclaud-repair-control-plane.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "${{ github.event.repository.default_branch }}" \
            -f scope=default \
            -f provider=github_actions \
            -f source_run_id="${{ inputs.source_run_id }}" \
            -f source_name="${{ inputs.source_name }}" \
            -f status_url="${{ inputs.status_url }}" \
            -f failure_summary="${{ inputs.failure_summary }}"
