name: Format username QR login

on:
  push:
    branches:
      - fix/username-password-qr-login
    paths:
      - .github/workflows/format-username-qr-login.yml

permissions:
  contents: write

concurrency:
  group: format-username-qr-login
  cancel-in-progress: false

jobs:
  format:
    if: github.repository == 'wamakologeorge-dev/amosclaude-clean'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init repository
          cd repository
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_REF_NAME}"
          git checkout -B "${GITHUB_REF_NAME}" FETCH_HEAD

      - name: Format changed Python files
        run: |
          set -euo pipefail
          cd repository
          python -m pip install --disable-pip-version-check --no-cache-dir "black>=24.4,<27"
          python -m black \
            amoscloud_ai/api/routes/passkey_signup.py \
            tests/test_account_access_recovery_contract.py \
            tests/test_github_admin_owner_access.py \
            tests/test_github_only_account_access.py \
            tests/test_public_status_account_controls.py \
            tests/test_public_tools_and_owner_access.py
          python -m black --check \
            amoscloud_ai/api/routes/passkey_signup.py \
            tests/test_account_access_recovery_contract.py \
            tests/test_github_admin_owner_access.py \
            tests/test_github_only_account_access.py \
            tests/test_public_status_account_controls.py \
            tests/test_public_tools_and_owner_access.py
          python -m py_compile amoscloud_ai/api/routes/passkey_signup.py

      - name: Commit formatting
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd repository
          rm -f .github/workflows/format-username-qr-login.yml
          git config user.name "Amosclaud Login Repair"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style(auth): format username QR login"
          git push origin "HEAD:${GITHUB_REF_NAME}"
