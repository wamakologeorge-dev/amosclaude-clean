name: Amosclaud Daily Autonomous Orchestrator

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: amosclaud-daily-autonomous
  cancel-in-progress: false

jobs:
  run-autonomous-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      AMOSCLAUD_REPAIR_MEMORY_CATALOG: ${{ github.workspace }}/amosclaud-memory-store/Amosclaud-storage/repair-memory/catalog.json
    steps:
      - name: Check out default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Check out Amosclaud Storage Memory
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: amosclaud-memory
          path: amosclaud-memory-store
          fetch-depth: 1
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install repository verification dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check -e .
          python -m pip install --disable-pip-version-check pytest pytest-asyncio

      - name: Report starting capability level
        run: |
          set -euo pipefail
          python -m amoscloud_ai.repair_knowledge \
            --catalog "$AMOSCLAUD_REPAIR_MEMORY_CATALOG" \
            status \
            --summary "$RUNNER_TEMP/amosclaud-capability-start.md"
          cat "$RUNNER_TEMP/amosclaud-capability-start.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Generate and verify one reviewable proposal
        env:
          AMOSCLAUD_API_KEY: ${{ secrets.AMOSCLAUD_API_KEY }}
          AMOSCLAUD_PROVIDER_API_URL: ${{ secrets.AMOSCLAUD_PROVIDER_API_URL || vars.AMOSCLAUD_API_URL || 'https://www.amosclaud.com' }}
          AMOSCLAUD_API_URL: ${{ vars.AMOSCLAUD_API_URL || 'https://www.amosclaud.com' }}
          AMOSCLAUD_API_COMPLETIONS_PATH: ${{ vars.AMOSCLAUD_API_COMPLETIONS_PATH || '/api/v1/provider/chat/completions' }}
          AMOSCLAUD_CRON_MODEL: ${{ vars.AMOSCLAUD_CRON_MODEL || 'amosclaud-agent' }}
          AMOSCLAUD_DEFAULT_BRANCH: main
          AMOSCLAUD_MEMORY_ACCESS_KEY: ${{ secrets.AMOSCLAUD_MEMORY_ACCESS_KEY }}
          AMOSCLAUD_MEMORY_API_URL: ${{ secrets.AMOSCLAUD_MEMORY_API_URL || secrets.AMOSCLAUD_PROVIDER_API_URL || vars.AMOSCLAUD_API_URL || 'https://www.amosclaud.com' }}
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          OLLAMA_URL: ${{ secrets.OLLAMA_URL }}
          AMOSCLAUD_MODEL_URL: ${{ secrets.OLLAMA_URL || 'https://ollama.com' }}
          AMOSCLAUD_MODEL_TOKEN: ${{ secrets.OLLAMA_API_KEY }}
          AMOSCLAUD_MODEL_COMPLETIONS_PATH: /v1/chat/completions
          AMOSCLAUD_MODEL: ${{ vars.AMOSCLAUD_MODEL || vars.OLLAMA_MODEL || 'gpt-oss:120b' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python amosclaud_daily_memory_runner.py

      - name: Report final capability level
        if: always()
        run: |
          set -euo pipefail
          if [ ! -f "$AMOSCLAUD_REPAIR_MEMORY_CATALOG" ]; then
            echo "No capability catalog was available after the daily run." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python -m amoscloud_ai.repair_knowledge \
            --catalog "$AMOSCLAUD_REPAIR_MEMORY_CATALOG" \
            status \
            --summary "$RUNNER_TEMP/amosclaud-capability-final.md"
          printf '\n### Final daily level\n\n' >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/amosclaud-capability-final.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Persist sanitized memory mirror
        if: always()
        run: |
          set -euo pipefail
          if [ ! -f "$AMOSCLAUD_REPAIR_MEMORY_CATALOG" ]; then
            echo "No memory catalog was produced."
            exit 0
          fi
          git -C amosclaud-memory-store config user.name "Amosclaud Storage Memory"
          git -C amosclaud-memory-store config user.email "memory@amosclaud.internal"
          git -C amosclaud-memory-store add Amosclaud-storage/repair-memory/catalog.json
          if git -C amosclaud-memory-store diff --cached --quiet; then
            echo "Memory catalog is unchanged."
            exit 0
          fi
          git -C amosclaud-memory-store commit -m "chore(memory): update verified repair catalog"
          git -C amosclaud-memory-store push origin HEAD:amosclaud-memory
