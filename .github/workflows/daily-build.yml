name: Amosclaud Daily Autonomous Orchestrator

on:
  schedule:
    # Triggers every single day precisely at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows you to trigger this loop manually via button click anytime

jobs:
  run-autonomous-agent:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Codebase
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 # Fetches full history so force pushing doesn't hit head blocks

    - name: Establish Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install System Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Configure Agent Git Identity
      run: |
        git config --global user.name "Amosclaud-bot"
        git config --global user.email "bot@amosclaud.com"

    - name: Execute Autonomous Daily Build & Validation
      env:
        ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Built-in token used to generate issue updates automatically
      run: |
        python amosclaud_cron_agent.py
