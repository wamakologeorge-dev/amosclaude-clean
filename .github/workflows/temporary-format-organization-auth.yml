name: Temporary organization auth formatter

on:
  push:
    branches:
      - feature/organization-membership-auth

permissions:
  contents: write

concurrency:
  group: temporary-organization-auth-formatter
  cancel-in-progress: false

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out formatter branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/organization-membership-auth
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: '0.11.16'
          enable-cache: false

      - name: Format changed Python files and remove formatter
        shell: bash
        run: |
          set -euo pipefail
          uv run --no-project --with-requirements requirements-ci-fast.txt \
            black \
              amoscloud_ai/api/routes/organization_identity.py \
              amoscloud_ai/security.py \
              tests/test_organization_identity_runtime.py
          git rm .github/workflows/temporary-format-organization-auth.yml
          git diff --check

      - name: Publish formatting commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Amosclaud CI Formatter'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No formatting changes were required.'
            exit 0
          fi
          git commit -m 'style: format organization authentication'
          git push origin HEAD:feature/organization-membership-auth
