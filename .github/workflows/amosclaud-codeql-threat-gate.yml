name: Amosclaud CodeQL Threat Gate

on:
  workflow_run:
    workflows: [CodeQL]
    types: [completed]

permissions:
  contents: read
  security-events: read

concurrency:
  group: amosclaud-codeql-threat-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  codeql-threat-gate:
    name: Every CodeQL alert is a threat
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.pull_requests[0].number
    runs-on: ${{ vars.AMOSCLAUD_CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: read
      statuses: write

    steps:
      - name: Check out trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: trusted
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Compile trusted Advanced Security gate
        run: python -m py_compile trusted/scripts/ci/advanced_security_gate.py

      - name: Evaluate every open CodeQL alert as a blocking threat
        id: threat
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          set +e
          python trusted/scripts/ci/advanced_security_gate.py \
            --json advanced-security-gate.json \
            --markdown advanced-security-gate.md
          status=$?
          set -e
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"

      - name: Attach the threat verdict to the exact pull-request commit
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          EXIT_CODE: ${{ steps.threat.outputs.exit_code }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          state=failure
          description="CodeQL threat evidence is unavailable or blocking"
          if [ "$EXIT_CODE" = "0" ]; then
            state=success
            description="No open CodeQL threat was found for this exact commit"
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
            -f state="$state" \
            -f context="Amosclaud CodeQL Threat Gate" \
            -f description="$description" \
            -f target_url="$TARGET_URL"

      - name: Install trusted Amosclaud runtime for bounded repair routing
        if: steps.threat.outputs.exit_code != '0'
        run: python -m pip install --disable-pip-version-check -e trusted

      - name: Build authenticated blocking context for the repair bridge
        if: steps.threat.outputs.exit_code != '0'
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          event = {
              "repository": {
                  "default_branch": os.environ.get("GITHUB_REF_NAME") or "main",
              },
              "workflow_run": {
                  "id": int(os.environ["SOURCE_RUN_ID"]),
                  "name": "CodeQL",
                  "conclusion": "failure",
                  "head_sha": os.environ["HEAD_SHA"],
                  "html_url": os.environ["SOURCE_RUN_URL"],
                  "pull_requests": [{"number": int(os.environ["PR_NUMBER"])}],
              },
          }
          path = Path(os.environ["RUNNER_TEMP"]) / "amosclaud-codeql-blocking-event.json"
          path.write_text(json.dumps(event, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Route detected threat through the existing Repair Control Plane
        if: steps.threat.outputs.exit_code != '0'
        env:
          GITHUB_EVENT_PATH: ${{ runner.temp }}/amosclaud-codeql-blocking-event.json
          GITHUB_APP_SLUG: ${{ vars.GITHUB_APP_SLUG || 'amosclaud-bot' }}
          GITHUB_APP_ID: ${{ vars.GITHUB_APP_ID }}
          GITHUB_APP_INSTALLATION_ID: ${{ vars.GITHUB_APP_INSTALLATION_ID }}
          GITHUB_APP_BOT_USER_ID: ${{ vars.GITHUB_APP_BOT_USER_ID }}
          GITHUB_APP_PRIVATE_KEY: ${{ secrets.GITHUB_APP_PRIVATE_KEY }}
        run: PYTHONPATH=trusted python -m amoscloud_ai.security_repair_bridge

      - name: Publish threat-gate summary
        if: always()
        run: |
          if [ -s advanced-security-gate.md ]; then
            cat advanced-security-gate.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Amosclaud Advanced Security Threat Gate" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "🟥 No trustworthy gate report was produced." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload threat evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: amosclaud-codeql-threat-gate
          path: |
            advanced-security-gate.json
            advanced-security-gate.md
            ${{ runner.temp }}/amosclaud-codeql-blocking-event.json
          if-no-files-found: warn

      - name: Keep the pull request blocked until threats are cleared
        if: always() && steps.threat.outputs.exit_code != '0'
        run: exit "${{ steps.threat.outputs.exit_code }}"
