name: Format Active Doctor Route Once

on:
  push:
    branches:
      - fix/repository-doctor-active-bot-route
    paths:
      - .github/workflows/format-active-doctor-route-once.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out exact repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/repository-doctor-active-bot-route
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Format code, grant bounded dispatch, and remove temporary workflows
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check black
          black \
            amosclaud_bot/repository_doctor.py \
            tests/test_repository_doctor_bot_route.py

          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/amosclaud-bot.yml')
          text = path.read_text(encoding='utf-8')
          if '  actions: read\n' in text:
              text = text.replace('  actions: read\n', '  actions: write\n', 1)
          elif '  actions: write\n' not in text:
              raise SystemExit('Expected an actions permission in amosclaud-bot.yml')
          path.write_text(text, encoding='utf-8')
          PY

          git rm -f \
            .github/workflows/format-active-doctor-route-once.yml \
            .github/workflows/enable-doctor-actions-write-once.yml

      - name: Commit exact trusted output
        run: |
          set -euo pipefail
          git config user.name 'amosclaud-actions[bot]'
          git config user.email 'amosclaud-actions[bot]@users.noreply.github.com'
          git add \
            .github/workflows/amosclaud-bot.yml \
            amosclaud_bot/repository_doctor.py \
            tests/test_repository_doctor_bot_route.py
          git diff --cached --check
          git commit -m 'style: finalize active Repository Doctor route'
          git push origin HEAD:fix/repository-doctor-active-bot-route
