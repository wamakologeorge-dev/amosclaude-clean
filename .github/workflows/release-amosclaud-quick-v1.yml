name: Release Amosclaud Quick v1.0.0

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release-amosclaud-quick-v1.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-amosclaud-quick-v1.0.0
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish portable prerelease
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TAG: amosclaud-quick-v1.0.0
      PRODUCT: amosclaud-quick-v1.0.0

    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Install the portable runtime dependency
        run: python -m pip install --disable-pip-version-check 'PyYAML>=6,<7'

      - name: Build and verify the self-contained package
        shell: bash
        run: |
          set -euo pipefail
          package_root="$RUNNER_TEMP/$PRODUCT"
          sample_root="$RUNNER_TEMP/amosclaud-quick-smoke"
          export PACKAGE_ROOT="$package_root"
          export SAMPLE_ROOT="$sample_root"
          mkdir -p "$package_root/amoscloud_ai" "$sample_root"

          cat > "$package_root/amoscloud_ai/__init__.py" <<'PY'
          """Portable Amosclaud Quick package."""

          __version__ = "1.0.0"
          PY

          cp amoscloud_ai/developer_fastpath.py "$package_root/amoscloud_ai/developer_fastpath.py"
          cp amoscloud_ai/quickcheck_cli.py "$package_root/amoscloud_ai/quickcheck_cli.py"
          cp docs/DEVELOPER_FAST_PATH.md "$package_root/README.md"
          cp LICENSE "$package_root/LICENSE"
          cp LICENSE-COMMERCIAL.txt "$package_root/LICENSE-COMMERCIAL.txt"

          printf '%s\n' 'PyYAML>=6,<7' > "$package_root/requirements.txt"
          printf '%s\n' '1.0.0' > "$package_root/VERSION"
          git rev-parse HEAD > "$package_root/SOURCE_COMMIT"

          cat > "$package_root/run-amosclaud-quick.sh" <<'SH'
          #!/usr/bin/env sh
          set -eu
          SCRIPT_DIR=$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)
          cd "$SCRIPT_DIR"
          PYTHON_BIN=${PYTHON_BIN:-python3}
          exec "$PYTHON_BIN" -m amoscloud_ai.quickcheck_cli "$@"
          SH
          chmod +x "$package_root/run-amosclaud-quick.sh"

          cat > "$package_root/run-amosclaud-quick.bat" <<'BAT'
          @echo off
          setlocal
          cd /d "%~dp0"
          if defined PYTHON_BIN (
            "%PYTHON_BIN%" -m amoscloud_ai.quickcheck_cli %*
          ) else (
            py -3 -m amoscloud_ai.quickcheck_cli %*
          )
          exit /b %ERRORLEVEL%
          BAT

          cat > "$package_root/INSTALL.txt" <<'TXT'
          Amosclaud Quick v1.0.0

          Requirements:
          - Python 3.11 or newer
          - PyYAML 6.x

          Install the dependency:
            python -m pip install -r requirements.txt

          Linux or macOS:
            ./run-amosclaud-quick.sh /path/to/repository --objective "Find the login error"

          Windows:
            run-amosclaud-quick.bat C:\path\to\repository --objective "Find the login error"

          The tool runs locally. It needs no Amosclaud account, API key, model,
          or network connection. Protected secret files are reported by path but
          their contents are not read.
          TXT

          printf '%s\n' 'def health():' '    return True' > "$sample_root/app.py"
          printf '%s\n' '{"service":"ready","enabled":true}' > "$sample_root/config.json"
          printf '%s\n' 'SECRET=must-not-be-read' > "$sample_root/.env"

          (
            cd "$package_root"
            python -m compileall -q amoscloud_ai
            python -m amoscloud_ai.quickcheck_cli "$sample_root" \
              --objective 'Verify service health and configuration' \
              --max-lines 12 \
              --max-files 3 \
              --json \
              --output smoke-test.json \
              > smoke-test.stdout.json
          )

          python - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          package_root = Path(os.environ["PACKAGE_ROOT"])
          sample_root = Path(os.environ["SAMPLE_ROOT"])
          sys.path.insert(0, str(package_root))

          from amoscloud_ai.developer_fastpath import quickcheck, validate_repository

          report = json.loads((package_root / "smoke-test.json").read_text(encoding="utf-8"))
          assert report["status"] == "passed", report
          assert ".env" in report["context"]["sensitive_files_skipped"], report
          assert "must-not-be-read" not in json.dumps(report), report

          broken = sample_root / "broken.py"
          broken.write_text("def broken(:\n    pass\n", encoding="utf-8")
          failure = validate_repository(sample_root)
          assert failure["passed"] is False, failure
          assert any(item["path"] == "broken.py" for item in failure["failures"]), failure
          broken.unlink()

          clean = quickcheck(sample_root, "Check service health", max_lines=12, max_files=3)
          assert clean["status"] == "passed", clean
          PY

          (
            cd "$package_root"
            sha256sum \
              amoscloud_ai/__init__.py \
              amoscloud_ai/developer_fastpath.py \
              amoscloud_ai/quickcheck_cli.py \
              > SOURCE-SHA256SUMS.txt
          )

          cd "$RUNNER_TEMP"
          zip -qr "$GITHUB_WORKSPACE/$PRODUCT.zip" "$PRODUCT"
          tar -czf "$GITHUB_WORKSPACE/$PRODUCT.tar.gz" "$PRODUCT"
          cd "$GITHUB_WORKSPACE"
          sha256sum "$PRODUCT.zip" "$PRODUCT.tar.gz" > "$PRODUCT-SHA256SUMS.txt"

      - name: Upload build evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: amosclaud-quick-v1.0.0-build
          path: |
            amosclaud-quick-v1.0.0.zip
            amosclaud-quick-v1.0.0.tar.gz
            amosclaud-quick-v1.0.0-SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Write release notes
        shell: bash
        run: |
          cat > release-notes.md <<'EOF'
          ## Amosclaud Quick v1.0.0

          This is the first scoped Amosclaud prerelease: a portable local repository
          inspection tool that gives developers useful results before account creation
          or platform setup.

          ### Included

          - Compact repository context selected for an engineering objective.
          - Deterministic Python, JSON, YAML, TOML, and merge-marker checks.
          - Sensitive-file exclusion for `.env`, credentials, private keys, and secret paths.
          - Human-readable and JSON output.
          - Linux/macOS and Windows launchers.
          - ZIP and `tar.gz` packages with SHA-256 checksums.
          - Embedded smoke-test evidence and source commit metadata.

          ### Trust boundary

          Amosclaud Quick runs on the developer's computer. It does not require an
          Amosclaud account, API key, hosted model, or network connection. This release
          does not claim that the complete Amosclaud cloud platform is finished.
          EOF

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              "$PRODUCT.zip" \
              "$PRODUCT.tar.gz" \
              "$PRODUCT-SHA256SUMS.txt" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
            exit 0
          fi

          gh release create "$TAG" \
            "$PRODUCT.zip" \
            "$PRODUCT.tar.gz" \
            "$PRODUCT-SHA256SUMS.txt" \
            --repo "$GITHUB_REPOSITORY" \
            --target main \
            --title 'Amosclaud Quick v1.0.0' \
            --notes-file release-notes.md \
            --prerelease
