name: Apply Amosclaud Fixer Policy Migration

on:
  push:
    branches:
      - fix/automatic-ollama-repair-routing
    paths:
      - .github/workflows/amosclaud-fixer-policy-migration.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out policy branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/automatic-ollama-repair-routing
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: 0.11.16

      - name: Apply approval and fork-repair policy
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_function(source: str, name: str, replacement: str) -> str:
              start = source.index(f"def {name}")
              next_function = source.find("\ndef ", start + 1)
              if next_function == -1:
                  next_function = len(source)
              return source[:start] + replacement.rstrip() + "\n\n" + source[next_function + 1 :]

          approval_path = Path("amosclaud_bot/approval_gate.py")
          approval = approval_path.read_text(encoding="utf-8")
          constants_pattern = re.compile(
              r"SENSITIVE_HINTS = \(.*?\)\n\nHIGH_RISK_PREFIXES = \(.*?\)\n\nHIGH_RISK_FILES = \{.*?\}\n",
              re.S,
          )
          constants = '''SENSITIVE_HINTS = (
              ".env",
              "environment variable",
              "secret",
              "credential",
              "password",
              "private key",
              "access token",
              "api key",
              "personal information",
              "personally identifiable",
              "pii",
              "social security",
              "ssn",
              "passport",
              "date of birth",
              "home address",
              "bank account",
              "credit card",
          )

          HIGH_RISK_PREFIXES: tuple[str, ...] = ()

          HIGH_RISK_FILES = {
              "secrets.json",
              "credentials.json",
              "personal-information.json",
              "personal_information.json",
              "pii.json",
              "pii.csv",
          }

          PERSONAL_INFORMATION_PATH_HINTS = (
              "personal-information",
              "personal_information",
              "personally-identifiable",
              "personally_identifiable",
              "/pii/",
              "customer-private",
              "customer_private",
              "identity-document",
              "identity_document",
          )
          '''
          approval, count = constants_pattern.subn(constants, approval, count=1)
          if count != 1:
              raise RuntimeError("Could not replace approval sensitivity constants")

          approval = replace_function(
              approval,
              "_high_risk_files(files: list[dict[str, Any]]) -> list[str]:",
              '''def _path_requires_human_approval(path: str) -> bool:
              normalized = _normalize_repo_path(path)
              if not normalized:
                  return False
              lowered = normalized.lower()
              name = Path(normalized).name.lower()
              return (
                  name == ".env"
                  or name.startswith(".env.")
                  or name in HIGH_RISK_FILES
                  or any(hint in lowered for hint in PERSONAL_INFORMATION_PATH_HINTS)
              )


          def _high_risk_files(files: list[dict[str, Any]]) -> list[str]:
              sensitive: list[str] = []
              for item in files:
                  current = str(item.get("filename") or "")
                  previous = str(item.get("previous_filename") or "")
                  paths = [path for path in (current, previous) if path]
                  if any(_path_requires_human_approval(path) for path in paths):
                      sensitive.append(current or previous)
              return sensitive''',
          )

          approval = replace_function(
              approval,
              "_path_is_outside_autonomous_boundary(path: str) -> bool:",
              '''def _path_is_outside_autonomous_boundary(path: str) -> bool:
              return _path_requires_human_approval(path)''',
          )

          approval = replace_function(
              approval,
              "_is_authorized_autonomous_repair(",
              '''def _is_authorized_autonomous_repair(
              pull_request: dict[str, Any],
              files: list[dict[str, Any]],
          ) -> bool:
              """Recognize bounded repairs from the main repository or a fork.

              Repository origin is not an approval boundary. Only environment,
              secret-bearing, or personal-information paths require a human.
              """

              head = pull_request.get("head") or {}
              head_ref = str(head.get("ref") or "")
              body = str(pull_request.get("body") or "")

              if not head_ref.startswith(AUTONOMOUS_REPAIR_BRANCH_PREFIX):
                  return False
              if AUTONOMOUS_REPAIR_MARKER not in body:
                  return False
              if not files or len(files) > AUTONOMOUS_REPAIR_MAX_FILES:
                  return False

              for item in files:
                  paths = [str(item.get("filename") or "")]
                  previous = str(item.get("previous_filename") or "")
                  if previous:
                      paths.append(previous)
                  if any(_path_requires_human_approval(path) for path in paths):
                      return False
              return True''',
          )

          pull_start = approval.index('    if event_name == "pull_request":')
          pull_end = approval.index("\n\n    return None", pull_start)
          pull_block = '''    if event_name == "pull_request":
              pr = payload.get("pull_request") or {}
              number = pr.get("number") or payload.get("number")
              if not isinstance(number, int):
                  return None
              files = bot._request(
                  "GET", f"/repos/{bot.repository}/pulls/{number}/files?per_page=100"
              )
              files = files if isinstance(files, list) else []
              sensitive = _high_risk_files(files)
              if sensitive:
                  approval_number = _create_approval_issue(
                      bot,
                      source=f"pull-request-{number}",
                      title=f"Sensitive data changes in PR #{number}",
                      reason_lines=[
                          f"Environment, secret-bearing, or personal-information path changed: `{name}`"
                          for name in sensitive[:12]
                      ],
                      requested_capability="Pull request repair or publication",
                  )
                  bot.post_comment(
                      number,
                      "### Amosclaud Bot — Human approval required\n"
                      "Environment, secret-bearing, or personal-information files were detected. "
                      f"Approval issue: #{approval_number}",
                  )
                  return 0

              return None'''
          approval = approval[:pull_start] + pull_block + approval[pull_end:]
          approval_path.write_text(approval, encoding="utf-8")

          control_path = Path(".github/scripts/amosclaud_repair_control.py")
          control = control_path.read_text(encoding="utf-8")
          control = control.replace(
              "    duplicate: bool = False\n",
              "    duplicate: bool = False\n    head_repository: str = \"\"\n",
              1,
          )
          old_guard = '''        if route == "pull_request" and (not pr or pr.get("head_repo") != repository):
              return Route(False, "report_only", "github_actions", source, sha, branch, default_branch, source_run_id=str(run.get("id") or ""), reason="fork or unresolved pull request cannot receive repair credentials")
          '''
          new_guard = '''        if route == "pull_request" and not pr:
              return Route(False, "report_only", "github_actions", source, sha, branch, default_branch, source_run_id=str(run.get("id") or ""), reason="open pull request could not be resolved")
          '''
          if old_guard not in control:
              raise RuntimeError("Could not find workflow-run fork guard")
          control = control.replace(old_guard, new_guard, 1)
          control = control.replace(
              '            pull_request_number=pr.get("number", "") if pr else "",\n        )',
              '            pull_request_number=pr.get("number", "") if pr else "",\n            head_repository=pr.get("head_repo", repository) if pr else repository,\n        )',
              1,
          )
          status_anchor = '''            status_url=str(event.get("target_url") or ""),
              pull_request_number=pr.get("number", "") if pr else "",
          )'''
          status_replacement = '''            status_url=str(event.get("target_url") or ""),
              pull_request_number=pr.get("number", "") if pr else "",
              head_repository=pr.get("head_repo", repository) if pr else repository,
          )'''
          if status_anchor not in control:
              raise RuntimeError("Could not add status head repository")
          control = control.replace(status_anchor, status_replacement, 1)
          control = control.replace(
              "        base = default_branch\n        if pr_number:\n",
              "        base = default_branch\n        head_repository = repository\n        if pr_number:\n",
              1,
          )
          manual_fork_guard = '''            if pull.get("head", {}).get("repo", {}).get("full_name") != repository:
                  return Route(False, "report_only", "manual", "manual repair", sha, branch, base, pull_request_number=pr_number, reason="fork pull requests are report-only")
          '''
          if manual_fork_guard not in control:
              raise RuntimeError("Could not find manual fork guard")
          control = control.replace(
              manual_fork_guard,
              '            head_repository = str(pull.get("head", {}).get("repo", {}).get("full_name") or repository)\n',
              1,
          )
          old_manual_return = '        return Route(True, route, str(inputs.get("provider") or "manual"), source, sha, branch, base, source_run_id=str(inputs.get("source_run_id") or ""), status_url=str(inputs.get("status_url") or ""), pull_request_number=pr_number)'
          new_manual_return = '        return Route(True, route, str(inputs.get("provider") or "manual"), source, sha, branch, base, source_run_id=str(inputs.get("source_run_id") or ""), status_url=str(inputs.get("status_url") or ""), pull_request_number=pr_number, head_repository=head_repository)'
          if old_manual_return not in control:
              raise RuntimeError("Could not update manual route")
          control = control.replace(old_manual_return, new_manual_return, 1)
          control_path.write_text(control, encoding="utf-8")

          workflow_path = Path(".github/workflows/amosclaud-repair-control-plane.yml")
          workflow = workflow_path.read_text(encoding="utf-8")
          checkout_anchor = '''        with:
              ref: ${{ steps.route.outputs.target_sha }}
              path: target
          '''
          checkout_replacement = '''        with:
              repository: ${{ steps.route.outputs.head_repository || github.repository }}
              ref: ${{ steps.route.outputs.target_sha }}
              path: target
          '''
          if checkout_anchor not in workflow:
              raise RuntimeError("Could not update target checkout repository")
          workflow = workflow.replace(checkout_anchor, checkout_replacement, 1)
          workflow = workflow.replace(
              "          HEAD_REF: ${{ steps.route.outputs.target_branch }}\n",
              "          HEAD_REF: ${{ steps.route.outputs.target_branch }}\n          HEAD_REPOSITORY: ${{ steps.route.outputs.head_repository }}\n",
              1,
          )
          publish_start = workflow.index('          if [ "$ROUTE" = "pull_request" ]; then')
          publish_else = workflow.index('          else\n            export GH_TOKEN="$GITHUB_TOKEN"', publish_start)
          publish_branch = '''          if [ "$ROUTE" = "pull_request" ]; then
              remote_sha="$(git -C target ls-remote origin "refs/heads/${HEAD_REF}" | cut -f1)"
              if [ "$remote_sha" != "$TARGET_SHA" ]; then
                echo "Remote pull request branch moved; refusing a stale publication."
                exit 1
              fi

              if [ -n "$HEAD_REPOSITORY" ] && [ "$HEAD_REPOSITORY" != "$GITHUB_REPOSITORY" ]; then
                export GH_TOKEN="${AMOSCLAUD_AUTONOMOUS_TOKEN:-$GITHUB_TOKEN}"
                gh auth setup-git
                branch="amosclaud-fixer/pr-${PR_NUMBER}-${FINGERPRINT}-a${ATTEMPT}"
                git -C target remote add repair-base "https://github.com/${GITHUB_REPOSITORY}.git"
                git -C target push repair-base "HEAD:refs/heads/${branch}"
                body_file="$(mktemp)"
                cat > "$body_file" <<EOF
          ## Amosclaud Verified Fork PR Repair

          - Original pull request: #${PR_NUMBER}
          - Original repository: \`${HEAD_REPOSITORY}\`
          - Source revision: \`${TARGET_SHA}\`
          - Repair revision: \`${repair_sha}\`
          - Verification: credential-free adaptive pre-run passed
          - Publication: safe branch in \`${GITHUB_REPOSITORY}\`
          - Force push: not used

          This replacement repair PR preserves the original fork PR while allowing Amosclaud-Fixer to publish a verified correction without writing credentials into the contributor fork.
          EOF
                pr_url="$(gh pr create --repo "$GITHUB_REPOSITORY" --base "$BASE_REF" --head "$branch" --title "fix: Amosclaud verified repair for PR #${PR_NUMBER}" --body-file "$body_file")"
                gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "Amosclaud-Fixer produced and verified a repair for this forked PR: ${pr_url}"
                echo "publication=${pr_url} (replacement for fork PR #${PR_NUMBER})" >> "$GITHUB_OUTPUT"
              else
                export GH_TOKEN="${AMOSCLAUD_AUTONOMOUS_TOKEN:-$GITHUB_TOKEN}"
                gh auth setup-git
                git -C target push origin "HEAD:refs/heads/${HEAD_REF}"
                echo "publication=original pull request #${PR_NUMBER}" >> "$GITHUB_OUTPUT"
              fi
          '''
          workflow = workflow[:publish_start] + publish_branch + workflow[publish_else:]
          workflow_path.write_text(workflow, encoding="utf-8")

          policy = '''version: 2

          human_approval:
            enabled: true
            issue_prefix: "[Amosclaud Approval Required]"
            trusted_associations:
              - OWNER
              - MEMBER
              - COLLABORATOR

            automatic_issue_creation:
              environment_or_secret_files: true
              personal_information_files: true
              ordinary_code_repairs: false
              workflow_or_infrastructure_repairs: false
              fork_pull_requests: false

            autonomous_fixer:
              all_open_pull_requests: true
              fork_pull_requests: repair_via_verified_base_repository_branch
              direct_default_branch_writes: false
              force_push: false
              required_verification:
                - reproduce_failure_without_repair_credentials
                - generate_bounded_candidate
                - credential_free_adaptive_pre_run
                - required_pull_request_checks

            protected_paths:
              - ".env"
              - ".env.*"
              - "**/secrets.json"
              - "**/credentials.json"
              - "**/personal-information.*"
              - "**/personal_information.*"
              - "**/personally-identifiable/**"
              - "**/personally_identifiable/**"
              - "**/pii/**"
              - "**/pii.json"
              - "**/pii.csv"

            protected_tool_hints:
              - .env
              - environment variable
              - secret
              - credential
              - password
              - private key
              - access token
              - api key
              - personal information
              - personally identifiable
              - pii
              - social security
              - passport
              - date of birth
              - home address
              - bank account
              - credit card

            decision_commands:
              approve: "@amosclaud approve"
              deny: "@amosclaud deny"

            execution_policy:
              approval_does_not_auto_execute: true
              rerun_original_command_after_approval: true

            audit:
              keep_approval_issue: true
              record_human_identity: true
              record_source_issue_or_pull_request: true
          '''
          Path(".amosclaud/approvals.yml").write_text(
              "\n".join(line[10:] if line.startswith("          ") else line for line in policy.splitlines()) + "\n",
              encoding="utf-8",
          )

          test_path = Path("tests/test_amosclaud_approval_gate.py")
          tests = test_path.read_text(encoding="utf-8")
          tests = replace_function(
              tests,
              "test_sensitive_fix_objective_detection() -> None:",
              '''def test_sensitive_fix_objective_detection() -> None:
              assert _is_sensitive_objective("repair the .env production configuration")
              assert _is_sensitive_objective("remove personal information from customer data")
              assert _is_sensitive_objective("rotate a leaked API key")
              assert not _is_sensitive_objective("fix the deployment workflow")
              assert not _is_sensitive_objective("repair an authentication test")''',
          )
          tests = replace_function(
              tests,
              "test_high_risk_pull_request_paths() -> None:",
              '''def test_high_risk_pull_request_paths() -> None:
              files = [
                  {"filename": ".github/workflows/deploy.yml"},
                  {"filename": "src/service.py"},
                  {"filename": ".env.production"},
                  {"filename": "data/personal_information/customers.csv"},
                  {"filename": "config/credentials.json"},
              ]
              assert _high_risk_files(files) == [
                  ".env.production",
                  "data/personal_information/customers.csv",
                  "config/credentials.json",
              ]''',
          )
          tests = replace_function(
              tests,
              "test_autonomous_marker_cannot_bypass_protected_path_policy() -> None:",
              '''def test_autonomous_marker_cannot_bypass_sensitive_data_policy() -> None:
              pull_request = _autonomous_pr()

              assert _is_authorized_autonomous_repair(
                  pull_request,
                  [{"filename": ".github/workflows/deploy.yml"}],
              )
              assert _is_authorized_autonomous_repair(
                  pull_request,
                  [{"filename": "AGENTS.md"}],
              )
              assert not _is_authorized_autonomous_repair(
                  pull_request,
                  [{"filename": ".env.production"}],
              )
              assert not _is_authorized_autonomous_repair(
                  pull_request,
                  [{"filename": "data/personal_information/customers.csv"}],
              )''',
          )
          tests = replace_function(
              tests,
              "test_fork_and_protected_rename_cannot_forge_autonomous_authorization() -> None:",
              '''def test_forked_repairs_are_allowed_but_sensitive_renames_are_not() -> None:
              assert _is_authorized_autonomous_repair(
                  _autonomous_pr(head_repo="contributor/fork"),
                  [{"filename": "src/service.py"}],
              )
              assert not _is_authorized_autonomous_repair(
                  _autonomous_pr(),
                  [
                      {
                          "filename": "docs/renamed-data.txt",
                          "previous_filename": ".env.production",
                      }
                  ],
              )''',
          )
          tests = replace_function(
              tests,
              "test_repository_policy_records_the_same_bounded_authorization() -> None:",
              '''def test_repository_policy_records_automatic_fixer_scope() -> None:
              policy = APPROVAL_POLICY.read_text(encoding="utf-8")

              assert "all_open_pull_requests: true" in policy
              assert "fork_pull_requests: repair_via_verified_base_repository_branch" in policy
              assert "ordinary_code_repairs: false" in policy
              assert "workflow_or_infrastructure_repairs: false" in policy
              assert '".env.*"' in policy
              assert '"**/personal_information.*"' in policy
              assert "force_push: false" in policy''',
          )
          test_path.write_text(tests, encoding="utf-8")

          fork_test = '''from pathlib import Path


          ROOT = Path(__file__).resolve().parents[1]
          CONTROL = ROOT / ".github" / "scripts" / "amosclaud_repair_control.py"
          WORKFLOW = ROOT / ".github" / "workflows" / "amosclaud-repair-control-plane.yml"


          def test_fork_pull_requests_are_repairable_not_report_only() -> None:
              control = CONTROL.read_text(encoding="utf-8")

              assert "fork pull requests are report-only" not in control
              assert "fork or unresolved pull request cannot receive repair credentials" not in control
              assert "head_repository" in control


          def test_fork_repairs_publish_through_a_safe_base_repository_branch() -> None:
              workflow = WORKFLOW.read_text(encoding="utf-8")

              assert "steps.route.outputs.head_repository || github.repository" in workflow
              assert 'HEAD_REPOSITORY: ${{ steps.route.outputs.head_repository }}' in workflow
              assert "Amosclaud Verified Fork PR Repair" in workflow
              assert "replacement for fork PR" in workflow
              assert "git -C target remote add repair-base" in workflow
              assert "gh pr comment" in workflow
          '''
          Path("tests/test_amosclaud_fork_pr_repair.py").write_text(
              "\n".join(line[10:] if line.startswith("          ") else line for line in fork_test.splitlines()) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Format and validate policy changes
        run: |
          uv run --no-project --with-requirements requirements-ci-fast.txt black \
            amosclaud_bot/approval_gate.py \
            .github/scripts/amosclaud_repair_control.py \
            tests/test_amosclaud_approval_gate.py \
            tests/test_amosclaud_fork_pr_repair.py
          uv run --no-project --with-requirements requirements-ci-fast.txt pytest -q \
            tests/test_amosclaud_approval_gate.py \
            tests/test_amosclaud_fork_pr_repair.py \
            tests/test_automatic_ollama_repair_routing.py

      - name: Commit migration and remove one-time workflow
        run: |
          rm .github/workflows/amosclaud-fixer-policy-migration.yml
          git config user.name "Amosclaud Policy Migration"
          git config user.email "policy@amosclaud.internal"
          git add -A
          git commit -m "fix: allow automatic repairs except sensitive data changes"
          git push origin HEAD:fix/automatic-ollama-repair-routing
