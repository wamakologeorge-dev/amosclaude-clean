name: Amosclaud Provider Reconciliation

on:
  status:
  schedule:
    - cron: '41 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  statuses: read

concurrency:
  group: amosclaud-provider-reconcile-${{ github.event.sha || github.run_id }}
  cancel-in-progress: false

jobs:
  reconcile:
    if: >-
      github.event_name != 'status' ||
      github.event.state == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out trusted reconciliation code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Reconcile recovered provider incidents
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python .github/scripts/amosclaud_provider_reconcile.py \
            --event-name "$GITHUB_EVENT_NAME" \
            --event-path "$GITHUB_EVENT_PATH" \
            --repository "$GITHUB_REPOSITORY" \
            --token "$GITHUB_TOKEN"
