name: Real Operations Audit

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest

      - name: Run focused audit and Command Center contract tests
        run: >-
          python -m pytest -q
          tests/test_real_operations_audit.py
          tests/test_command_center_bridge_contract.py

      - name: Scan production folders
        run: python scripts/audit_real_operations.py --output real-operations-report.json

      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: real-operations-audit
          path: real-operations-report.json
          if-no-files-found: warn
