name: Amosclaud Clean Doctor

on:
  pull_request:
    paths:
      - .github/scripts/agent_chat.py
      - .github/scripts/amosclaud_repair_verify.py
      - .github/workflows/**
      - amoscloud_ai/scan_bug.py
      - tests/test_agent_chat_controller.py
      - tests/test_scan_bug.py
  push:
    branches: [main]
    paths:
      - .github/scripts/agent_chat.py
      - .github/scripts/amosclaud_repair_verify.py
      - .github/workflows/**
      - amoscloud_ai/scan_bug.py
      - tests/test_agent_chat_controller.py
      - tests/test_scan_bug.py

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Install focused verification tools
        run: python -m pip install --disable-pip-version-check black pytest 'PyYAML>=6,<7'

      - name: Verify Agent Chat and Scan Bug formatting
        run: |
          black --check --diff \
            .github/scripts/agent_chat.py \
            .github/scripts/amosclaud_repair_verify.py \
            amoscloud_ai/scan_bug.py \
            tests/test_agent_chat_controller.py \
            tests/test_scan_bug.py

      - name: Compile trusted Python controllers
        run: |
          python -m py_compile \
            .github/scripts/agent_chat.py \
            .github/scripts/amosclaud_repair_verify.py \
            amoscloud_ai/scan_bug.py

      - name: Run focused Agent Chat and Scan Bug tests
        run: |
          python -m pytest -q \
            tests/test_agent_chat_controller.py \
            tests/test_scan_bug.py
