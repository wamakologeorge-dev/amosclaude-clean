name: Node control plane

on:
  pull_request:
    paths:
      - "services/control_plane/**"
      - ".github/workflows/node-control-plane.yml"
  push:
    branches: [main]
    paths:
      - "services/control_plane/**"
      - ".github/workflows/node-control-plane.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/control_plane
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Check npm supply-chain policy
        run: node scripts/supply-chain-check.mjs
      - name: Install exact dependencies without lifecycle scripts
        run: npm install --ignore-scripts --no-fund
      - name: Run tests and syntax checks
        run: npm run check
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
