name: Amosclaud Pull Request Chat Group

on:
  issue_comment:
    types: [created]

permissions:
  actions: write
  checks: read
  contents: read
  issues: write
  pull-requests: write

jobs:
  doctor:
    if: >-
      github.event.issue.pull_request &&
      (github.event.comment.author_association == 'OWNER' ||
       github.event.comment.author_association == 'MEMBER' ||
       github.event.comment.author_association == 'COLLABORATOR') &&
      (contains(github.event.comment.body, '/amos explain') ||
       contains(github.event.comment.body, '/amos fix'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      GITHUB_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.issue.number }}
      REPORT_PATH: ${{ runner.temp }}/amosclaud-agent-chat/report.json
      DISPATCH_FIXER: ${{ contains(github.event.comment.body, '/amos fix') }}

    steps:
      - name: Check out trusted Repository Doctor
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: trusted
          persist-credentials: false

      - name: Set up trusted Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Explain the latest pull-request failure
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$REPORT_PATH")"
          command=(
            python trusted/.github/scripts/agent_chat.py pr
            --repository "$GITHUB_REPOSITORY"
            --pull-request "$PR_NUMBER"
            --output "$REPORT_PATH"
          )
          if [ "$DISPATCH_FIXER" = 'true' ]; then
            command+=(--dispatch)
          fi
          "${command[@]}"
          cat "$REPORT_PATH" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload redacted Repository Doctor evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: amosclaud-pr-doctor-${{ github.run_id }}
          path: ${{ runner.temp }}/amosclaud-agent-chat
          if-no-files-found: warn
          retention-days: 14

  scan:
    if: >-
      github.event.issue.pull_request &&
      (github.event.comment.author_association == 'OWNER' ||
       github.event.comment.author_association == 'MEMBER' ||
       github.event.comment.author_association == 'COLLABORATOR') &&
      contains(github.event.comment.body, '/amos scan')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.issue.number }}

    steps:
      - name: Dispatch the read-only Scan Bug
        run: |
          gh workflow run scan.yml \
            -f pull_request_number="$PR_NUMBER" \
            -f dispatch_fixer=true
