name: Amosclaud Main Clean

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: Optional pull request number to receive the clean comment
        required: false
        type: string

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ecosystem-clean:
    name: .Amosclaud/main ecosystem clean
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Verify Amosclaud ecosystem
        shell: bash
        run: |
          set -euo pipefail
          report="${RUNNER_TEMP}/amosclaud-main-clean.json"
          python scripts/ci/verify_amosclaud_ecosystem.py \
            --manifest .Amosclaud/main/ecosystem.json \
            --report "${report}"
          {
            echo '### Amosclaud ecosystem verification'
            echo '```json'
            cat "${report}"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Write clean completion comment
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pull_request_number }}
          MARKER: .Amosclaud/main clean_100%
        run: |
          set -euo pipefail
          if [[ -z "${PR_NUMBER}" ]]; then
            echo "No pull request number was supplied; verification passed without a comment."
            exit 0
          fi

          api="https://api.github.com/repos/${REPOSITORY}"
          headers=(
            --header "Authorization: Bearer ${GH_TOKEN}"
            --header "Accept: application/vnd.github+json"
            --header "X-GitHub-Api-Version: 2022-11-28"
          )
          comments="$(curl --fail-with-body --silent --show-error \
            "${headers[@]}" \
            "${api}/issues/${PR_NUMBER}/comments?per_page=100")"
          comment_id="$(jq -r --arg marker "${MARKER}" \
            '.[] | select(.user.login == "github-actions[bot]" and (.body | contains($marker))) | .id' \
            <<<"${comments}" | head -n 1)"
          payload="$(jq -n --arg body "${MARKER}" '{body: $body}')"

          if [[ -n "${comment_id}" ]]; then
            curl --fail-with-body --silent --show-error \
              --request PATCH \
              "${headers[@]}" \
              --header "Content-Type: application/json" \
              --data "${payload}" \
              "${api}/issues/comments/${comment_id}" >/dev/null
          else
            curl --fail-with-body --silent --show-error \
              --request POST \
              "${headers[@]}" \
              --header "Content-Type: application/json" \
              --data "${payload}" \
              "${api}/issues/${PR_NUMBER}/comments" >/dev/null
          fi
