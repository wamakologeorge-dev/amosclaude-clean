name: Amosclaud Incident Deduplicator

on:
  issues:
    types: [opened, reopened, edited]
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: amosclaud-incident-deduplicator
  cancel-in-progress: false

jobs:
  consolidate:
    if: github.event_name != 'issues' || !github.event.issue.pull_request
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out incident guard
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Consolidate recurrent repair incidents
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number || '' }}
        run: |
          set -euo pipefail
          args=(
            --repository "$GITHUB_REPOSITORY"
            --token "$GITHUB_TOKEN"
          )
          if [ -n "$ISSUE_NUMBER" ]; then
            args+=(--issue-number "$ISSUE_NUMBER")
          fi
          python .github/scripts/amosclaud_incident_deduplicator.py "${args[@]}"
