name: Amosclaud Self-Healing PR Loop

on:
  workflow_run:
    workflows:
      - Amosclaud CI
      - Python package
      - Build and Verify
      - CI/CD — Test & Deploy
      - Amosclaud Workspace CI
      - Docker Image CI
      - CodeQL
      - Fortify AST Scan
      - Real Operations Audit
      - Amosclaud AI Feedback Loop
      - Amosclaud CI/CD Pipeline
      - Amosclaud Bot
      - 🏗️ Platform Build Check
      - 🚀 Amosclaud AI — Live Server Check
      - 🚀 Amosclaud AI - CI Pipeline
    types: [completed]

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: amosclaud-self-heal-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  dispatch-same-pr-repair:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out trusted callback engine
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Install focused test dependency
        run: python -m pip install --disable-pip-version-check pytest

      - name: Verify the callback policy before using credentials
        run: python -m pytest -q tests/test_self_heal_pr.py

      - name: Require the privileged Amosclaud credential
        env:
          AMOSCLAUD_GITHUB_TOKEN: ${{ secrets.AMOSCLAUD_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$AMOSCLAUD_GITHUB_TOKEN" || {
            echo "AMOSCLAUD_GITHUB_TOKEN is required for same-PR repair callbacks."
            exit 1
          }

      - name: Collect exact failed workflow evidence
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          WORKFLOW_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set +e
          gh run view "$RUN_ID" --log-failed > /tmp/amosclaud-failed.log 2>&1
          log_status=$?
          set -e
          if [ "$log_status" -ne 0 ] || [ ! -s /tmp/amosclaud-failed.log ]; then
            {
              echo "Failed workflow: $WORKFLOW_NAME"
              echo "Run: $WORKFLOW_URL"
              echo
              echo "GitHub did not expose the complete failed log. Failed job and step summary:"
              gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/jobs" \
                --jq '.jobs[] | select(.conclusion == "failure") | "JOB: \(.name)\n" + ([.steps[] | select(.conclusion == "failure") | "  STEP: \(.name)"] | join("\n"))' \
                || true
            } > /tmp/amosclaud-failed.log
          fi

      - name: Dispatch bounded repair into the existing pull request
        env:
          AMOSCLAUD_GITHUB_TOKEN: ${{ secrets.AMOSCLAUD_GITHUB_TOKEN }}
          AMOSCLAUD_MAX_PR_REPAIR_ATTEMPTS: '5'
        run: |
          set -euo pipefail
          python .github/scripts/self_heal_pr.py \
            --event "$GITHUB_EVENT_PATH" \
            --failed-log /tmp/amosclaud-failed.log \
            --max-attempts "$AMOSCLAUD_MAX_PR_REPAIR_ATTEMPTS"
