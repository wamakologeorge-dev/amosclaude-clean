name: Amosclaud Bot Contributor

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/amosclaud-bot-contributor.yml"
      - ".github/workflows/amosclaud-bot-review.yml"
      - ".github/workflows/amosclaud-codeql-threat-gate.yml"
      - ".github/workflows/amosclaud-security-repair-bridge.yml"
      - ".github/workflows/amosclaud-dependency-threat-gate.yml"
      - ".github/workflows/codeql.yml"
      - ".github/workflows/fortify.yml"
      - ".github/workflows/policy.yml"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - ".github/CODEOWNERS"
      - "AGENTS.md"
      - "amosclaud_bot/dispatcher.py"
      - "amosclaud_bot/owner_directives.py"
      - "amosclaud_bot/review_publisher.py"
      - "amosclaud_bot/status_board.py"
      - "amoscloud_ai/bot_contributor_profile.py"
      - "amoscloud_ai/github_app_connection.py"
      - "amoscloud_ai/health_contract.py"
      - "amoscloud_ai/security_repair_bridge.py"
      - "scripts/ci/advanced_security_gate.py"
      - "scripts/ci/bandit_pr_gate.py"
      - "scripts/ci/contributor_tool_policy_guard.py"
      - "tests/test_advanced_security_gate.py"
      - "tests/test_bandit_pr_gate.py"
      - "tests/test_amosclaud_bot.py"
      - "tests/test_amosclaud_review_publisher.py"
      - "tests/test_amosclaud_status_board.py"
      - "tests/test_bot_contributor_profile.py"
      - "tests/test_contributor_tool_policy_guard.py"
      - "tests/test_github_app_connection.py"
      - "tests/test_health_contract.py"
      - "tests/test_owner_directives.py"
      - "tests/test_security_repair_bridge.py"
      - "docs/AMOSCLAUD_BOT_CONTRIBUTOR.md"
      - "docs/AMOSCLAUD_BOT_FORMAL_REVIEW.md"
      - "docs/AMOSCLAUD_SECURITY_REPAIR_LOOP.md"
      - "docs/CONTRIBUTOR_TOOL_POLICY.md"
  workflow_dispatch:
    inputs:
      require_live_profile:
        description: Verify the trusted main branch using protected GitHub App credentials
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contributor-profile-contract:
    name: contributor-profile-contract
    runs-on: ${{ vars.AMOSCLAUD_CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install the Amosclaud repository runtime
        run: |
          python -m pip install --disable-pip-version-check -e . pytest

      - name: Compile contributor, command, review, security, and health contracts
        run: |
          python -m compileall -q \
            amosclaud_bot/dispatcher.py \
            amosclaud_bot/owner_directives.py \
            amosclaud_bot/review_publisher.py \
            amosclaud_bot/status_board.py \
            amoscloud_ai/bot_contributor_profile.py \
            amoscloud_ai/github_app_connection.py \
            amoscloud_ai/health_contract.py \
            amoscloud_ai/security_repair_bridge.py \
            scripts/ci/advanced_security_gate.py \
            scripts/ci/bandit_pr_gate.py \
            scripts/ci/contributor_tool_policy_guard.py

      - name: Run focused contributor, command, review, security, and health tests
        run: |
          python -m pytest -q \
            tests/test_advanced_security_gate.py \
            tests/test_bandit_pr_gate.py \
            tests/test_amosclaud_bot.py \
            tests/test_amosclaud_review_publisher.py \
            tests/test_amosclaud_status_board.py \
            tests/test_bot_contributor_profile.py \
            tests/test_contributor_tool_policy_guard.py \
            tests/test_github_app_connection.py \
            tests/test_health_contract.py \
            tests/test_owner_directives.py \
            tests/test_security_repair_bridge.py

      - name: Enforce permanent contributor tool policy
        run: python scripts/ci/contributor_tool_policy_guard.py

      - name: Produce non-secret contributor profile evidence
        env:
          GITHUB_APP_SLUG: ${{ vars.GITHUB_APP_SLUG || 'amosclaud-bot' }}
          GITHUB_APP_ID: ${{ vars.GITHUB_APP_ID }}
          GITHUB_APP_INSTALLATION_ID: ${{ vars.GITHUB_APP_INSTALLATION_ID }}
          GITHUB_APP_BOT_USER_ID: ${{ vars.GITHUB_APP_BOT_USER_ID }}
        run: python -m amoscloud_ai.bot_contributor_profile > contributor-profile.json

      - name: Upload contributor profile evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: amosclaud-bot-contributor-profile
          path: contributor-profile.json
          if-no-files-found: warn

  live-profile-verification:
    name: live-profile-verification
    if: github.event_name == 'workflow_dispatch' && inputs.require_live_profile
    runs-on: ${{ vars.AMOSCLAUD_CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10

    steps:
      - name: Check out trusted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install the trusted Amosclaud runtime
        run: python -m pip install --disable-pip-version-check -e .

      - name: Authenticate as the GitHub App and installation
        env:
          GITHUB_APP_SLUG: ${{ vars.GITHUB_APP_SLUG || 'amosclaud-bot' }}
          GITHUB_APP_ID: ${{ vars.GITHUB_APP_ID }}
          GITHUB_APP_INSTALLATION_ID: ${{ vars.GITHUB_APP_INSTALLATION_ID }}
          GITHUB_APP_BOT_USER_ID: ${{ vars.GITHUB_APP_BOT_USER_ID }}
          GITHUB_APP_PRIVATE_KEY: ${{ secrets.GITHUB_APP_PRIVATE_KEY }}
          GITHUB_APP_WEBHOOK_SECRET: ${{ secrets.GITHUB_APP_WEBHOOK_SECRET }}
        run: |
          python -m amoscloud_ai.bot_contributor_profile \
            --require-ready > live-profile-verification.json

      - name: Upload live verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: amosclaud-bot-live-verification
          path: live-profile-verification.json
          if-no-files-found: warn
