name: Amosclaud Repair Memory Learner

on:
  workflow_run:
    workflows:
      - Amosclaud Repair Control Plane
    types: [completed]
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful repair-control workflow run ID
        required: true
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: amosclaud-repair-memory
  cancel-in-progress: false

jobs:
  learn:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SOURCE_RUN_ID: ${{ inputs.source_run_id || github.event.workflow_run.id }}
      MEMORY_CATALOG: ${{ github.workspace }}/memory-store/Amosclaud-storage/repair-memory/catalog.json
    steps:
      - name: Check out trusted memory implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: trusted
          fetch-depth: 1
          persist-credentials: false

      - name: Check out Amosclaud Storage Memory
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: amosclaud-memory
          path: memory-store
          fetch-depth: 1
          persist-credentials: true

      - name: Download verified repair evidence
        id: evidence
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: amosclaud-repair-control-${{ env.SOURCE_RUN_ID }}
          path: evidence
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}

      - name: Learn only from a published verified repair
        id: learn
        env:
          GITHUB_RUN_SUMMARY_FILE: ${{ runner.temp }}/amosclaud-capability.md
        run: |
          set -euo pipefail
          failure="evidence/amosclaud-repair-failure.log"
          candidate="evidence/amosclaud-candidate-report.json"
          verification="evidence/amosclaud-verification-report.json"
          if [ ! -f "$failure" ] || [ ! -f "$candidate" ] || [ ! -f "$verification" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No complete verified repair evidence was available; memory was not changed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          PYTHONPATH=trusted python -m amoscloud_ai.repair_knowledge \
            --catalog "$MEMORY_CATALOG" \
            learn \
            --failure-log "$failure" \
            --candidate-report "$candidate" \
            --verification-report "$verification" \
            --source "Amosclaud Repair Control Plane" \
            --source-run-id "$SOURCE_RUN_ID" \
            --summary "$GITHUB_RUN_SUMMARY_FILE"
          cat "$GITHUB_RUN_SUMMARY_FILE" >> "$GITHUB_STEP_SUMMARY"
          if git -C memory-store diff --quiet -- Amosclaud-storage/repair-memory/catalog.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Persist clean memory to the dedicated branch
        if: steps.learn.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git -C memory-store config user.name "Amosclaud Storage Memory"
          git -C memory-store config user.email "memory@amosclaud.internal"
          git -C memory-store add -- Amosclaud-storage/repair-memory/catalog.json
          git -C memory-store commit -m "memory: learn verified repair from run ${SOURCE_RUN_ID}"
          git -C memory-store push origin HEAD:amosclaud-memory
