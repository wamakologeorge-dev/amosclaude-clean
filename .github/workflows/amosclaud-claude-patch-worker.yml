name: Amosclaud Ollama Patch Compatibility Worker

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: Pull request number validated by a trusted dispatcher
        required: true
        type: string
      comment_id:
        description: Source owner comment ID for evidence
        required: true
        type: string
      expected_head_sha:
        description: Exact pull-request head SHA captured by the dispatcher
        required: true
        type: string

permissions: {}

concurrency:
  group: amosclaud-ollama-worker-${{ github.repository }}-${{ inputs.issue_number }}-${{ inputs.comment_id }}
  cancel-in-progress: false

jobs:
  dispatch-native-repair:
    name: dispatch-native-repair
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
      issues: read
      pull-requests: read

    steps:
      - name: Check out trusted default-branch control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: trusted
          fetch-depth: 1
          persist-credentials: false

      - name: Revalidate exact unprotected pull-request head
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          case "$ISSUE_NUMBER" in (*[!0-9]*|'') echo "Invalid issue number"; exit 1;; esac
          case "$EXPECTED_HEAD_SHA" in (*[!0-9a-fA-F]*|'') echo "Invalid head SHA"; exit 1;; esac
          test "${#EXPECTED_HEAD_SHA}" -eq 40
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${ISSUE_NUMBER}" > "$RUNNER_TEMP/amosclaud-pr.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          pull = json.loads(Path(os.environ["RUNNER_TEMP"]).joinpath("amosclaud-pr.json").read_text(encoding="utf-8"))
          head = pull.get("head") or {}
          head_repo = str(((head.get("repo") or {}).get("full_name")) or "")
          current = str(head.get("sha") or "").lower()
          head_ref = str(head.get("ref") or "")
          eligible = (
              pull.get("state") == "open"
              and head_repo == os.environ["GITHUB_REPOSITORY"]
              and current == os.environ["EXPECTED_HEAD_SHA"].lower()
              and bool(head_ref)
              and head_ref != os.environ["DEFAULT_BRANCH"]
          )
          if not eligible:
              raise SystemExit("Exact PR head is no longer eligible for native Ollama repair")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"head_sha={current}\n")
              output.write(f"head_ref={head_ref}\n")
          PY

      - name: Dispatch native Ollama-backed Repair Control Plane
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          EXPECTED_HEAD_SHA: ${{ steps.target.outputs.head_sha }}
          COMMENT_ID: ${{ inputs.comment_id }}
          STATUS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          gh workflow run amosclaud-repair-control-plane.yml \
            --ref "$DEFAULT_BRANCH" \
            -f scope="pull_request" \
            -f pull_request_number="$ISSUE_NUMBER" \
            -f target_sha="$EXPECTED_HEAD_SHA" \
            -f source_run_id="$GITHUB_RUN_ID" \
            -f source_name="Amosclaud Ollama Compatibility Worker" \
            -f provider="ollama-cloud" \
            -f status_url="$STATUS_URL" \
            -f failure_summary="Run the bounded owner request from comment ${COMMENT_ID} through the native Amosclaud Ollama repair path."

      - name: Report truthful routing result
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: |
          gh pr comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "### Amosclaud Ollama Compatibility Worker\n\n🟦 **Result:** ROUTED TO NATIVE REPAIR\n\nNo Anthropic service or credential was used. The request was delegated to the Amosclaud Repair Control Plane, which selects the configured Ollama service first and verifies changes before publication."
