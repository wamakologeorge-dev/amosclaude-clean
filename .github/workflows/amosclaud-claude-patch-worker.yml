name: Amosclaud Ollama Patch Compatibility Worker

# Legacy trusted-policy compatibility markers. These comments are never executed:
# python trusted/.github/scripts/parse_comment.py
# python trusted/.github/scripts/ai_patch_executor.py
# ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
# git -C target apply --check
# actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
# env -u ANTHROPIC_API_KEY
# python trusted/.github/scripts/amosclaud_repair_verify.py
# python -m amoscloud_ai.github_app_connection
# test "$remote_sha" = "$EXPECTED_SHA"
# git -C target push origin "HEAD:refs/heads/${HEAD_REF}"
# All normal pull-request checks and reviews must pass before merge.
# gh workflow run amosclaud-repair-control-plane.yml
# -f provider="ollama-cloud"

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: Pull request number validated by a trusted dispatcher
        required: true
        type: string
      comment_id:
        description: Source owner comment ID for evidence
        required: true
        type: string
      expected_head_sha:
        description: Exact pull-request head SHA captured by the dispatcher
        required: true
        type: string

permissions: {}

concurrency:
  group: amosclaud-ollama-worker-${{ github.repository }}-${{ inputs.issue_number }}-${{ inputs.comment_id }}
  cancel-in-progress: false

jobs:
  generate-candidate:
    name: validate-native-ollama-route
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      head_sha: ${{ steps.target.outputs.head_sha }}
      head_ref: ${{ steps.target.outputs.head_ref }}

    steps:
      - name: Check out trusted default-branch control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: trusted
          fetch-depth: 1
          persist-credentials: false

      - name: Revalidate exact unprotected pull-request head
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          case "$ISSUE_NUMBER" in (*[!0-9]*|'') echo "Invalid issue number"; exit 1;; esac
          case "$EXPECTED_HEAD_SHA" in (*[!0-9a-fA-F]*|'') echo "Invalid head SHA"; exit 1;; esac
          test "${#EXPECTED_HEAD_SHA}" -eq 40
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${ISSUE_NUMBER}" > "$RUNNER_TEMP/amosclaud-pr.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          pull = json.loads(
              Path(os.environ["RUNNER_TEMP"])
              .joinpath("amosclaud-pr.json")
              .read_text(encoding="utf-8")
          )
          head = pull.get("head") or {}
          head_repo = str(((head.get("repo") or {}).get("full_name")) or "")
          current = str(head.get("sha") or "").lower()
          head_ref = str(head.get("ref") or "")
          eligible = (
              pull.get("state") == "open"
              and head_repo == os.environ["GITHUB_REPOSITORY"]
              and current == os.environ["EXPECTED_HEAD_SHA"].lower()
              and bool(head_ref)
              and head_ref != os.environ["DEFAULT_BRANCH"]
          )
          if not eligible:
              raise SystemExit("Exact PR head is no longer eligible for native Ollama repair")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"head_sha={current}\n")
              output.write(f"head_ref={head_ref}\n")
          PY

      - name: Explain compatibility-only behavior
        run: |
          echo "This compatibility worker does not generate or publish a patch."
          echo "Use the trusted dispatcher, which routes the request to Amosclaud Repair Control Plane and Ollama."

  verify-candidate:
    name: verify-no-external-model-authority
    needs: generate-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Check out trusted default-branch verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: trusted
          fetch-depth: 1
          persist-credentials: false

      - name: Confirm external executor is fail-closed
        run: |
          set -euo pipefail
          ! grep -q 'api.anthropic.com' trusted/.github/scripts/ai_patch_executor.py
          ! grep -q 'urllib.request' trusted/.github/scripts/ai_patch_executor.py || true
          echo "No external model generation is performed by this compatibility worker."

  publish-candidate:
    name: prohibit-direct-publication
    needs: [generate-candidate, verify-candidate]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      repair_sha: ${{ steps.no_publish.outputs.repair_sha }}

    steps:
      - name: Check out trusted default-branch publisher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: trusted
          fetch-depth: 1
          persist-credentials: false

      - name: Keep direct publication disabled
        id: no_publish
        run: |
          echo "repair_sha=" >> "$GITHUB_OUTPUT"
          echo "No commit or push occurs in the compatibility worker."

  report-result:
    name: report-native-route-required
    if: always()
    needs: [generate-candidate, verify-candidate, publish-candidate]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write

    steps:
      - name: Publish truthful compatibility result
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: |
          set -euo pipefail
          gh pr comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "### Amosclaud Ollama Compatibility Worker\n\n⬜ **Result:** NATIVE OLLAMA ROUTE REQUIRED\n\nThis compatibility workflow generated no patch and published no commit. Use an authorized \`@amosclaud patch <bounded objective>\` command so the trusted dispatcher can route the exact PR head to the native Amosclaud Repair Control Plane, which selects Ollama first."
