name: Fix model runtime correction runner boundary

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

jobs:
  fix-runner:
    if: github.head_ref == 'agent/fix-model-runtime-dashboard'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 1
          show-progress: false

      - name: Scope the success marker to the TCP block
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path(".github/workflows/run-model-runtime-dashboard-fix-on-pr.yml")
          text = path.read_text(encoding="utf-8")
          old = '''          if runtime.count(tcp_start_marker) != 1 or runtime.count(success_marker) != 1:
              raise SystemExit(
                  "Could not uniquely locate TCP preflight block: "
                  f"start={runtime.count(tcp_start_marker)}, "
                  f"success={runtime.count(success_marker)}"
              )
          tcp_start = runtime.index(tcp_start_marker)
          tcp_end = runtime.index(success_marker, tcp_start)
'''
          new = '''          if runtime.count(tcp_start_marker) != 1:
              raise SystemExit(
                  "Could not uniquely locate TCP preflight start: "
                  f"start={runtime.count(tcp_start_marker)}"
              )
          tcp_start = runtime.index(tcp_start_marker)
          try:
              tcp_end = runtime.index(success_marker, tcp_start)
          except ValueError as error:
              raise SystemExit(
                  "Could not locate the healthy return after the TCP preflight block"
              ) from error
'''
          if text.count(old) != 1:
              raise SystemExit(f"Expected one runner block, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          rm .github/workflows/fix-model-runtime-runner.yml
          git config user.name "Amosclaud Repair Bot"
          git config user.email "actions@users.noreply.github.com"
          git add .github/workflows/run-model-runtime-dashboard-fix-on-pr.yml \
                  .github/workflows/fix-model-runtime-runner.yml
          git commit -m "Scope model runtime patch boundary [skip ci]"
          git push origin HEAD:${{ github.head_ref }}
