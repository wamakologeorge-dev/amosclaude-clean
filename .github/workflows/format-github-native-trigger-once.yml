name: Format GitHub Native Trigger Once

on:
  push:
    branches:
      - feature/amosclaud-pipeline-cooperation-phase-1

permissions:
  contents: write

concurrency:
  group: format-github-native-trigger-once
  cancel-in-progress: false

jobs:
  format-and-remove-self:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the pipeline branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/amosclaud-pipeline-cooperation-phase-1
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Format every changed Python file
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install "black>=24.4,<27" "isort>=8.0.1,<9"
          git fetch --no-tags origin main
          base="$(git merge-base HEAD origin/main)"
          git diff --name-only --diff-filter=ACMR "$base"...HEAD -- '*.py' > /tmp/python-files.txt
          sed -i '/^[[:space:]]*$/d' /tmp/python-files.txt
          if [[ -s /tmp/python-files.txt ]]; then
            xargs -d '\n' black -- < /tmp/python-files.txt
            xargs -d '\n' isort -- < /tmp/python-files.txt
          fi
          rm -f .github/workflows/format-github-native-trigger-once.yml
          git diff --check

      - name: Commit formatting and remove this temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "amosclaud-pipeline-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "style: format GitHub-native pipeline changes"
          git push origin HEAD:feature/amosclaud-pipeline-cooperation-phase-1
