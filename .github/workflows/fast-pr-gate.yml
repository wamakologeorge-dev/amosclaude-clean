name: Fast PR Gate

on:
  pull_request:
    branches: [main]
    paths:
      - "**/*.py"
      - "**/*.yml"
      - "**/*.yaml"
      - "requirements*.txt"
      - "pyproject.toml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"

jobs:
  fast-pr-gate:
    name: fast-pr-gate
    runs-on: ${{ vars.AMOSCLAUD_CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5

    steps:
      - name: Check out pull request
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci-fast.txt

      - name: Install fast-gate tools
        run: python -m pip install --prefer-binary -r requirements-ci-fast.txt

      - name: Validate changed files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python scripts/ci/fast_gate.py --base "$BASE_SHA" --head "$HEAD_SHA"
