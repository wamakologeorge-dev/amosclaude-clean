name: Fast PR Gate

on:
  pull_request:
    branches: [main]
    paths:
      - "**/*.py"
      - "**/*.yml"
      - "**/*.yaml"
      - "requirements*.txt"
      - "pyproject.toml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  fast-pr-gate:
    name: fast-pr-gate
    runs-on: ${{ vars.AMOSCLAUD_CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5

    steps:
      - name: Check out pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.16"
          enable-cache: true
          cache-dependency-glob: requirements-ci-fast.txt

      - name: Validate changed files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -o pipefail
          uv run --no-project --with-requirements requirements-ci-fast.txt \
            python scripts/ci/fast_gate.py --base "$BASE_SHA" --head "$HEAD_SHA" \
            2>&1 | tee fast-pr-gate.log

      - name: Upload fast-gate diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: fast-pr-gate-diagnostics
          path: fast-pr-gate.log
          if-no-files-found: warn
