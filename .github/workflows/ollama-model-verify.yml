name: Ollama Model Verify

on:
  workflow_dispatch:
    inputs:
      model:
        description: Ollama model name to verify
        required: true
        default: wamakologeorge/amosclaud-clean:latest
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out trusted repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Install Amosclaud model runtime
        run: python -m pip install --disable-pip-version-check -e .

      - name: Verify model visibility and completion
        env:
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          OLLAMA_URL: ${{ secrets.OLLAMA_URL }}
          AMOSCLAUD_MODEL: ${{ inputs.model }}
          OLLAMA_REQUIRE_MODEL: 'true'
          OLLAMA_PROBE_COMPLETION: 'true'
        run: python -m amosclaud_bot.ollama_connection
