name: Amosclaud Fixer

on:
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: Open pull request receiving a bounded repair attempt
        required: true
        type: string

permissions:
  actions: write
  checks: read
  contents: read
  issues: write
  pull-requests: write

jobs:
  fix:
    uses: ./.github/workflows/agent-chat.yml
    with:
      mode: pr
      pull_request_number: ${{ inputs.pull_request_number }}
      dispatch_fixer: true
