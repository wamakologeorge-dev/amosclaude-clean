name: Amosclaud Repair Results

on:
  workflow_run:
    workflows:
      - Fast PR Gate
      - Repository Behavior Automation
      - Amosclaud CI
      - Python package
      - Amosclaud Main Clean
      - Build and Verify
      - CI/CD — Test & Deploy
      - Docker Image CI
      - Platform Build Check
      - CodeQL
      - CircleCI Pipeline
    types: [completed]

permissions:
  actions: write
  checks: read
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: amosclaud-results-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

jobs:
  reconcile:
    if: github.event.workflow_run.conclusion == 'success'
    uses: ./.github/workflows/agent-chat.yml
    with:
      mode: result
      target_sha: ${{ github.event.workflow_run.head_sha }}
      dispatch_fixer: false
