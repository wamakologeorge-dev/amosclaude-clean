name: Apply repository initialization fix

on:
  push:
    branches:
      - agent/amosclaud-markdown-service

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out correction branch
        uses: actions/checkout@v7
        with:
          ref: agent/amosclaud-markdown-service
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install repository test runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Apply application correction
        run: python scripts/apply_repository_init_fix.py

      - name: Verify repository creation and Markdown integration
        run: |
          python -m pytest -q \
            tests/test_agent_repository_action_api.py::test_authenticated_chat_creates_repository \
            tests/test_real_native_agent_execution.py::test_native_executor_creates_repository_and_issue \
            tests/test_amosclaud_markdown_service.py
          python -m compileall -q amoscloud_ai/api/routes/repositories.py
          git diff --check

      - name: Commit verified correction and remove temporary runner
        run: |
          rm scripts/apply_repository_init_fix.py
          rm .github/workflows/apply-repository-init-fix.yml
          git config user.name 'amosclaud-fixer[bot]'
          git config user.email 'amosclaud-fixer[bot]@users.noreply.github.com'
          git add amoscloud_ai/api/routes/repositories.py \
            scripts/apply_repository_init_fix.py \
            .github/workflows/apply-repository-init-fix.yml
          git commit -m 'fix: initialize repositories in configured storage'
          git push origin HEAD:agent/amosclaud-markdown-service
