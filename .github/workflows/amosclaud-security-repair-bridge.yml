name: Amosclaud Security Repair Bridge

on:
  workflow_run:
    workflows:
      - CodeQL
      - Amosclaud Dependency Threat Gate
      - Fortify AST Scan
    types: [completed]

permissions:
  contents: read

concurrency:
  group: amosclaud-security-repair-${{ github.event.workflow_run.head_sha }}-${{ github.event.workflow_run.name }}
  cancel-in-progress: false

jobs:
  route-security-repair:
    name: route-security-repair
    if: >-
      github.event.workflow_run.name != 'CodeQL' &&
      (github.event.workflow_run.conclusion == 'failure' ||
       github.event.workflow_run.conclusion == 'timed_out' ||
       github.event.workflow_run.conclusion == 'action_required' ||
       github.event.workflow_run.conclusion == 'startup_failure')
    runs-on: ${{ vars.AMOSCLAUD_CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10

    steps:
      - name: Check out trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Install trusted Amosclaud runtime
        run: python -m pip install --disable-pip-version-check -e .

      - name: Verify App installation and dispatch bounded repair
        env:
          GITHUB_APP_SLUG: ${{ vars.GITHUB_APP_SLUG || 'amosclaud-bot' }}
          GITHUB_APP_ID: ${{ vars.GITHUB_APP_ID }}
          GITHUB_APP_INSTALLATION_ID: ${{ vars.GITHUB_APP_INSTALLATION_ID }}
          GITHUB_APP_BOT_USER_ID: ${{ vars.GITHUB_APP_BOT_USER_ID }}
          GITHUB_APP_PRIVATE_KEY: ${{ secrets.GITHUB_APP_PRIVATE_KEY }}
        run: python -m amoscloud_ai.security_repair_bridge
