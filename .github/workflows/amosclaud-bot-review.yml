name: Amosclaud Bot Formal Review

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  checks: read
  issues: write
  pull-requests: write

concurrency:
  group: amosclaud-formal-review-${{ github.repository }}-${{ github.event.issue.number }}-${{ github.event.comment.id }}
  cancel-in-progress: false

jobs:
  formal-review:
    name: formal-review
    if: >-
      github.event.issue.pull_request &&
      (startsWith(github.event.comment.body, '@amosclaud review') ||
       startsWith(github.event.comment.body, '@amosclaud-bot review'))
    runs-on: ${{ vars.AMOSCLAUD_CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10

    steps:
      - name: Check out trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Install trusted Amosclaud runtime
        run: python -m pip install --disable-pip-version-check -e .

      - name: Publish exact-commit pull-request review
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m amosclaud_bot.review_publisher
