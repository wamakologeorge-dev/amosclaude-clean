name: Temporary repository management format

on:
  push:
    branches:
      - agent/github-repository-developer-controls

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: agent/github-repository-developer-controls
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.16"

      - name: Format changed Python files
        run: |
          uvx --from black==26.3.1 black \
            amoscloud_ai/api/routes/github_repository_management.py \
            tests/test_github_repository_management.py
          uvx --from isort==8.0.1 isort \
            amoscloud_ai/api/routes/github_repository_management.py \
            tests/test_github_repository_management.py
          rm .github/workflows/temporary-repository-management-format.yml

      - name: Commit formatting and remove temporary workflow
        run: |
          git config user.name "Amosclaud CI"
          git config user.email "actions@users.noreply.github.com"
          git add \
            amoscloud_ai/api/routes/github_repository_management.py \
            tests/test_github_repository_management.py \
            .github/workflows/temporary-repository-management-format.yml
          git diff --cached --check
          git commit -m "style: format repository developer controls"
          git push origin HEAD:agent/github-repository-developer-controls
