name: Amosclaud GitHub Chat

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

permissions:
  actions: write
  checks: read
  contents: read
  issues: write
  pull-requests: read
  statuses: read

concurrency:
  group: amosclaud-github-chat-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: false

jobs:
  chat:
    if: >-
      (github.event_name == 'issues' &&
       (startsWith(github.event.issue.title, '[Amosclaud Chat]') ||
        contains(github.event.issue.labels.*.name, 'amosclaud-chat'))) ||
      (github.event_name == 'issue_comment' &&
       github.event.comment.user.type != 'Bot' &&
       (startsWith(github.event.comment.body, '/amosclaud') ||
        startsWith(github.event.comment.body, '@amosclaud')) &&
       !(github.event.issue.pull_request == null &&
         (startsWith(github.event.comment.body, '/amosclaud build') ||
          startsWith(github.event.comment.body, '@amosclaud build') ||
          startsWith(github.event.comment.body, '/amosclaud fix') ||
          startsWith(github.event.comment.body, '@amosclaud fix'))))
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out trusted Amosclaud chat controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Run Amosclaud GitHub-native Agent chat
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          OLLAMA_URL: ${{ secrets.OLLAMA_URL }}
          OLLAMA_MODEL: ${{ vars.OLLAMA_MODEL }}
          AMOSCLAUD_API_KEY: ${{ secrets.AMOSCLAUD_API_KEY }}
          AMOSCLAUD_API_URL: ${{ vars.AMOSCLAUD_API_URL }}
          AMOSCLAUD_AGENT_MODEL: ${{ vars.AMOSCLAUD_AGENT_MODEL }}
        run: python .github/scripts/amosclaud_github_chat.py
