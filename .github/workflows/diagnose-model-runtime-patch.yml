name: Correct model runtime patch indentation

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

jobs:
  correct-generator:
    if: github.head_ref == 'agent/fix-model-runtime-dashboard'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 1
          show-progress: false

      - name: Keep the generated TCP block inside preflight
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path(".github/scripts/apply_model_runtime_dashboard_fix.py")
          text = path.read_text(encoding="utf-8")
          old_import = "from textwrap import dedent\n"
          new_import = "from textwrap import dedent, indent\n"
          old_open = "    tcp_block = dedent(\n"
          new_open = "    tcp_block = indent(\n        dedent(\n"
          old_close = "        '''\n    )\n    text = text[:tcp_start] + tcp_block + text[tcp_end:]\n"
          new_close = "            '''\n        ),\n        \"    \",\n    )\n    text = text[:tcp_start] + tcp_block + text[tcp_end:]\n"

          for label, old in (
              ("textwrap import", old_import),
              ("TCP block opener", old_open),
              ("TCP block closer", old_close),
          ):
              if text.count(old) != 1:
                  raise SystemExit(f"Expected one {label}, found {text.count(old)}")

          text = text.replace(old_import, new_import, 1)
          text = text.replace(old_open, new_open, 1)
          text = text.replace(old_close, new_close, 1)
          path.write_text(text, encoding="utf-8")
          PY
          rm .github/workflows/diagnose-model-runtime-patch.yml
          git config user.name "Amosclaud Repair Bot"
          git config user.email "actions@users.noreply.github.com"
          git add .github/scripts/apply_model_runtime_dashboard_fix.py \
                  .github/workflows/diagnose-model-runtime-patch.yml
          git commit -m "Fix generated TCP preflight indentation [skip ci]"
          git push origin HEAD:${{ github.head_ref }}
