name: Correct model runtime patch indentation

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

jobs:
  correct-generator:
    if: github.head_ref == 'agent/fix-model-runtime-dashboard'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 1
          show-progress: false

      - name: Keep the generated TCP block inside preflight
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path(".github/scripts/apply_model_runtime_dashboard_fix.py")
          text = path.read_text(encoding="utf-8")
          old_import = "from textwrap import dedent\n"
          if text.count(old_import) != 1:
              raise SystemExit(f"Expected one textwrap import, found {text.count(old_import)}")
          text = text.replace(old_import, "from textwrap import dedent, indent\n", 1)

          old_block = '''    tcp_block = dedent(
        \'\'\'\\
            try:
                _tcp_connect(host, port, connect_budget_seconds())
            except Exception as error:
                diagnosis = classify(error, candidate)
                if diagnosis.code == TIMEOUT:
                    diagnosis = _preflight_timeout_diagnosis(error, candidate)
                return CandidateHealth(
                    candidate=candidate,
                    reachable=False,
                    diagnosis=diagnosis,
                    checked_at=now,
                )
        \'\'\'
    )
'''
          new_block = '''    tcp_block = indent(
        dedent(
            \'\'\'\\
            try:
                _tcp_connect(host, port, connect_budget_seconds())
            except Exception as error:
                diagnosis = classify(error, candidate)
                if diagnosis.code == TIMEOUT:
                    diagnosis = _preflight_timeout_diagnosis(error, candidate)
                return CandidateHealth(
                    candidate=candidate,
                    reachable=False,
                    diagnosis=diagnosis,
                    checked_at=now,
                )
            \'\'\'
        ),
        "    ",
    )
'''
          if text.count(old_block) != 1:
              raise SystemExit(f"Expected one TCP generator block, found {text.count(old_block)}")
          path.write_text(text.replace(old_block, new_block, 1), encoding="utf-8")
          PY
          rm .github/workflows/diagnose-model-runtime-patch.yml
          git config user.name "Amosclaud Repair Bot"
          git config user.email "actions@users.noreply.github.com"
          git add .github/scripts/apply_model_runtime_dashboard_fix.py \
                  .github/workflows/diagnose-model-runtime-patch.yml
          git commit -m "Fix generated TCP preflight indentation [skip ci]"
          git push origin HEAD:${{ github.head_ref }}
