name: Amosclaud Book Gate

on:
  pull_request:

permissions:
  contents: read

jobs:
  book-gate:
    name: Book change contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine changed files
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch origin "$BASE_REF" --depth=1
          git diff --name-only "origin/$BASE_REF...HEAD" > /tmp/amosclaud-changed-files.txt
          cat /tmp/amosclaud-changed-files.txt

      - name: Slapface preflight and high-confidence secret gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          from amoscloud_ai.book_watchdog import secret_verdict

          changed = [
              line.strip()
              for line in Path('/tmp/amosclaud-changed-files.txt').read_text().splitlines()
              if line.strip()
          ]
          text_suffixes = {
              '.py', '.js', '.jsx', '.ts', '.tsx', '.json', '.toml', '.yml', '.yaml',
              '.md', '.txt', '.env', '.ini', '.cfg', '.sh', '.html', '.css', '.xml',
          }
          blocking = []
          warnings = []
          for raw in changed:
              path = Path(raw)
              if not path.is_file() or path.stat().st_size > 2_000_000:
                  continue
              if path.suffix.lower() not in text_suffixes and path.name not in {'Dockerfile', 'Makefile'}:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except (OSError, UnicodeDecodeError):
                  continue
              verdict = secret_verdict(text)
              for finding in verdict['findings']:
                  safe = {
                      'path': raw,
                      'line': finding['line'],
                      'kind': finding['kind'],
                      'classification': finding['classification'],
                      'confidence': finding['confidence'],
                      'fingerprint': finding['fingerprint'],
                      'reasons': finding['reasons'],
                  }
                  if finding['classification'] in {'confirmed_secret', 'probable_secret'}:
                      blocking.append(safe)
                  else:
                      warnings.append(safe)

          for finding in warnings:
              print(
                  '::warning file={path},line={line}::Slapface suspicious text '
                  '({kind}, confidence {confidence}). Review it; Book is not calling it a leak.'.format(**finding)
              )
          if blocking:
              for finding in blocking:
                  print(
                      '::error file={path},line={line}::Slapface blocked high-confidence '
                      'credential-like material ({kind}, {classification}, confidence {confidence}). '
                      'The credential value is intentionally not printed.'.format(**finding)
                  )
              raise SystemExit(1)
          print('Slapface secret preflight passed without high-confidence credential exposure.')
          PY

      - name: Enforce Amosclaud Word Book update
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          changed = [line.strip() for line in Path('/tmp/amosclaud-changed-files.txt').read_text().splitlines() if line.strip()]
          ignored_prefixes = (
              '.Amosclaud/book/.runtime/',
              '.github/dependabot',
          )
          ignored_exact = {
              '.github/workflows/amosclaud-book-gate.yml',
          }
          meaningful = [
              path for path in changed
              if path not in ignored_exact and not path.startswith(ignored_prefixes)
          ]
          if not meaningful:
              print('Book Gate: no meaningful Amosclaud change detected.')
              raise SystemExit(0)

          book_changes = [path for path in meaningful if path.startswith('.Amosclaud/book/')]
          if not book_changes:
              print('::error::Meaningful Amosclaud changes must update .Amosclaud/book before completion or merge.')
              print('Changed files:')
              for path in meaningful:
                  print(f'  - {path}')
              raise SystemExit(1)

          ledger = Path('.Amosclaud/book/changes.jsonl')
          if not ledger.exists() or not ledger.read_text(encoding='utf-8').strip():
              print('::error::Book change ledger is missing or empty.')
              raise SystemExit(1)

          print('Book Gate passed. Book files changed:')
          for path in book_changes:
              print(f'  - {path}')
          PY

      - name: Run Amosclaud Word Book tests
        run: python -m pytest tests/test_amosclaud_book.py tests/test_book_watchdog.py tests/test_book_studio.py -q
