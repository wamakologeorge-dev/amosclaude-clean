name: Fortify AST Scan

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "25 0 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  differential-ast-threat-gate:
    name: Every new AST finding is a threat
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out exact head revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: head
          persist-credentials: false

      - name: Check out exact base revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.before }}
          path: base
          persist-credentials: false

      - name: Check out trusted default-branch comparator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: trusted
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"

      - name: Install pinned local AST scanner
        run: python -m pip install --disable-pip-version-check "bandit==1.9.4"

      - name: Scan every production Python path in exact base and head revisions
        run: |
          set +e
          (
            cd base
            python -m bandit -r . \
              -x ./tests \
              -f json \
              -o ../base-bandit-report.json
          )
          base_status=$?
          (
            cd head
            python -m bandit -r . \
              -x ./tests \
              -f json \
              -o ../head-bandit-report.json
          )
          head_status=$?
          set -e

          test -s base-bandit-report.json
          test -s head-bandit-report.json
          if [ "$base_status" -gt 1 ] || [ "$head_status" -gt 1 ]; then
            echo "::error title=AST scan unavailable::Bandit could not produce trustworthy exact-revision evidence."
            exit 2
          fi

      - name: Stage trusted comparator without following candidate symlinks
        run: |
          set -euo pipefail
          test ! -L head/scripts
          test ! -L head/scripts/ci
          test ! -L head/scripts/ci/bandit_pr_gate.py
          rm -f head/scripts/ci/bandit_pr_gate.py
          install -m 0644 trusted/scripts/ci/bandit_pr_gate.py head/scripts/ci/bandit_pr_gate.py

      - name: Treat every AST finding introduced by the head as a blocking threat
        run: |
          python head/scripts/ci/bandit_pr_gate.py \
            --base base-bandit-report.json \
            --head head-bandit-report.json \
            --json differential-ast-gate.json \
            --markdown differential-ast-gate.md

      - name: Publish differential threat summary
        if: always()
        run: |
          if [ -s differential-ast-gate.md ]; then
            cat differential-ast-gate.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Amosclaud Differential AST Threat Gate" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "🟥 No trustworthy comparison report was produced." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload exact base, head, and comparison evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: fortify-compatible-differential-ast-report
          path: |
            base-bandit-report.json
            head-bandit-report.json
            differential-ast-gate.json
            differential-ast-gate.md
          if-no-files-found: error

  repository-ast-audit:
    name: Full repository AST security debt audit
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FOD_TENANT: ${{ secrets.FOD_TENANT }}
      FOD_USER: ${{ secrets.FOD_USER }}
      FOD_PASSWORD: ${{ secrets.FOD_PAT }}
      SSC_URL: ${{ vars.SSC_URL }}
      SSC_TOKEN: ${{ secrets.SSC_TOKEN }}
      SC_SAST_TOKEN: ${{ secrets.SC_CLIENT_AUTH_TOKEN }}

    steps:
      - name: Check out trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"

      - name: Detect configured Fortify provider
        id: config
        shell: bash
        run: |
          if [ -n "$FOD_TENANT" ] && [ -n "$FOD_USER" ] && [ -n "$FOD_PASSWORD" ]; then
            echo "provider=fod" >> "$GITHUB_OUTPUT"
          elif [ -n "$SSC_URL" ] && [ -n "$SSC_TOKEN" ] && [ -n "$SC_SAST_TOKEN" ]; then
            echo "provider=ssc" >> "$GITHUB_OUTPUT"
          else
            echo "provider=none" >> "$GITHUB_OUTPUT"
          fi

      - name: Explain policy-compatible scan mode
        env:
          PROVIDER: ${{ steps.config.outputs.provider }}
        run: |
          if [ "$PROVIDER" = "none" ]; then
            echo "No complete Fortify provider configuration is available. Running the local AST audit."
          else
            echo "::warning title=Fortify adapter restricted::The Fortify action has an unpinned nested dependency, so Amosclaud runs its pinned local AST audit without exposing provider credentials."
          fi

      - name: Install pinned local AST scanner
        run: python -m pip install --disable-pip-version-check "bandit==1.9.4"

      - name: Treat every repository AST security finding as audit debt
        run: |
          set +e
          python -m bandit -r . \
            -f json \
            -o fortify-compatible-bandit-report.json
          scan_status=$?
          set -e
          test -s fortify-compatible-bandit-report.json
          if [ "$scan_status" -ne 0 ]; then
            echo "::error title=Amosclaud repository security debt detected::The full AST audit reported one or more findings or scan errors."
            exit "$scan_status"
          fi

      - name: Upload full repository AST evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: fortify-compatible-ast-report
          path: fortify-compatible-bandit-report.json
          if-no-files-found: error
