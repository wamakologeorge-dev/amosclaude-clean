name: Production Compose

on:
  pull_request:
    branches: [main]
    paths:
      - docker-compose.yml
      - Caddyfile
      - docker/production-entrypoint.sh
      - .env.production.example
      - secrets/README.md
      - docs/PRODUCTION_DOCKER.md
      - tests/test_production_docker_config.py
      - .github/workflows/production-compose.yml
  push:
    branches: [main]
    paths:
      - docker-compose.yml
      - Caddyfile
      - docker/production-entrypoint.sh
      - .env.production.example
      - secrets/README.md
      - docs/PRODUCTION_DOCKER.md
      - tests/test_production_docker_config.py
      - .github/workflows/production-compose.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Create non-secret validation fixtures
        shell: bash
        run: |
          cp .env.production.example .env.production
          mkdir -p secrets
          for name in \
            postgres_password \
            redis_password \
            secret_key \
            amosclaud_master_key \
            metrics_token \
            dashboard_key \
            byte_bus_secret \
            preview_service_key \
            amosclaud_api_key \
            github_client_secret \
            github_token_encryption_key \
            model_token \
            stripe_secret_key \
            stripe_webhook_secret; do
              openssl rand -hex 32 > "secrets/$name"
          done
          chmod 600 .env.production secrets/*

      - name: Validate Docker Compose rendering
        run: docker compose --env-file .env.production config >/dev/null

      - name: Validate production entrypoint syntax
        run: sh -n docker/production-entrypoint.sh

      - name: Validate Caddy automatic TLS configuration
        run: |
          docker run --rm \
            -e PRIMARY_DOMAIN=www.amosclaud.com \
            -e APEX_DOMAIN=amosclaud.com \
            -e ACME_EMAIL=ops@example.com \
            -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile

      - name: Run production configuration regression tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest PyYAML
          pytest -q tests/test_production_docker_config.py
