name: Docker Image CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ vars.AMOSCLAUD_CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - name: control-plane
            file: Dockerfile
            tag: amosclaud/control-plane:ci
          - name: workspace-runtime
            file: services/workspace_runtime/Dockerfile
            tag: amosclaud/workspace-runtime:ci
          - name: workspace-base
            file: services/workspace_runtime/workspace-image/Dockerfile
            tag: amosclaud/workspace-base:ci

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c

      - name: Build image with reusable layers
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          file: ${{ matrix.file }}
          load: true
          tags: ${{ matrix.tag }}
          cache-from: type=gha,scope=amosclaud-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=amosclaud-${{ matrix.name }}
          provenance: false
          sbom: false
