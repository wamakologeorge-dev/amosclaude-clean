name: Amosclaud Repair Plan

on:
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: Open pull request to diagnose and explain
        required: true
        type: string

permissions:
  actions: read
  checks: read
  contents: read
  issues: write
  pull-requests: write

jobs:
  plan:
    uses: ./.github/workflows/agent-chat.yml
    with:
      mode: pr
      pull_request_number: ${{ inputs.pull_request_number }}
      dispatch_fixer: false
