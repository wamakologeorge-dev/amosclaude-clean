name: Amosclaud Scan

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: Branch, tag, or commit to scan
        required: false
        type: string
      pull_request_number:
        description: Optional open pull request receiving the evidence
        required: false
        type: string
      dispatch_fixer:
        description: Send a caught finding to the bounded fixer
        required: false
        default: true
        type: boolean

permissions:
  actions: write
  contents: read
  issues: write
  pull-requests: read

jobs:
  scan:
    name: Run the trusted read-only Scan Bug
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      SCAN_DIR: ${{ runner.temp }}/amosclaud-scan

    steps:
      - name: Resolve target
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_REF: ${{ inputs.target_ref }}
          PR_NUMBER: ${{ inputs.pull_request_number }}
        run: |
          set -euo pipefail
          target_ref="$INPUT_REF"
          if [ -z "$target_ref" ] && [ -n "$PR_NUMBER" ]; then
            target_ref=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.head.sha')
          fi
          if [ -z "$target_ref" ]; then
            target_ref="${{ github.event.repository.default_branch }}"
          fi
          echo "ref=$target_ref" >> "$GITHUB_OUTPUT"

      - name: Check out trusted scanner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: trusted
          persist-credentials: false

      - name: Check out exact scan target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.target.outputs.ref }}
          path: target
          fetch-depth: 0
          persist-credentials: false

      - name: Set up scanner runtime
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Install YAML parser
        run: python -m pip install --disable-pip-version-check 'PyYAML>=6,<7'

      - name: Crawl every eligible tracked source line
        id: scan
        run: |
          set -euo pipefail
          mkdir -p "$SCAN_DIR"
          set +e
          python trusted/amoscloud_ai/scan_bug.py target \
            --json "$SCAN_DIR/report.json" \
            --markdown "$SCAN_DIR/report.md" \
            --snapshot "$SCAN_DIR/snapshot.svg"
          status=$?
          set -e
          echo "caught=$([ "$status" -eq 10 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          cat "$SCAN_DIR/report.md" >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Dispatch the bounded fixer for a caught finding
        if: steps.scan.outputs.caught == 'true' && inputs.dispatch_fixer
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pull_request_number }}
        run: |
          set -euo pipefail
          summary=$(python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("${{ runner.temp }}/amosclaud-scan/report.json").read_text())
          finding = report.get("finding") or {}
          print(
              "Scan Bug catch: "
              f"{finding.get('code', 'unknown')} at "
              f"{finding.get('path', 'unknown')}:{finding.get('line', 1)}. "
              f"{finding.get('message', 'Coverage failure')}"
          )
          PY
          )
          scope=default
          if [ -n "$PR_NUMBER" ]; then
            scope=pull_request
          fi
          gh workflow run amosclaud-repair-control-plane.yml \
            --ref "${{ github.event.repository.default_branch }}" \
            -f scope="$scope" \
            -f pull_request_number="$PR_NUMBER" \
            -f target_sha="${{ steps.target.outputs.ref }}" \
            -f source_run_id="${{ github.run_id }}" \
            -f source_name='Amosclaud Scan' \
            -f provider=github_actions \
            -f status_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            -f failure_summary="$summary"

      - name: Upload scan screenshot and coverage ledger
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: amosclaud-scan-${{ github.run_id }}
          path: ${{ runner.temp }}/amosclaud-scan
          if-no-files-found: warn
          retention-days: 14
