name: Run model runtime dashboard correction on PR

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

jobs:
  apply-correction:
    if: github.head_ref == 'agent/fix-model-runtime-dashboard'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 1
          show-progress: false

      - name: Apply deterministic source corrections
        run: python .github/scripts/apply_model_runtime_dashboard_fix.py

      - name: Preserve generated preflight indentation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("amoscloud_ai/model_runtime.py")
          text = path.read_text(encoding="utf-8")
          start_marker = "\ntry:\n    _tcp_connect(host, port, connect_budget_seconds())\n"
          end_marker = (
              "\n    return CandidateHealth("
              "candidate=candidate, reachable=True, checked_at=now)\n"
          )
          if text.count(start_marker) != 1:
              raise RuntimeError(
                  f"Expected one unindented TCP block, found {text.count(start_marker)}"
              )
          start = text.index(start_marker) + 1
          end = text.index(end_marker, start)
          block = text[start:end]
          indented = "\n".join(f"    {line}" if line else line for line in block.split("\n"))
          path.write_text(text[:start] + indented + text[end:], encoding="utf-8")
          PY

      - name: Validate corrected Python files
        shell: bash
        run: |
          python -m compileall -q \
            amoscloud_ai/model_runtime.py \
            amoscloud_ai/api/routes/platform_services.py \
            tests/test_model_runtime_dashboard_corrections.py
          git diff --check

      - name: Commit source corrections and remove temporary repair files
        shell: bash
        run: |
          rm -f \
            .github/workflows/apply-model-runtime-dashboard-fix.yml \
            .github/workflows/run-model-runtime-dashboard-fix-on-pr.yml \
            .github/workflows/diagnose-model-runtime-patch.yml \
            .github/workflows/fix-model-runtime-runner.yml \
            .github/scripts/apply_model_runtime_dashboard_fix.py \
            repair-workflow-error.txt \
            repair-marker-diagnostics.txt
          git config user.name "Amosclaud Repair Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Fix model runtime dashboard health reporting [skip ci]"
          git push origin HEAD:${{ github.head_ref }}
