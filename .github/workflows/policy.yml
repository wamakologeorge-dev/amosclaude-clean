name: Amosclaud Workflow Policy

on:
  pull_request:

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out pull-request candidate as untrusted data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          persist-credentials: false

      - name: Check out trusted default-branch policy engine
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: trusted
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Install trusted policy parser dependency
        run: python -m pip install --disable-pip-version-check 'PyYAML>=6,<7'

      - name: Validate candidate controller and workflow syntax
        run: |
          set -euo pipefail
          python -m py_compile \
            candidate/.github/scripts/agent_chat.py \
            candidate/.github/scripts/parse_comment.py \
            candidate/.github/scripts/ai_patch_executor.py
          python - <<'PY'
          from pathlib import Path
          import yaml

          paths = sorted(Path('candidate/.github/workflows').glob('*.yml'))
          selected = {
              'agent-chat.yml', 'results.yml', 'plan.yml', 'policy.yml',
              'fixer.yml', 'scan.yml', 'main.yml', 'action.yml',
              'Autonomous.yml', 'amosclaude-clean.yml',
              'pull-request-chat-group.yml', 'amosclaud-bot-contributor.yml',
              'amosclaud-bot-review.yml', 'amosclaud-codeql-threat-gate.yml',
              'amosclaud-security-repair-bridge.yml',
              'amosclaud-dependency-threat-gate.yml',
              'amosclaud-claude-patch.yml',
              'amosclaud-claude-patch-worker.yml', 'codeql.yml', 'fortify.yml',
          }
          for path in paths:
              if path.name not in selected:
                  continue
              payload = yaml.safe_load(path.read_text(encoding='utf-8'))
              if not isinstance(payload, dict) or 'jobs' not in payload:
                  raise SystemExit(f'invalid workflow contract: {path}')
              print(f'validated {path}')
          PY

      - name: Enforce contributor tool sovereignty from trusted code
        run: |
          set -euo pipefail
          PYTHONPATH=trusted python - <<'PY'
          from pathlib import Path
          from scripts.ci.contributor_tool_policy_guard import validate_repository

          errors = validate_repository(Path('candidate'))
          if errors:
              raise SystemExit('\n'.join(errors))
          print('trusted contributor policy guard passed')
          PY

      - name: Enforce native Ollama patch contract from trusted code
        run: |
          set -euo pipefail
          PYTHONPATH=trusted python - <<'PY'
          from pathlib import Path
          from scripts.ci.claude_patch_policy_guard import validate_repository

          errors = validate_repository(Path('candidate'))
          if errors:
              raise SystemExit('\n'.join(errors))
          print('trusted Ollama patch policy guard passed')
          PY

      - name: Enforce one fixer and least-privilege token use
        run: |
          set -euo pipefail
          test -f candidate/.github/workflows/fixer.yml
          ! grep -R --line-number 'pull_request_target' \
            candidate/.github/workflows/{agent-chat,results,plan,policy,fixer,scan,main,action,amosclaude-clean,pull-request-chat-group,amosclaud-bot-review,amosclaud-codeql-threat-gate,amosclaud-security-repair-bridge,amosclaud-dependency-threat-gate,amosclaud-claude-patch,amosclaud-claude-patch-worker,codeql,fortify}.yml
          ! grep -R --line-number 'secrets\..*TOKEN' \
            candidate/.github/workflows/{agent-chat,results,plan,policy,fixer,scan,main,action,amosclaude-clean,pull-request-chat-group,amosclaud-bot-review,amosclaud-codeql-threat-gate,amosclaud-security-repair-bridge,amosclaud-dependency-threat-gate,amosclaud-claude-patch,amosclaud-claude-patch-worker,codeql}.yml
