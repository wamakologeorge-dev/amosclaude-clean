name: Amosclaud Native Action

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: amosclaud-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  amosclaud:
    name: Amosclaud verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run Amosclaud Native Action
        uses: ./.github/actions/amosclaud
        with:
          objective: Validate the repository using Amosclaud native guardrails and tests.
          run-tests: 'true'
