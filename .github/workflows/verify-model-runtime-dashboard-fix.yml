name: Verify model runtime dashboard corrections

on:
  push:
    branches:
      - agent/fix-model-runtime-dashboard
    paths:
      - amoscloud_ai/api/routes/platform_services.py
      - amoscloud_ai/model_runtime.py
      - tests/test_model_runtime_dashboard_corrections.py
      - .github/workflows/verify-model-runtime-dashboard-fix.yml

permissions:
  contents: write

jobs:
  focused-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-model-runtime-dashboard
          fetch-depth: 1
          show-progress: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install repository dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run focused regression tests
        run: pytest -q tests/test_model_runtime_dashboard_corrections.py

      - name: Remove temporary verifier
        shell: bash
        run: |
          rm .github/workflows/verify-model-runtime-dashboard-fix.yml
          git config user.name "Amosclaud Repair Bot"
          git config user.email "actions@users.noreply.github.com"
          git add .github/workflows/verify-model-runtime-dashboard-fix.yml
          git commit -m "Remove focused model runtime verifier [skip ci]"
          git push origin HEAD:agent/fix-model-runtime-dashboard
