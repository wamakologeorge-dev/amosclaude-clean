name: Amosclaud Agent SDK Wheel

on:
  pull_request:
    paths:
      - "amosclaud_agent_sdk/**"
      - "scripts/build_wheel.py"
      - "pyproject.toml"
      - ".github/workflows/agent-sdk-wheel.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - name: Build wheel without any external installer
        run: python scripts/build_wheel.py --skip-sdist --clean
      - name: Verify bundled command
        run: |
          python -m pip install --force-reinstall dist/*.whl
          amosclaud-agent --help
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: amosclaud-agent-sdk-wheel-${{ github.run_id }}
          path: dist/*.whl
          if-no-files-found: error
