name: Amosclaud Autonomous Background Engineer

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'
  workflow_run:
    workflows:
      - Amosclaud CI
      - CI/CD — Test & Deploy
      - Build and Verify
      - Python package
      - Amosclaud Workspace CI
      - Amosclaud CI/CD Pipeline
      - Docker Image CI
      - 🏗️ Platform Build Check
    types: [completed]
  pull_request:
    types: [closed]

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read
  checks: read

concurrency:
  group: amosclaud-autonomous-background-engineer-${{ github.event.workflow_run.head_sha || github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  close-merged-repair-incident:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'amosclaud-background-engineer/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Close incident for merged repair revision
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          set -euo pipefail
          revision="${HEAD_REF#amosclaud-background-engineer/}"
          short_sha="${revision%%-*}"
          title="Amosclaud autonomous repair ${short_sha}"
          issue_number="$(gh issue list \
            --state open \
            --search "\"${title}\" in:title" \
            --json number,title \
            --jq ".[] | select(.title == \"${title}\") | .number" \
            | head -n 1)"
          if [ -n "$issue_number" ]; then
            gh issue comment "$issue_number" \
              --body "The verified autonomous repair was merged: ${PR_URL}"
            gh issue close "$issue_number" --reason completed
          fi

  autonomous-background-repair:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'failure' &&
       github.event.workflow_run.head_branch == github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Verify repository operating instructions
        run: |
          set -euo pipefail
          test -f AGENTS.md
          test -f docs/PYTHON_AUTONOMOUS_ENGINEERING_BOOK.md
          grep -q "Inspect relevant files before editing" AGENTS.md
          grep -q "Run required checks and report the exact result" AGENTS.md

      - name: Install autonomous bootstrap dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-asyncio flake8

      - name: Install repository dependencies or capture the blocker
        id: dependencies
        shell: bash
        run: |
          set +e
          python -m pip install -e . 2>&1 | tee amosclaud-install.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -eq 0 ]; then
            echo "project_install_ok=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "project_install_ok=false" >> "$GITHUB_OUTPUT"
          {
            echo "=== REPOSITORY INSTALL FAILURE ==="
            echo "Command: python -m pip install -e ."
            echo "Exit code: $status"
            echo ""
            cat amosclaud-install.log
          } > amosclaud-failure.log
          echo "::warning title=Repository installation failed::The failure was captured for the autonomous repair issue and Amosclaud Fixer."

      - name: Inspect repository health before opening an issue
        id: inspect
        shell: bash
        env:
          PROJECT_INSTALL_OK: ${{ steps.dependencies.outputs.project_install_ok }}
        run: |
          set -euo pipefail
          if [ "$PROJECT_INSTALL_OK" != "true" ]; then
            echo "repair_needed=true" >> "$GITHUB_OUTPUT"
            echo "reason=dependency installation failed" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          set +e
          {
            echo "=== PYTHON COMPILATION ==="
            python -m compileall -q amoscloud_ai src tests
            compile_status=$?
            echo "compile_exit_code=$compile_status"
            echo ""
            echo "=== PYTEST ==="
            python -m pytest -q --disable-warnings --maxfail=25
            pytest_status=$?
            echo "pytest_exit_code=$pytest_status"
            if [ "$compile_status" -ne 0 ] || [ "$pytest_status" -ne 0 ]; then
              exit 1
            fi
          } 2>&1 | tee amosclaud-health.log
          pipeline_status=${PIPESTATUS[0]}
          set -e

          if [ "$pipeline_status" -eq 0 ]; then
            echo "repair_needed=false" >> "$GITHUB_OUTPUT"
            echo "reason=repository checks passed" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          {
            echo "=== DAILY AUTONOMOUS INSPECTION FAILURE ==="
            echo "The repository failed compilation or pytest verification."
            echo ""
            cat amosclaud-health.log
          } > amosclaud-failure.log
          echo "repair_needed=true" >> "$GITHUB_OUTPUT"
          echo "reason=compilation or pytest failed" >> "$GITHUB_OUTPUT"

      - name: Report healthy daily inspection
        if: steps.inspect.outputs.repair_needed != 'true'
        run: |
          echo "Daily Amosclaud inspection passed. No issue, repair branch, or pull request was created." >> "$GITHUB_STEP_SUMMARY"

      - name: Create or update repair issue before Amosclaud Fixer runs
        id: incident
        if: steps.inspect.outputs.repair_needed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          FAILURE_REASON: ${{ steps.inspect.outputs.reason }}
        run: |
          set -euo pipefail
          short_sha="${TARGET_SHA:0:8}"
          title="Amosclaud autonomous repair ${short_sha}"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          body="Amosclaud Bot detected a verified repository failure for commit \`${TARGET_SHA}\`: ${FAILURE_REASON}. Amosclaud Fixer will inspect the recorded evidence, create a bounded repair branch, run fresh verification, and open or update an automatic pull request without requesting human approval. Workflow: ${run_url}"
          issue_number="$(gh issue list \
            --state open \
            --search "\"${title}\" in:title" \
            --json number,title \
            --jq ".[] | select(.title == \"${title}\") | .number" \
            | head -n 1)"
          if [ -n "$issue_number" ]; then
            gh issue comment "$issue_number" --body "$body"
          else
            issue_url="$(gh issue create --title "$title" --body "$body")"
            issue_number="${issue_url##*/}"
          fi
          echo "issue_number=$issue_number" >> "$GITHUB_OUTPUT"
          echo "Repair issue: #${issue_number}" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify autonomous configuration
        id: preflight
        if: steps.inspect.outputs.repair_needed == 'true'
        env:
          AMOSCLAUD_API_KEY: ${{ secrets.AMOSCLAUD_API_KEY }}
          AMOSCLAUD_AUTONOMOUS_TOKEN: ${{ secrets.AMOSCLAUD_AUTONOMOUS_TOKEN }}
        run: |
          set -euo pipefail
          test -f .github/scripts/amosclaud_fixer.py
          test -f .github/scripts/redact_amosclaud_evidence.py
          test -f .github/amosclaud-fixer/amosclaud-autonomous-agent/ci/bot-fixer-operations-autonomous-background-engineer/bot.py

          if [ -n "$AMOSCLAUD_API_KEY" ]; then
            echo "model_configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "model_configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Autonomous repair unavailable::AMOSCLAUD_API_KEY is not configured."
          fi

          if [ -n "$AMOSCLAUD_AUTONOMOUS_TOKEN" ]; then
            echo "publisher_configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "publisher_configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Autonomous publishing unavailable::AMOSCLAUD_AUTONOMOUS_TOKEN is required so repair pull requests trigger their required checks."
          fi

      - name: Fail closed when repair engine is unavailable
        if: >-
          steps.inspect.outputs.repair_needed == 'true' &&
          steps.preflight.outputs.model_configured != 'true'
        run: |
          echo "The autonomous repair model is not configured; the repair issue remains open for the next scheduled attempt."
          exit 1

      - name: Run Amosclaud autonomous background engineer
        if: >-
          steps.inspect.outputs.repair_needed == 'true' &&
          steps.preflight.outputs.model_configured == 'true'
        id: engineer
        env:
          AMOSCLAUD_API_KEY: ${{ secrets.AMOSCLAUD_API_KEY }}
          AMOSCLAUD_API_URL: ${{ vars.AMOSCLAUD_API_URL || 'http://www.amosclaud.com/' }}
          AMOSCLAUD_FIXER_MODEL: ${{ vars.AMOSCLAUD_FIXER_MODEL || 'amosclaud-agent' }}
          AMOSCLAUD_FIXER_ATTEMPTS: '3'
        run: |
          set +e
          python .github/amosclaud-fixer/amosclaud-autonomous-agent/ci/bot-fixer-operations-autonomous-background-engineer/bot.py \
            | tee amosclaud-background-engineer-output.txt
          status=${PIPESTATUS[0]}
          set -e
          grep '^AMOSCLAUD_BACKGROUND_ENGINEER_STATUS=' \
            amosclaud-background-engineer-output.txt >> "$GITHUB_OUTPUT" || true
          exit "$status"

      - name: Require publisher token for verified repair
        if: >-
          steps.engineer.outputs.AMOSCLAUD_BACKGROUND_ENGINEER_STATUS == 'verified-repair' &&
          steps.preflight.outputs.publisher_configured != 'true'
        run: |
          echo "A verified repair exists, but AMOSCLAUD_AUTONOMOUS_TOKEN is missing."
          echo "The repair was not published because GITHUB_TOKEN-created pull requests do not trigger required workflows."
          exit 1

      - name: Redact engineering evidence
        if: always()
        run: |
          python .github/scripts/redact_amosclaud_evidence.py \
            amosclaud-install.log \
            amosclaud-health.log \
            amosclaud-failure.log \
            amosclaud-fixer-report.json \
            amosclaud-background-engineer-report.json \
            amosclaud-background-engineer-output.txt

      - name: Upload engineering evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: amosclaud-background-engineer-${{ github.run_id }}
          path: |
            amosclaud-install.log
            amosclaud-health.log
            amosclaud-failure.log
            amosclaud-fixer-report.json
            amosclaud-background-engineer-report.json
            amosclaud-background-engineer-output.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish verified repair and enable autonomous merge
        id: publish
        if: >-
          steps.engineer.outputs.AMOSCLAUD_BACKGROUND_ENGINEER_STATUS == 'verified-repair' &&
          steps.preflight.outputs.publisher_configured == 'true'
        env:
          GH_TOKEN: ${{ secrets.AMOSCLAUD_AUTONOMOUS_TOKEN }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          ISSUE_NUMBER: ${{ steps.incident.outputs.issue_number }}
        run: |
          set -euo pipefail
          short_sha="${TARGET_SHA:0:8}"
          branch="amosclaud-background-engineer/${short_sha}"

          mapfile -t changed_files < <(python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("amosclaud-fixer-report.json").read_text(encoding="utf-8"))
          for path in report.get("changed_files", []):
              if isinstance(path, str) and path:
                  print(path)
          PY
          )
          if [ "${#changed_files[@]}" -eq 0 ]; then
            echo "No verified source paths were reported."
            exit 1
          fi

          git config user.name "Amosclaud Autonomous Background Engineer"
          git config user.email "background-engineer@amosclaud.internal"
          git checkout -B "$branch"
          git add -A -- "${changed_files[@]}"
          git diff --cached --quiet && {
            echo "No verified source changes were staged."
            exit 1
          }

          mapfile -t staged_files < <(git diff --cached --name-only)
          for staged in "${staged_files[@]}"; do
            found=false
            for allowed in "${changed_files[@]}"; do
              if [ "$staged" = "$allowed" ]; then
                found=true
                break
              fi
            done
            if [ "$found" != true ]; then
              echo "Refusing to publish unvalidated path: $staged"
              exit 1
            fi
          done

          git commit -m "fix: autonomous background repair for ${short_sha}"
          gh auth setup-git
          git push --force-with-lease --set-upstream origin "$branch"
          {
            echo "<!-- amosclaud-autonomous-repair:v1 -->"
            echo "## Amosclaud Autonomous Background Engineer"
            echo ""
            echo "This repair was generated from issue #${ISSUE_NUMBER} and verified autonomously under AGENTS.md and the Python Autonomous Engineering Book."
            echo ""
            echo "- Repair issue: #${ISSUE_NUMBER}"
            echo "- Source commit: \`${TARGET_SHA}\`"
            echo "- Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "- Merge policy: auto-merge only after all required repository checks pass"
            echo "- Human approval: not required for this verified bounded repair"
            echo "- Direct default-branch writes: prohibited"
          } > /tmp/amosclaud-pr-body.md

          pr_url="$(gh pr list --state open --head "$branch" --json url --jq '.[0].url // empty')"
          if [ -z "$pr_url" ]; then
            pr_url="$(gh pr create \
              --base "${{ github.event.repository.default_branch }}" \
              --head "$branch" \
              --title "fix: Amosclaud autonomous repair for #${ISSUE_NUMBER}" \
              --body-file /tmp/amosclaud-pr-body.md)"
          else
            gh pr edit "$pr_url" \
              --title "fix: Amosclaud autonomous repair for #${ISSUE_NUMBER}" \
              --body-file /tmp/amosclaud-pr-body.md
          fi
          gh pr merge "$pr_url" --auto --squash --delete-branch
          echo "pr_url=$pr_url" >> "$GITHUB_OUTPUT"
          echo "Autonomous repair pull request: $pr_url" >> "$GITHUB_STEP_SUMMARY"

      - name: Record verified repair awaiting merge
        if: steps.publish.outputs.pr_url != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ steps.incident.outputs.issue_number }}
          PR_URL: ${{ steps.publish.outputs.pr_url }}
        run: |
          set -euo pipefail
          body="A verified repair was published or updated at ${PR_URL}. Auto-merge is enabled, and this issue remains open until GitHub confirms the pull request was merged."
          gh issue comment "$ISSUE_NUMBER" --body "$body"

      - name: Record autonomous retry without requesting human approval
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          ISSUE_NUMBER: ${{ steps.incident.outputs.issue_number }}
        run: |
          set -euo pipefail
          short_sha="${TARGET_SHA:0:8}"
          title="Amosclaud autonomous repair ${short_sha}"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          body="The autonomous attempt did not publish a verified repair. No human approval is requested. Redacted evidence is attached to ${run_url}, and the daily or failure-triggered workflow will retry this revision."
          issue_number="$ISSUE_NUMBER"
          if [ -z "$issue_number" ]; then
            issue_number="$(gh issue list \
              --state open \
              --search "\"${title}\" in:title" \
              --json number,title \
              --jq ".[] | select(.title == \"${title}\") | .number" \
              | head -n 1)"
          fi
          if [ -n "$issue_number" ]; then
            gh issue comment "$issue_number" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
