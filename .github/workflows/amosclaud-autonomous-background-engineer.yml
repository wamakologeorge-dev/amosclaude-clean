name: Amosclaud Autonomous Background Engineer

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
  workflow_run:
    workflows:
      - CI
      - Tests
      - Python verification
      - Build
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read
  checks: read

concurrency:
  group: amosclaud-autonomous-background-engineer-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

jobs:
  autonomous-background-repair:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.event.repository.default_branch }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip

      - name: Install autonomous bootstrap dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-asyncio flake8

      - name: Install repository dependencies or capture the blocker
        id: dependencies
        shell: bash
        run: |
          set +e
          python -m pip install -e . 2>&1 | tee amosclaud-install.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -eq 0 ]; then
            echo "project_install_ok=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "project_install_ok=false" >> "$GITHUB_OUTPUT"
          {
            echo "=== REPOSITORY INSTALL FAILURE ==="
            echo "Command: python -m pip install -e ."
            echo "Exit code: $status"
            echo ""
            cat amosclaud-install.log
          } > amosclaud-failure.log
          echo "::warning title=Repository installation failed::The failure was captured and will be passed to Amosclaud Autonomous for repair."

      - name: Verify Amosclaud bot configuration
        id: preflight
        env:
          AMOSCLAUD_API_KEY: ${{ secrets.AMOSCLAUD_API_KEY }}
        run: |
          test -f docs/PYTHON_AUTONOMOUS_ENGINEERING_BOOK.md
          test -f .github/scripts/amosclaud_fixer.py
          test -f .github/amosclaud-fixer/amosclaud-autonomous-agent/ci/bot-fixer-operations-autonomous-background-engineer/bot.py
          if [ -n "$AMOSCLAUD_API_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Autonomous background engineer skipped::Repository secret AMOSCLAUD_API_KEY is not configured, so the autonomous background engineer did not run. Add the secret to enable automated background repairs."
          fi

      - name: Run Amosclaud autonomous background engineer
        if: steps.preflight.outputs.configured == 'true'
        id: engineer
        env:
          AMOSCLAUD_API_KEY: ${{ secrets.AMOSCLAUD_API_KEY }}
          AMOSCLAUD_API_URL: ${{ vars.AMOSCLAUD_API_URL || 'http://www.amosclaud.com/' }}
          AMOSCLAUD_FIXER_MODEL: ${{ vars.AMOSCLAUD_FIXER_MODEL || 'amosclaud-agent' }}
          AMOSCLAUD_FIXER_ATTEMPTS: '3'
        run: |
          set +e
          python .github/amosclaud-fixer/amosclaud-autonomous-agent/ci/bot-fixer-operations-autonomous-background-engineer/bot.py | tee amosclaud-background-engineer-output.txt
          status=${PIPESTATUS[0]}
          set -e
          grep '^AMOSCLAUD_BACKGROUND_ENGINEER_STATUS=' amosclaud-background-engineer-output.txt >> "$GITHUB_OUTPUT" || true
          exit "$status"

      - name: Upload engineering evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: amosclaud-background-engineer-${{ github.run_id }}
          path: |
            amosclaud-install.log
            amosclaud-failure.log
            amosclaud-fixer-report.json
            amosclaud-background-engineer-report.json
            amosclaud-fix-attempt-*.patch
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish verified repair and enable autonomous merge
        if: steps.engineer.outputs.AMOSCLAUD_BACKGROUND_ENGINEER_STATUS == 'verified-repair'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          short_sha="${TARGET_SHA:0:8}"
          branch="amosclaud-background-engineer/${short_sha}-${GITHUB_RUN_ID}"
          git config user.name "Amosclaud Autonomous Background Engineer"
          git config user.email "background-engineer@amosclaud.internal"
          git checkout -b "$branch"
          git add -A -- \
            ':!.github/workflows' \
            ':!amosclaud-install.log' \
            ':!amosclaud-failure.log' \
            ':!amosclaud-fixer-report.json' \
            ':!amosclaud-background-engineer-report.json' \
            ':!amosclaud-fix-attempt-*.patch'
          git diff --cached --quiet && {
            echo "No verified source changes were produced"
            exit 1
          }
          git commit -m "fix: autonomous background repair for ${short_sha}"
          git push --set-upstream origin "$branch"
          {
            echo "## Amosclaud Autonomous Background Engineer"
            echo ""
            echo "This repair was generated and verified autonomously using the Python Autonomous Engineering Book."
            echo ""
            echo "- Source commit: \`${TARGET_SHA}\`"
            echo "- Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "- Merge policy: auto-merge after all required repository checks pass"
            echo "- Human approval: not required for this verified low-risk repair"
          } > /tmp/amosclaud-pr-body.md
          pr_url="$(gh pr create \
            --base "${{ github.event.repository.default_branch }}" \
            --head "$branch" \
            --title "fix: Amosclaud autonomous background repair" \
            --body-file /tmp/amosclaud-pr-body.md)"
          gh pr merge "$pr_url" --auto --squash --delete-branch
          echo "Autonomous repair pull request: $pr_url" >> "$GITHUB_STEP_SUMMARY"

      - name: Resolve autonomous retry incident
        if: steps.engineer.outputs.AMOSCLAUD_BACKGROUND_ENGINEER_STATUS == 'verified-repair'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="Amosclaud autonomous repair retry queued"
          issue_number="$(gh issue list --state open --search "\"${title}\" in:title" --json number,title --jq ".[] | select(.title == \"${title}\") | .number" | head -n 1)"
          if [ -n "$issue_number" ]; then
            gh issue comment "$issue_number" --body "A verified repair was produced in workflow run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}. Auto-merge has been enabled after required checks pass."
            gh issue close "$issue_number" --reason completed
          fi

      - name: Record autonomous retry without requesting human approval
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="Amosclaud autonomous repair retry queued"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          body="The background engineer did not produce a verified repair in this attempt. No human approval is requested. Evidence is attached to ${run_url}, and the scheduled autonomous workflow will retry."
          issue_number="$(gh issue list --state open --search "\"${title}\" in:title" --json number,title --jq ".[] | select(.title == \"${title}\") | .number" | head -n 1)"
          if [ -n "$issue_number" ]; then
            gh issue comment "$issue_number" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
