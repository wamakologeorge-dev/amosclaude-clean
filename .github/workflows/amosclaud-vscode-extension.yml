name: Amosclaud VS Code Extension

on:
  pull_request:
    branches: [main]
    paths:
      - "clients/vscode-amosclaud/**"
      - ".github/workflows/amosclaud-vscode-extension.yml"
  push:
    branches: [main]
    paths:
      - "clients/vscode-amosclaud/**"
      - ".github/workflows/amosclaud-vscode-extension.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: clients/vscode-amosclaud

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Verify and bundle extension
        run: |
          node --version
          npm --version
          npm run check
          npm test
          npm run build

      - name: Package VSIX
        run: |
          mkdir -p ../../artifacts
          npx --yes @vscode/vsce package \
            --no-dependencies \
            --out ../../artifacts/amosclaud-autonomous.vsix

      - name: Upload VSIX
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: amosclaud-autonomous-vsix
          path: artifacts/amosclaud-autonomous.vsix
          if-no-files-found: error
