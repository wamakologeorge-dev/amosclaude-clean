name: Temporary organization revocation hardening

on:
  push:
    branches:
      - feature/organization-membership-auth

permissions:
  contents: write

concurrency:
  group: temporary-organization-revocation-hardening
  cancel-in-progress: false

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out hardening branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/organization-membership-auth
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: '0.11.16'
          enable-cache: false

      - name: Apply revocation protections
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          identity_path = Path('amoscloud_ai/api/routes/organization_identity.py')
          identity = identity_path.read_text(encoding='utf-8')
          old_target = '''        target = db.execute(
              """SELECT user_id,role,status,username FROM organization_members
                 WHERE organization_id=? AND member_number=?""",
              (actor["organization_id"], member_number),
          ).fetchone()
          '''
          new_target = '''        target = db.execute(
              """SELECT m.user_id,m.role,m.status,m.username,u.provider
                 FROM organization_members m JOIN users u ON u.id=m.user_id
                 WHERE m.organization_id=? AND m.member_number=?""",
              (actor["organization_id"], member_number),
          ).fetchone()
          '''
          if old_target not in identity:
              raise SystemExit('Expected remove-member query was not found')
          identity = identity.replace(old_target, new_target, 1)

          old_session = '''        db.execute("DELETE FROM sessions WHERE user_id=?", (target["user_id"],))
          _audit(
          '''
          new_session = '''        db.execute("DELETE FROM sessions WHERE user_id=?", (target["user_id"],))
          if target["provider"] == "organization":
              db.execute(
                  "UPDATE users SET password_hash=NULL WHERE id=?",
                  (target["user_id"],),
              )
          _audit(
          '''
          if old_session not in identity:
              raise SystemExit('Expected revocation session block was not found')
          identity_path.write_text(identity.replace(old_session, new_session, 1), encoding='utf-8')

          workspaces_path = Path('amoscloud_ai/api/routes/workspaces.py')
          workspaces = workspaces_path.read_text(encoding='utf-8')
          old_columns = '''    for name, sql_type in additions.items():
              if name not in columns:
                  db.execute(f"ALTER TABLE workspaces ADD COLUMN {name} {sql_type}")
          db.commit()
          '''
          new_columns = '''    for name, sql_type in additions.items():
              if name not in columns:
                  db.execute(f"ALTER TABLE workspaces ADD COLUMN {name} {sql_type}")
          member_columns = {
              row[1]
              for row in db.execute("PRAGMA table_info(organization_members)").fetchall()
          }
          if member_columns and "status" not in member_columns:
              db.execute(
                  "ALTER TABLE organization_members "
                  "ADD COLUMN status TEXT NOT NULL DEFAULT 'active'"
              )
          db.commit()
          '''
          if old_columns not in workspaces:
              raise SystemExit('Expected workspace migration block was not found')
          workspaces = workspaces.replace(old_columns, new_columns, 1)
          workspaces = workspaces.replace(
              "CASE WHEN r.owner_id=? THEN 'owner' ELSE c.role END AS role",
              "CASE WHEN r.owner_id=? THEN 'owner' ELSE COALESCE(c.role,om.role) END AS role",
              1,
          )
          old_join = '''           LEFT JOIN organization_members om ON om.organization_id=ores.organization_id AND om.user_id=?
          '''
          new_join = '''           LEFT JOIN organization_members om ON om.organization_id=ores.organization_id
                AND om.user_id=? AND om.status='active'
          '''
          if old_join not in workspaces:
              raise SystemExit('Expected organization membership join was not found')
          workspaces_path.write_text(workspaces.replace(old_join, new_join, 1), encoding='utf-8')

          static_path = Path('tests/test_organization_identity.py')
          static = static_path.read_text(encoding='utf-8')
          marker = '''    assert "Only an owner can remove an owner" in identity
          '''
          replacement = '''    assert "Only an owner can remove an owner" in identity
              assert 'if target["provider"] == "organization"' in identity
              assert "UPDATE users SET password_hash=NULL" in identity
          '''
          if marker not in static:
              raise SystemExit('Expected static revocation assertion was not found')
          static = static.replace(marker, replacement, 1)
          static += '''\n\ndef test_revoked_members_are_excluded_from_workspace_authorization() -> None:\n    workspaces = _read("amoscloud_ai/api/routes/workspaces.py")\n\n    assert "om.status='active'" in workspaces\n    assert "COALESCE(c.role,om.role)" in workspaces\n'''
          static_path.write_text(static, encoding='utf-8')
          PY

          uv run --no-project --with-requirements requirements-ci-fast.txt \
            black \
              amoscloud_ai/api/routes/organization_identity.py \
              amoscloud_ai/api/routes/workspaces.py \
              tests/test_organization_identity.py
          git rm .github/workflows/temporary-harden-organization-revocation.yml
          git diff --check

      - name: Publish hardening commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Amosclaud CI Hardener'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'security: block revoked organization members'
          git push origin HEAD:feature/organization-membership-auth
