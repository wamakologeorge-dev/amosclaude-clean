version: 2.1

jobs:
  verify:
    docker:
      - image: cimg/python:3.12
    resource_class: medium
    environment:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - checkout

      - run:
          name: Install unified Amosclaud dependencies
          command: |
            set -euo pipefail
            python -m pip install --upgrade pip setuptools wheel
            python -m pip install -r requirements.txt
            python -m pip install -r services/workspace_runtime/requirements.txt
            python -m pip install -e .

      - run:
          name: Validate configuration files
          command: |
            set -euo pipefail
            python - <<'PY'
            import json
            from pathlib import Path

            import yaml

            yaml.safe_load(Path("config/gateway.yaml").read_text(encoding="utf-8"))
            json.loads(Path("config/organization-settings.json").read_text(encoding="utf-8"))
            json.loads(Path(".devcontainer/devcontainer.json").read_text(encoding="utf-8"))
            yaml.safe_load(Path(".devcontainer/docker-compose.yml").read_text(encoding="utf-8"))
            yaml.safe_load(Path("docker-compose.workspace-runtime.yml").read_text(encoding="utf-8"))
            print("Configuration documents parsed successfully")
            PY

      - run:
          name: Compile unified control and execution planes
          command: |
            set -euo pipefail
            python -m compileall -q \
              amoscloud_ai \
              amosclaud_bot \
              src \
              services/workspace_runtime \
              main.py

      - run:
          name: Run focused unified-platform contracts
          command: |
            set -euo pipefail
            pytest -q \
              tests/test_db_migrations.py \
              tests/test_github_repository_sync_schema.py \
              tests/test_github_organization_pushback.py \
              tests/test_unified_cloud_workspace.py

workflows:
  verify-amosclaud-platform:
    jobs:
      - verify
