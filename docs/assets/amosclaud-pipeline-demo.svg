<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920" role="img" aria-labelledby="title desc">
  <title id="title">Amosclaud pipeline execution demo</title>
  <desc id="desc">A stylized control-plane and terminal demonstration showing a pipeline, node proposal, Java pod resource lease, successful test evidence, and a PipeFail recovery path.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080d18"/>
      <stop offset="1" stop-color="#14172d"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#151d31"/>
      <stop offset="1" stop-color="#0d1424"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000" flood-opacity=".32"/>
    </filter>
    <style>
      .title { font: 800 45px system-ui, sans-serif; fill: #f4f7ff; letter-spacing: -1px; }
      .subtitle { font: 400 19px system-ui, sans-serif; fill: #9eabc3; }
      .heading { font: 750 21px system-ui, sans-serif; fill: #edf2ff; }
      .label { font: 700 13px system-ui, sans-serif; fill: #9fb0ca; letter-spacing: .5px; }
      .body { font: 400 15px system-ui, sans-serif; fill: #b5bfd3; }
      .mono { font: 500 15px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #c9d4e8; }
      .mono-green { font: 600 15px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #67e6b6; }
      .mono-purple { font: 600 15px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #b9abff; }
      .mono-red { font: 600 15px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #ff91a7; }
      .small { font: 500 13px system-ui, sans-serif; fill: #8795ae; }
    </style>
  </defs>

  <rect width="1600" height="920" rx="34" fill="url(#bg)"/>
  <circle cx="1510" cy="40" r="240" fill="#795cff" opacity=".08"/>
  <text x="72" y="76" class="title">A verified Amosclaud pipeline run</text>
  <text x="72" y="111" class="subtitle">Illustrative UI generated from the implemented pipeline, node, Java pod, telemetry, and PipeFail contracts.</text>

  <g filter="url(#shadow)">
    <rect x="72" y="150" width="945" height="704" rx="26" fill="url(#panel)" stroke="#2b3955"/>
    <rect x="72" y="150" width="945" height="58" rx="26" fill="#111827"/>
    <circle cx="110" cy="179" r="7" fill="#ff6b7a"/>
    <circle cx="136" cy="179" r="7" fill="#ffc861"/>
    <circle cx="162" cy="179" r="7" fill="#4bd5a0"/>
    <text x="197" y="185" class="label">AMOSCLAUD CONTROL PLANE · PIPELINE pipe_demo_01</text>

    <text x="106" y="254" class="label">OBJECTIVE</text>
    <text x="106" y="286" class="heading">Compile, test, and verify the Java service</text>
    <rect x="805" y="246" width="164" height="38" rx="19" fill="#2d2655"/>
    <text x="841" y="270" class="label" fill="#c6bbff">VERIFYING</text>

    <text x="106" y="340" class="label">PIPELINE STAGES</text>
    <g>
      <rect x="106" y="365" width="154" height="68" rx="15" fill="#12322a" stroke="#43d1a0"/>
      <text x="128" y="392" class="heading" font-size="17">1 · Context</text>
      <text x="128" y="417" class="small">completed</text>

      <rect x="274" y="365" width="154" height="68" rx="15" fill="#12322a" stroke="#43d1a0"/>
      <text x="296" y="392" class="heading" font-size="17">2 · Inspect</text>
      <text x="296" y="417" class="small">completed</text>

      <rect x="442" y="365" width="154" height="68" rx="15" fill="#12322a" stroke="#43d1a0"/>
      <text x="464" y="392" class="heading" font-size="17">3 · Build</text>
      <text x="464" y="417" class="small">completed</text>

      <rect x="610" y="365" width="154" height="68" rx="15" fill="#12322a" stroke="#43d1a0"/>
      <text x="632" y="392" class="heading" font-size="17">4 · Test</text>
      <text x="632" y="417" class="small">completed</text>

      <rect x="778" y="365" width="191" height="68" rx="15" fill="#2d2655" stroke="#9786ff"/>
      <text x="800" y="392" class="heading" font-size="17">5 · Verify</text>
      <text x="800" y="417" class="small">evidence review</text>
    </g>

    <text x="106" y="486" class="label">NODE PROPOSER</text>
    <rect x="106" y="510" width="863" height="126" rx="18" fill="#0c1424" stroke="#2a3954"/>
    <text x="134" y="542" class="mono-purple">#1 java-node-primary</text>
    <text x="420" y="542" class="mono-green">selected · score 87.4</text>
    <text x="134" y="575" class="mono">JDK 21 · Maven · heartbeat 2s · 8,000m CPU available</text>
    <text x="134" y="606" class="mono">lease: 2,000m CPU · 4,096 MB RAM · 8,192 MB disk</text>
    <rect x="817" y="536" width="120" height="38" rx="19" fill="#17372d"/>
    <text x="847" y="560" class="label" fill="#71e4b8">FIT</text>

    <text x="106" y="688" class="label">JAVA POD AND EVIDENCE</text>
    <rect x="106" y="712" width="414" height="105" rx="18" fill="#0c1424" stroke="#2a3954"/>
    <text x="134" y="746" class="mono-purple">amosclaud-java-pod:21</text>
    <text x="134" y="777" class="mono-green">mvn -B verify · exit 0</text>
    <text x="134" y="804" class="mono">resource lease released</text>

    <rect x="540" y="712" width="429" height="105" rx="18" fill="#0c1424" stroke="#2a3954"/>
    <text x="568" y="746" class="mono-green">✓ tests passed</text>
    <text x="568" y="777" class="mono-green">✓ service.jar stored</text>
    <text x="568" y="804" class="mono-green">✓ ordered events recorded</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1050" y="150" width="478" height="704" rx="26" fill="#090f1c" stroke="#2b3955"/>
    <rect x="1050" y="150" width="478" height="58" rx="26" fill="#111827"/>
    <text x="1084" y="185" class="label">PIPEFAIL TELEMETRY</text>

    <text x="1084" y="254" class="heading">Recovery remains part of the same pipeline</text>
    <text x="1084" y="284" class="body">Failures do not create a second platform or lose the original evidence trail.</text>

    <rect x="1084" y="326" width="410" height="88" rx="17" fill="#2e1925" stroke="#d7647f"/>
    <text x="1112" y="360" class="mono-red">node_unreachable</text>
    <text x="1112" y="389" class="mono">java-node-primary · retryable</text>

    <path d="M1289 414 L1289 456" stroke="#8a97af" stroke-width="3"/>
    <path d="M1278 446 L1289 459 L1300 446" fill="none" stroke="#8a97af" stroke-width="3"/>

    <rect x="1084" y="464" width="410" height="88" rx="17" fill="#2b264d" stroke="#8d7cff"/>
    <text x="1112" y="498" class="mono-purple">lease released</text>
    <text x="1112" y="527" class="mono">attempt 1 preserved in telemetry</text>

    <path d="M1289 552 L1289 594" stroke="#8a97af" stroke-width="3"/>
    <path d="M1278 584 L1289 597 L1300 584" fill="none" stroke="#8a97af" stroke-width="3"/>

    <rect x="1084" y="602" width="410" height="88" rx="17" fill="#12322a" stroke="#43d1a0"/>
    <text x="1112" y="636" class="mono-green">retry_reassigned</text>
    <text x="1112" y="665" class="mono">java-node-secondary · attempt 2</text>

    <text x="1084" y="746" class="label">RECOVERY EVIDENCE</text>
    <text x="1084" y="778" class="mono">pipeline_id: pipe_demo_01</text>
    <text x="1084" y="807" class="mono">action: retry_reassigned</text>
    <text x="1084" y="836" class="mono-green">status: recovered</text>
  </g>

  <text x="72" y="892" class="small">This visual demonstrates the contract and expected evidence fields. It does not claim a live production deployment or replace reproducible tests.</text>
</svg>
