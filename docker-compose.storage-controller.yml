services:
  storage-controller:
    build:
      context: .
      dockerfile: services/storage_controller/Dockerfile
    image: amosclaud/storage-controller:latest
    restart: unless-stopped
    privileged: true
    network_mode: host
    environment:
      AMOSCLAUD_STORAGE_CONTROLLER_ENABLED: "true"
      AMOSCLAUD_STORAGE_CONTROLLER_TOKEN: ${AMOSCLAUD_STORAGE_CONTROLLER_TOKEN:?set AMOSCLAUD_STORAGE_CONTROLLER_TOKEN}
      AMOSCLAUD_STORAGE_ALLOWED_MOUNTS: /mnt/amosclaud-volumes,/var/lib/amosclaud/repositories,/data/repositories
      AMOSCLAUD_STORAGE_FSTAB_PATH: /host/etc/fstab
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-}
      AWS_REGION: ${AWS_REGION:-}
    volumes:
      - /dev:/dev
      - /run/udev:/run/udev:ro
      - /etc/fstab:/host/etc/fstab
      - /mnt/amosclaud-volumes:/mnt/amosclaud-volumes:rshared
      - ${GOOGLE_APPLICATION_CREDENTIALS:-/dev/null}:${GOOGLE_APPLICATION_CREDENTIALS:-/dev/null}:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/live', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
