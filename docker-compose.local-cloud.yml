services:
  amosclaud-local-cloud:
    build: .
    command: ["python", "scripts/run_local_cloud.py"]
    network_mode: host
    environment:
      AMOSCLAUD_LOCAL_HOST: 127.0.0.1
      AMOSCLAUD_LOCAL_PORT: 8765
      AMOSCLAUD_LOCAL_STATE_DIR: /var/lib/amosclaud/local-cloud
      AMOSCLAUD_LOCAL_ALLOWED_ROOTS: /workspaces
    volumes:
      - amosclaud-local-state:/var/lib/amosclaud/local-cloud
      - ./workspaces:/workspaces
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

volumes:
  amosclaud-local-state:
