version: 2

human_approval:
  enabled: true
  issue_prefix: "[Amosclaud Approval Required]"
  trusted_associations:
    - OWNER
    - MEMBER
    - COLLABORATOR

  automatic_issue_creation:
    environment_or_secret_files: true
    personal_information_files: true
    ordinary_code_repairs: false
    workflow_or_infrastructure_repairs: false
    fork_pull_requests: false

  autonomous_fixer:
    all_open_pull_requests: true
    fork_pull_requests: repair_via_verified_base_repository_branch
    direct_default_branch_writes: false
    force_push: false
    required_verification:
      - reproduce_failure_without_repair_credentials
      - generate_bounded_candidate
      - credential_free_adaptive_pre_run
      - required_pull_request_checks

  protected_paths:
    - ".env"
    - ".env.*"
    - "**/secrets.json"
    - "**/credentials.json"
    - "**/personal-information.*"
    - "**/personal_information.*"
    - "**/personally-identifiable/**"
    - "**/personally_identifiable/**"
    - "**/pii/**"
    - "**/pii.json"
    - "**/pii.csv"

  protected_tool_hints:
    - .env
    - environment variable
    - secret
    - credential
    - password
    - private key
    - access token
    - api key
    - personal information
    - personally identifiable
    - pii
    - social security
    - passport
    - date of birth
    - home address
    - bank account
    - credit card

  decision_commands:
    approve: "@amosclaud approve"
    deny: "@amosclaud deny"

  execution_policy:
    approval_does_not_auto_execute: true
    rerun_original_command_after_approval: true

  audit:
    keep_approval_issue: true
    record_human_identity: true
    record_source_issue_or_pull_request: true
