name: amosclaud-production

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-amosclaud_db}
      POSTGRES_USER: ${POSTGRES_USER:-amosclaud}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - backend
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - sh
      - -ec
      - exec redis-server --appendonly yes --requirepass "$$(cat /run/secrets/redis_password)"
    secrets:
      - redis_password
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli -a "$$(cat /run/secrets/redis_password)" ping | grep -q PONG
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - backend
    security_opt:
      - no-new-privileges:true

  amoscloud_api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    command: ["sh", "/app/docker/production-entrypoint.sh"]
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      HOST: 0.0.0.0
      PORT: 8000
      WORKERS: ${WORKERS:-1}
      FORWARDED_ALLOW_IPS: "*"

      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-amosclaud_db}
      POSTGRES_USER: ${POSTGRES_USER:-amosclaud}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD_FILE: /run/secrets/redis_password

      SECRET_KEY_FILE: /run/secrets/secret_key
      AMOSCLAUD_MASTER_KEY_FILE: /run/secrets/amosclaud_master_key
      AMOSCLAUD_METRICS_TOKEN_FILE: /run/secrets/metrics_token
      AMOSCLAUD_DASHBOARD_KEY_FILE: /run/secrets/dashboard_key
      AMOSCLAUD_BYTE_BUS_SECRET_FILE: /run/secrets/byte_bus_secret
      AMOSCLAUD_PREVIEW_SERVICE_KEY_FILE: /run/secrets/preview_service_key
      AMOSCLAUD_API_KEY_FILE: /run/secrets/amosclaud_api_key
      GITHUB_CLIENT_SECRET_FILE: /run/secrets/github_client_secret
      GITHUB_TOKEN_ENCRYPTION_KEY_FILE: /run/secrets/github_token_encryption_key
      AMOSCLAUD_MODEL_TOKEN_FILE: /run/secrets/model_token
      STRIPE_SECRET_KEY_FILE: /run/secrets/stripe_secret_key
      STRIPE_WEBHOOK_SECRET_FILE: /run/secrets/stripe_webhook_secret

      PLATFORM_BASE_URL: https://${PRIMARY_DOMAIN:?Set PRIMARY_DOMAIN in .env.production}
      PUBLIC_APP_URL: https://${PRIMARY_DOMAIN:?Set PRIMARY_DOMAIN in .env.production}
      API_BASE_URL: https://${PRIMARY_DOMAIN:?Set PRIMARY_DOMAIN in .env.production}
      AMOSCLAUD_PUBLIC_URL: https://${PRIMARY_DOMAIN:?Set PRIMARY_DOMAIN in .env.production}
      AMOSCLAUD_API_URL: https://${PRIMARY_DOMAIN:?Set PRIMARY_DOMAIN in .env.production}
      GITHUB_CALLBACK_URL: https://${PRIMARY_DOMAIN:?Set PRIMARY_DOMAIN in .env.production}/api/v1/auth/github/callback
      GITHUB_REPOSITORY_CALLBACK_URL: https://${PRIMARY_DOMAIN:?Set PRIMARY_DOMAIN in .env.production}/api/v1/github/callback
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}

      AUTH_COOKIE_SECURE: "true"
      AUTH_SESSION_DAYS: ${AUTH_SESSION_DAYS:-7}
      REQUIRE_PERSISTENT_STORAGE: "true"
      AUTH_DB_PATH: /data/auth.db
      REPOSITORY_STORAGE_PATH: /data/repositories
      STORAGE_PATH: /data/storage
      DATA_DIR: /data
      AMOSCLAUD_DASHBOARD_DATA: /data/dashboard
      AMOSCLAUD_PREVIEW_DATA: /data/previews
      MAX_REPOSITORIES_PER_USER: ${MAX_REPOSITORIES_PER_USER:-10}
      MAX_REPOSITORY_BYTES: ${MAX_REPOSITORY_BYTES:-524288000}

      AMOSCLAUD_MODEL_URL: ${AMOSCLAUD_MODEL_URL:?Set AMOSCLAUD_MODEL_URL in .env.production}
      AMOSCLAUD_MODEL_COMPLETIONS_PATH: ${AMOSCLAUD_MODEL_COMPLETIONS_PATH:-/v1/chat/completions}
      AMOSCLAUD_MODEL: ${AMOSCLAUD_MODEL:-qwen2.5-coder:1.5b}
      AMOSCLAUD_MODEL_PROBE_TIMEOUT: ${AMOSCLAUD_MODEL_PROBE_TIMEOUT:-10}
      AMOSCLAUD_MODEL_TIMEOUT: ${AMOSCLAUD_MODEL_TIMEOUT:-300}
      AMOSCLAUD_MODEL_RETRIES: ${AMOSCLAUD_MODEL_RETRIES:-2}
      AMOSCLAUD_ALLOW_EXTERNAL_ADAPTERS: ${AMOSCLAUD_ALLOW_EXTERNAL_ADAPTERS:-false}

      STRIPE_FULL_MONTHLY_PRICE_ID: ${STRIPE_FULL_MONTHLY_PRICE_ID:-}
      STRIPE_FULL_ANNUAL_PRICE_ID: ${STRIPE_FULL_ANNUAL_PRICE_ID:-}
      STRIPE_AGENT_STARTER_PRICE_ID: ${STRIPE_AGENT_STARTER_PRICE_ID:-}
      STRIPE_AGENT_BUILDER_PRICE_ID: ${STRIPE_AGENT_BUILDER_PRICE_ID:-}
      STRIPE_AGENT_STUDIO_PRICE_ID: ${STRIPE_AGENT_STUDIO_PRICE_ID:-}
    secrets:
      - postgres_password
      - redis_password
      - secret_key
      - amosclaud_master_key
      - metrics_token
      - dashboard_key
      - byte_bus_secret
      - preview_service_key
      - amosclaud_api_key
      - github_client_secret
      - github_token_encryption_key
      - model_token
      - stripe_secret_key
      - stripe_webhook_secret
    expose:
      - "8000"
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - amoscloud_data:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"
      interval: 15s
      timeout: 8s
      retries: 10
      start_period: 45s
    networks:
      - edge
      - backend
    security_opt:
      - no-new-privileges:true

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      PRIMARY_DOMAIN: ${PRIMARY_DOMAIN:?Set PRIMARY_DOMAIN in .env.production}
      APEX_DOMAIN: ${APEX_DOMAIN:?Set APEX_DOMAIN in .env.production}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env.production}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      amoscloud_api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - edge
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
  redis_data:
  amoscloud_data:
  caddy_data:
  caddy_config:

networks:
  edge:
    driver: bridge
  backend:
    driver: bridge
    internal: true

secrets:
  postgres_password:
    file: ./secrets/postgres_password
  redis_password:
    file: ./secrets/redis_password
  secret_key:
    file: ./secrets/secret_key
  amosclaud_master_key:
    file: ./secrets/amosclaud_master_key
  metrics_token:
    file: ./secrets/metrics_token
  dashboard_key:
    file: ./secrets/dashboard_key
  byte_bus_secret:
    file: ./secrets/byte_bus_secret
  preview_service_key:
    file: ./secrets/preview_service_key
  amosclaud_api_key:
    file: ./secrets/amosclaud_api_key
  github_client_secret:
    file: ./secrets/github_client_secret
  github_token_encryption_key:
    file: ./secrets/github_token_encryption_key
  model_token:
    file: ./secrets/model_token
  stripe_secret_key:
    file: ./secrets/stripe_secret_key
  stripe_webhook_secret:
    file: ./secrets/stripe_webhook_secret
