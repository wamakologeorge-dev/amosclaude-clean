[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "amosclaud-quick"
version = "1.0.0"
description = "Local, zero-account repository context and deterministic guardrails from Amosclaud."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6,<7"]
license = {file = "LICENSE"}
authors = [{name = "Amosclaud Team"}]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

[project.scripts]
amosclaud-quick = "amoscloud_ai.quickcheck_cli:main"

[tool.setuptools.packages.find]
include = ["amoscloud_ai*"]
